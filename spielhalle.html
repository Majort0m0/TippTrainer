  const FOG_T = [0, 0.1, 0.22, 0.38, 0.56, 0.75];
  const FOGLV = new Uint8Array(DRAW + 1);
  for (let n = 0; n <= DRAW; n++) {
    const f = n / DRAW;
    FOGLV[n] = f < 0.25 ? 0 : Math.min(FOG_N - 1, 1 + Math.floor((f - 0.25) / 0.75 * (FOG_N - 1)));
  }

  function buildTrack(def) {
    const segs = [], sections = [];
    let y = 0;
    const add = (curve, ny) => { segs.push({ i: 0, curve, y1: y, y2: ny, light: false, sprites: [] }); y = ny; };
    const road = (en, ho, le, cu, dh) => {
      const y0 = y, yE = y0 + dh, n = en + ho + le, start = segs.length;
      if (!n) return;
      for (let i = 0; i < en; i++) add(easeIn(0, cu, i / en), easeInOut(y0, yE, (i + 1) / n));
      for (let i = 0; i < ho; i++) add(cu, easeInOut(y0, yE, (en + i + 1) / n));
      for (let i = 0; i < le; i++) add(easeInOut(cu, 0, i / le), easeInOut(y0, yE, (en + ho + i + 1) / n));
      sections.push({ start, n, curve: cu, dh });
    };
    for (const s of def.layout) road(s[0], s[1], s[2], s[3], s[4]);
    if (Math.abs(y) > 0.5) road(30, 20, 30, 0, -y);      // Rundkurs schließen
    while (segs.length % (2 * BAND)) add(0, y);
    segs[segs.length - 1].y2 = 0;
    segs.forEach((s, i) => { s.i = i; s.light = Math.floor(i / BAND) % 2 === 0; });
    const tr = { def, segs, sections, n: segs.length, len: segs.length * SEG };
    // Zeitvorgaben aus der Rundenlänge
    const lapRef = tr.len / (MAXV * 0.8);
    tr.startTime = clamp(Math.round(lapRef * 1.25 + 7), 45, 60);
    tr.lapBonus = lapRef * def.bonus;
    // Farben mit Dunst in FOG_N Stufen
    const base = [def.grass[0], def.grass[1], def.rumble[0], def.rumble[1], def.asphalt[0], def.asphalt[1], def.lane];
    tr.pal = base.map(c => FOG_T.map(t => mix(c, def.fog, t)));
    tr.fogCache = new Map();   // Sprite-Farbe -> Dunststufen (bei Bedarf gefüllt)
    tr.ground = mix(def.grass[1], def.fog, 0.6);
    decorate(tr);
    tr.bg = buildBg(def);
    return tr;
  }

  function decorate(tr) {
    const def = tr.def, r = rng(def.seed), N = tr.n, segs = tr.segs, used = new Set();
    const wrapI = i => ((i % N) + N) % N;
    // Hindernisse: Bodenkontakt hx = [von, bis, ...] in Straßen-Einheiten; seitliche Objekte
    // rücken so weit nach außen, dass der Rüttelstreifen frei bleibt
    const add = (i, spr, x, flip) => {
      i = wrapI(i);
      flip = !!flip;
      let hx = null;
      if (spr.foot) {
        const k = PX * spr.s / ROAD_W, c = spr.w / 2;
        hx = [];
        for (const [a, b] of spr.foot) hx.push(((flip ? spr.w - b : a) - c) * k, ((flip ? spr.w - a : b) - c) * k);
        if (x > 0) x = Math.max(x, SAFE - Math.min(...hx));
        else if (x < 0) x = Math.min(x, -SAFE - Math.max(...hx));
        for (let j = 0; j < hx.length; j++) hx[j] += x;
      }
      segs[i].sprites.push({ spr, x, flip, hx });
      used.add(i + ',' + Math.sign(x));
    };
    const free = (i, side) => !used.has(wrapI(i) + ',' + side) && wrapI(i) > 6 && wrapI(i) < N - 6;
    const pick = a => a[Math.floor(r() * a.length)];
    add(0, SPR.gantry[0], 0);
    // Kurvenwarnschilder an der Außenseite
    for (const s of tr.sections) {
      if (Math.abs(s.curve) < 3) continue;
      const side = s.curve > 0 ? -1 : 1;
      for (let k = 0; k < 5; k++) if (free(s.start - 8 + k * 5, side)) add(s.start - 8 + k * 5, SPR.chev, side * 1.32, s.curve < 0);
    }
    if (def.theme === 'coast') {
      for (let i = 40; i < N - 30; i += 55 + Math.floor(r() * 40)) {
        const side = r() < 0.5 ? -1 : 1;
        if (!free(i, side)) continue;
        add(i, SPR.hut, side * (2.9 + r() * 0.5));
        if (free(i + 3, side)) add(i + 3, SPR.parasol, side * (1.75 + r() * 0.3));
        if (free(i + 6, side)) add(i + 6, SPR.parasol, side * (2.2 + r() * 0.3));
      }
      for (let i = 80; i < N - 30; i += 120 + Math.floor(r() * 60)) {
        const side = r() < 0.5 ? -1 : 1;
        if (free(i, side)) add(i, pick(SPR.board.coast), side * 1.8);
      }
      for (let i = 10; i < N - 8; i += 5 + Math.floor(r() * 5)) {
        for (const side of [-1, 1]) if (r() < 0.7 && free(i, side)) add(i, pick(SPR.palm), side * (1.5 + r() * 0.9), r() < 0.5);
      }
    } else if (def.theme === 'desert') {
      for (let i = 70; i < N - 30; i += 130 + Math.floor(r() * 60)) {
        const side = r() < 0.5 ? -1 : 1;
        if (free(i, side)) add(i, pick(SPR.board.desert), side * 1.8);
      }
      for (let i = 14; i < N - 8; i += 14 + Math.floor(r() * 14)) {
        const side = r() < 0.5 ? -1 : 1;
        if (free(i, side)) add(i, pick(SPR.rock), side * (1.6 + r() * 1.4), r() < 0.5);
      }
      for (let i = 9; i < N - 8; i += 6 + Math.floor(r() * 7)) {
        for (const side of [-1, 1]) if (r() < 0.55 && free(i, side)) add(i, pick(SPR.cactus), side * (1.4 + r() * 1.3));
      }
    } else {
      for (let i = 60; i < N - 30; i += 70 + Math.floor(r() * 50)) {
        const side = r() < 0.5 ? -1 : 1;
        if (free(i, side)) add(i, pick(SPR.board.night), side * 1.85);
      }
      for (let i = 10; i < N - 8; i += 10) {
        for (const side of [-1, 1]) if (free(i, side)) add(i, SPR.lamp, side * 1.32, side > 0);
      }
      for (let i = 15; i < N - 10; i += 9 + Math.floor(r() * 8)) {
        const side = r() < 0.5 ? -1 : 1;
        if (free(i, side)) add(i, pick(SPR.bld), side * (3.1 + r() * 0.8));
      }
    }
  }

  // Hintergrund-Ebenen (Parallaxe). Maße in Einheiten, Muster wiederholt sich.
  function buildBg(def) {
    const r = rng(def.seed + 7), bg = { theme: def.theme };
    if (def.theme === 'coast') {
      bg.clouds = [0, 1, 2, 3].map(i => ({ spr: SPR.cloud[i % 3], x: i * 15 + r() * 8, y: 0.1 + r() * 0.32, s: 0.14 + r() * 0.08 }));
      bg.islands = [[3, 9, 1.2], [17, 4, 0.6], [30, 13, 1.9], [46, 6, 0.9]].map(([x, w, h]) => {
        const pts = [];
        for (let j = 0; j <= 10; j++) {
          pts.push(x + j / 10 * w, h * Math.pow(Math.sin(j / 10 * Math.PI), 0.8) * (0.85 + 0.15 * Math.sin(j * 2.3)));
        }
        return pts;
      });
    } else if (def.theme === 'desert') {
      const mesas = (count, hMin, hMax) => {
        const a = [];
        let x = 0;
        for (let i = 0; i < count; i++) {
          const w = 2 + r() * 5, h = hMin + r() * (hMax - hMin);
          a.push([x, w, h, 0.4 + r() * 0.8]);
          x += w + 1 + r() * 4;
        }
        return { list: a, pw: x + 2 };
      };
      bg.far = mesas(9, 0.8, 2.2);
      bg.near = mesas(7, 1.2, 3.4);
    } else {
      bg.stars = [];
      for (let i = 0; i < 60; i++) bg.stars.push(r() * 56, r() * 0.85, r() < 0.2 ? 0.16 : 0.1);
      const city = (count, hMin, hMax, lit) => {
        const list = [], wins = [];
        let x = 0;
        for (let i = 0; i < count; i++) {
          const w = 1.6 + r() * 2.6, h = hMin + r() * (hMax - hMin);
          list.push([x, w, h]);
          for (let wy = 0.4; wy < h - 0.3; wy += 0.5) for (let wx = 0.3; wx < w - 0.3; wx += 0.45) {
            if (r() < lit) wins.push(x + wx, wy, Math.floor(r() * 3));
          }
          x += w + r() * 0.6;
        }
        return { list, wins, pw: x };
      };
      bg.far = city(14, 1.5, 4.2, 0.18);
      bg.near = city(12, 1.2, 3.2, 0.32);
    }
    return bg;
  }

  const TRACKS = STAGES.map(buildTrack);

  // ----------------------------------------------------------
  //  Spielzustand
  // ----------------------------------------------------------
  let state = 'title', stT = 0, tick = 0, paused = false;
  let hi = 0, titleStage = 1, stageNo = 1, stageIdx = 0, round = 0, track = TRACKS[0];
  let pz = 0, px = 0, speed = 0, steer = 0, slideV = 0, travel = 0, bgScroll = 0, wheel = 0;
  let time = 0, lapsDone = 0, score = 0, scoreAcc = 0, newRecord = false, clearDone = -1;
  let crashT = 0, invulT = 0, wobbleT = 0, shakeT = 0, flashT = 0, losT = 0, bumpCD = 0, fireT = 0;
  let offRoad = false, onRumble = false, skid = 0, rev = 0, gear = 1, rpm = 0.2, apLane = 1;
  let cGas = false, cBrake = false, cSteer = 0, lastSteer = 0;
  let clearGain = 0, selDir = 0, selNudge = 0;
  let carsLeft = CARS, overReason = '';
  let cars = [], grnd = rng(1), banner = null;
  const popups = [], parts = [];
  const down = new Set(), ptrs = new Map();

  function loadHi() {
    let v = 0;
    try { v = Number(Core.storage.get('racer.hi', 0)); } catch (e) { v = 0; }
    hi = Math.max(hi, Number.isFinite(v) && v > 0 ? Math.floor(v) : 0);
  }
  function saveHi() {
    try { Core.storage.set('racer.hi', hi); } catch (e) { /* egal */ }
  }
  loadHi();

  const wrapZ = z => { const L = track.len; z %= L; return z < 0 ? z + L : z; };
  const rel = d => { const L = track.len; d = ((d % L) + L) % L; return d >= L / 2 ? d - L : d; };
  const segAt = z => track.segs[Math.floor(wrapZ(z) / SEG) % track.n];
  const lapBonus = () => Math.round(track.lapBonus * Math.max(0.7, 1 - 0.09 * round));
  const raceLike = () => state === 'lights' || state === 'race' || state === 'timeup' || state === 'clear';

  function loadStage(no, attract) {
    stageNo = no;
    stageIdx = (no - 1) % TRACKS.length;
    round = Math.floor((no - 1) / TRACKS.length);
    track = TRACKS[stageIdx];
    pz = wrapZ(-START_BACK); travel = -START_BACK;
    px = 0; speed = 0; steer = 0; slideV = 0; bgScroll = 0; wheel = 0;
    crashT = 0; invulT = 0; wobbleT = 0; shakeT = 0; flashT = 0; losT = 0; bumpCD = 0; fireT = 0;
    offRoad = false; onRumble = false; skid = 0; rev = 0; gear = 1; rpm = 0.2; apLane = 1;
    lapsDone = 0; clearDone = -1;
    time = track.startTime;
    grnd = rng(no * 977 + 13);
    popups.length = 0; parts.length = 0; banner = null;
    spawnTraffic(attract ? 10 : Math.min(36, track.def.traffic + 5 * round));
  }

  function spawnTraffic(count) {
    cars = [];
    const span = track.n - 80;
    for (let i = 0; i < count; i++) {
      const off = 14 + (i + grnd() * 0.7) * span / count;
      const lane = Math.floor(grnd() * LANES);
      const base = MAXV * Math.min(0.74, 0.4 + grnd() * 0.2 + 0.035 * round);
      cars.push({
        z: wrapZ(pz + off * SEG), x: LANE_X[lane], tx: LANE_X[lane], nx: LANE_X[lane], sig: 0, sigT: 0, v: base, base,
        type: TYPES[Math.floor(grnd() * TYPES.length)], passed: false, d: off * SEG, laneT: 0,
        wander: grnd() < 0.25 + 0.08 * round, wT: 120 + Math.floor(grnd() * 300), ph: grnd() * 4
      });
    }
  }

  // ----------------------------------------------------------
  //  Verkehr
  // ----------------------------------------------------------
  // Spur bei x frei? Andere Autos (auch ihre Ziel-Spur) und der Spieler: nie direkt vor
  // ihn oder neben ihn ziehen
  function laneFree(c, x) {
    for (const o of cars) {
      if (o === c || (Math.abs(o.x - x) > 0.45 && Math.abs(o.tx - x) > 0.45)) continue;
      const d = rel(o.z - c.z);
      if (d > -4 * SEG && d < 8 * SEG) return false;
    }
    const dp = rel(c.z - pz);
    return !(Math.abs(px - x) < 0.5 && dp > -2 * SEG && dp < 7 * SEG);
  }

  // Spurwechsel ankündigen: erst blinken (SIG_T), dann ziehen, falls noch frei
  function changeLane(c) {
    let li = 0;
    for (let l = 1; l < LANES; l++) if (Math.abs(LANE_X[l] - c.tx) < Math.abs(LANE_X[li] - c.tx)) li = l;
    const a = li - 1, b = li + 1, first = grnd() < 0.5 ? a : b, second = first === a ? b : a;
    for (const l of [first, second]) {
      if (l >= 0 && l < LANES && laneFree(c, LANE_X[l])) {
        c.nx = LANE_X[l]; c.sig = Math.sign(c.nx - c.tx); c.sigT = SIG_T; c.laneT = 110 + SIG_T;
        return true;
      }
    }
    return false;
  }

  function moveCars() {
    for (const c of cars) {
      let gap = 1e9, gv = 0;
      for (const o of cars) {
        if (o === c || Math.abs(o.x - c.x) > 0.42) continue;
        const d = rel(o.z - c.z);
        if (d > 0 && d < gap) { gap = d; gv = o.v; }
      }
      const dp = rel(pz - c.z);
      if (dp > 0 && dp < gap && Math.abs(px - c.x) < 0.5) { gap = dp; gv = speed; }
      let want = c.base;
      c.laneT--;
      if (c.sigT > 0) {
        if (--c.sigT === 0) {
          if (laneFree(c, c.nx)) c.tx = c.nx;
          else { c.sig = 0; c.laneT = 20; }
        }
      } else if (c.sig && Math.abs(c.x - c.tx) < 0.01) c.sig = 0;
      if (gap < 10 * SEG && gv < c.v + 1) {
        if (c.laneT <= 0 && !c.sigT && !changeLane(c)) c.laneT = 20;
        if (gap < 6 * SEG) want = Math.min(want, gv * (gap < 3 * SEG ? 0.85 : 0.98));
      } else if (c.wander && c.laneT < -c.wT && !c.sigT) {
        if (!changeLane(c)) c.laneT = 110;
      }
      c.v += clamp(want - c.v, -MAXV * 0.7 * DT, MAXV * 0.2 * DT);
      if (c.v < 0) c.v = 0;
      c.x += clamp(c.tx - c.x, -0.7 * DT, 0.7 * DT);
      c.z = wrapZ(c.z + c.v * DT);
      c.ph += c.v * DT / 260;
    }
  }

  // Überholen: Bonus einmal pro Begegnung (erst nach halber Runde Abstand wieder)
  function trackCars(award) {
    const L = track.len;
    for (const c of cars) {
      const d = rel(c.z - pz);
      if (award && c.d > 0 && d <= 0 && c.d < L / 4 && d > -L / 4 && !c.passed) {
        c.passed = true;
        addScore(100);
        popup('+100', 14, 27.2, COL.yellow, 1);
        sfx('pass');
      }
      if (Math.abs(d) > L / 3) c.passed = false;
      c.d = d;
    }
  }

  // ----------------------------------------------------------
  //  Fahrphysik
  // ----------------------------------------------------------
  function addScore(n) { score += n; }

  function advance(dz) {
    pz = wrapZ(pz + dz);
    travel += dz;
    bgScroll -= segAt(pz).curve * dz / SEG * 0.05;
    wheel += Math.min(dz, 60) / 120;   // Radphase: höchstens alle 2 Ticks wechseln
  }

  function drive(gas, brake, sIn, live) {
    const seg = segAt(pz), u = speed / MAXV, prevZ = pz, prevX = px, prevGear = gear;
    steer += clamp(sIn - steer, -0.12, 0.12);
    px += steer * STEER * u * DT;
    px -= u * u * cent(seg.curve) * DT;            // Fliehkraft
    px += slideV * DT;
    slideV *= 0.9;
    if (gas) speed += MAXV * ACCEL * Math.max(0.03, 1 - u * u) * DT;
    else speed -= MAXV * DRAG * DT;
    if (brake) speed -= MAXV * BRAKE * DT;
    speed -= (seg.y2 - seg.y1) / SEG * MAXV * SLOPE * DT;
    const ax = Math.abs(px);
    onRumble = ax > 0.86 && ax <= 1.1;
    offRoad = ax > 1.1;
    if (offRoad && speed > MAXV * OFF_MAX) speed = Math.max(MAXV * OFF_MAX, speed - MAXV * OFF_DRAG * DT);
    speed = clamp(speed, 0, MAXV);
    px = clamp(px, -2.6, 2.6);
    const cf = u * u * Math.abs(cent(seg.curve));
    skid = offRoad ? 0 : u > 0.4 ? clamp((cf - 1.3) / 1.4, 0, 1) : 0;
    if (brake && u > 0.35 && !offRoad) skid = Math.max(skid, 0.7);
    const dz = speed * DT;
    advance(dz);
    if (live) scoreAcc += dz / SEG * (offRoad ? 0.3 : 1);
    if (scoreAcc >= 1) { const p = Math.floor(scoreAcc); scoreAcc -= p; addScore(p); }
    rpm = engineRpm();
    if (gear > prevGear && u > 0.3) { fireT = 8; sfx('shift'); }
    hitScenery(prevZ, prevX, dz);
    effects(gas);
  }

  const GEARS = [0, 0.16, 0.34, 0.54, 0.76, 1.01];
  function engineRpm() {
    const u = speed / MAXV;
    while (gear < 5 && u > GEARS[gear]) gear++;
    while (gear > 1 && u < GEARS[gear - 1] - 0.03) gear--;
    const lo = GEARS[gear - 1], hiG = GEARS[gear];
    return clamp(0.3 + 0.7 * (u - lo) / (hiG - lo), 0.2, 1.05);
  }

  // berührt ein Auto mit Mitte x den Bodenkontakt des Hindernisses?
  function touches(sp, x) {
    const hx = sp.hx, hc = P_HALF * 0.8;
    if (!hx) return false;
    for (let k = 0; k < hx.length; k += 2) if (x + hc > hx[k] && x - hc < hx[k + 1]) return true;
    return false;
  }

  function hitScenery(prevZ, prevX, dz) {
    if (Math.abs(px) < 1.0 || crashT) return;
    const N = track.n, F = CAR_LEN * 0.6;
    const i0 = Math.floor(prevZ / SEG) + 1, i1 = Math.floor((prevZ + dz + F) / SEG);
    for (let i = i0; i <= i1; i++) {
      for (const sp of track.segs[i % N].sprites) {
        if (!touches(sp, px)) continue;
        if (speed > MAXV * CRASH_V) crash();
        else {
          // langsam angestoßen: etwas zurückprallen und Richtung Straße schieben,
          // sonst bliebe das Auto (Lenkung braucht Tempo) am Hindernis hängen
          const back = Math.min(60, dz + 30);
          speed = 0;
          px = prevX;
          pz = wrapZ(pz - back);
          travel -= back;
          slideV = (px > 0 ? -1 : 1) * 2.2;
          if (bumpCD <= 0) { sfx('thud'); bumpCD = 20; shakeT = 4; }
        }
        return;
      }
    }
  }

  function crash() {
    if (state === 'race') carsLeft = Math.max(0, carsLeft - 1);   // nur echte Rennen kosten ein Auto
    crashT = CRASH_T; shakeT = 26; flashT = 8; slideV = 0; wobbleT = 0;
    speed *= 0.12;   // Aufprall: das Auto bleibt am Hindernis hängen
    for (let i = 0; i < 16; i++) {
      const a = grnd() * Math.PI * 2, v = 3 + grnd() * 7;
      spark(0, -1.2, Math.cos(a) * v, Math.sin(a) * v - 4, i % 3 ? '#ffb030' : '#5a5050', 30 + Math.floor(grnd() * 30), 0.3);
    }
    sfx('crash');
  }

  function crashTick() {
    crashT--;
    speed = Math.max(0, speed - MAXV * 2.2 * DT);
    advance(speed * DT);
    if (crashT > 30 && tick % 3 === 0) spark(grnd() * 2 - 1, -1.6, (grnd() - 0.5) * 2, -2 - grnd() * 2, '#3c3434', 40, 0.5);
    if (crashT <= 0) {
      crashT = 0; px = 0; speed = 0; steer = 0; slideV = 0; invulT = INVUL_T; gear = 1;
      if (state === 'race') {
        if (carsLeft <= 0) { overReason = 'cars'; gameOver(); return; }
        banner = { text: carsLeft === 1 ? 'LETZTES AUTO!' : 'NOCH ' + carsLeft + ' AUTOS', sub: null, t: 120 };
      }
    }
  }

  function bump(c) {
    const old = pz;
    speed = Math.min(speed, c.v) * 0.62;
    pz = wrapZ(c.z - HIT_LEN - 30);
    travel += rel(pz - old);
    slideV = (px >= c.x ? 1 : -1) * 1.1;
    c.v = Math.min(c.base * 1.1, c.v + MAXV * 0.05);
    wobbleT = 36; shakeT = 10; bumpCD = 20;
    const hx = clamp((c.x - px) * 6, -2, 2);
    for (let i = 0; i < 8; i++) {
      spark(hx, -2.2, (grnd() - 0.5) * 8, -3 - grnd() * 5, i % 2 ? '#ffff60' : '#ffffff', 18, 0.18);
    }
    sfx('bump');
  }

  function hitCars() {
    if (crashT || invulT || bumpCD > 0) return;
    for (const c of cars) {
      const d = rel(c.z - pz);
      if (d <= -HIT_LEN || d >= HIT_LEN) continue;
      if (Math.abs(px - c.x) >= (P_HALF + c.type.half) * 0.82) continue;
      if (d > 0 && speed >= c.v) { bump(c); return; }
      // seitlich gestreift
      speed *= 0.85;
      slideV = (px >= c.x ? 1 : -1) * 1.3;
      wobbleT = 24; shakeT = 6; bumpCD = 20;
      sfx('bump');
      return;
    }
  }

  function checkLap() {
    if (travel < (lapsDone + 1) * track.len) return;
    lapsDone++;
    if (lapsDone >= LAPS) { stageClear(); return; }
    const b = lapBonus();
    time += b;
    banner = { text: 'ZEITBONUS +' + b, sub: lapsDone === LAPS - 1 ? 'LETZTE RUNDE!' : 'RUNDE ' + (lapsDone + 1) + '/' + LAPS, t: 150 };
    sfx('lap');
    sfx('extend');
  }

  // Autopilot (Titel-Demo und Zieleinlauf)
  function autopilot(cruise) {
    const N = track.n, i0 = Math.floor(pz / SEG), u = speed / MAXV;
    let cmax = 0;
    for (let k = 0; k < 16; k++) cmax = Math.max(cmax, Math.abs(track.segs[(i0 + k) % N].curve));
    const vmax = Math.min(cruise, 0.85 * uHold(cmax));
    let blocked = false;
    for (const c of cars) {
      const d = rel(c.z - pz);
      if (d > 0 && d < 14 * SEG && Math.abs(c.x - LANE_X[apLane]) < 0.45 && c.v < speed + 1) { blocked = true; break; }
    }
    if (blocked) {
      let best = apLane, bestGap = -1;
      for (let l = 0; l < LANES; l++) {
        let gap = 1e9;
        for (const c of cars) {
          const d = rel(c.z - pz);
          if (d > -CAR_LEN && Math.abs(c.x - LANE_X[l]) < 0.45 && d < gap) gap = d;
        }
        if (gap > bestGap + (l === apLane ? -1 : 300)) { bestGap = gap; best = l; }
      }
      apLane = best;
    }
    const curve = segAt(pz).curve;
    const ff = u * u * cent(curve) / (STEER * Math.max(u, 0.08));
    cSteer = clamp((LANE_X[apLane] - px) * 3 + ff, -1, 1);
    cGas = u < vmax - 0.02;
    cBrake = u > vmax + 0.1;
  }

  // Spielereingaben (Tasten + Finger)
  function readControls() {
    let L = down.has('ArrowLeft') || down.has('KeyA'), R = down.has('ArrowRight') || down.has('KeyD');
    let gas = down.has('ArrowUp') || down.has('KeyW');
    const brake = down.has('ArrowDown') || down.has('KeyS');
    for (const p of ptrs.values()) {
      if (p.ui || p.x < 0 || p.x > SW || p.y < 0 || p.y > 36) continue;
      gas = true;
      if (p.x < SW / 3) L = true;
      else if (p.x > SW * 2 / 3) R = true;
    }
    cGas = gas; cBrake = brake;
    cSteer = L && R ? lastSteer : L ? -1 : R ? 1 : 0;
  }

  // ----------------------------------------------------------
  //  Effekte (Funken, Staub, Rauch, Einblendungen)
  // ----------------------------------------------------------
  function spark(x, y, vx, vy, color, life, size) {
    if (parts.length >= 64) parts.shift();
    parts.push({ x, y, vx, vy, color, life, max: life, size });
  }
  function popup(text, x, y, color, size) {
    if (popups.length >= 6) popups.shift();
    // frische Einblendungen an gleicher Stelle stapeln statt überlagern
    for (const p of popups) if (p.x === x && p.t > 36) y = Math.min(y, p.y - 1.1 * size);
    popups.push({ text, x, y, color, size, t: 60 });
  }

  function effects(gas) {
    const u = speed / MAXV;
    if (offRoad && u > 0.05 && tick % 2 === 0) {
      const dust = track.def.grass[1];
      for (const sx of [-1, 1]) spark(sx * 2.3 + (grnd() - 0.5), -0.3, sx * (1 + grnd() * 2), -2 - grnd() * 3 * u, dust, 22, 0.32);
    }
    if (skid > 0.3 && tick % 3 === 0) {
      for (const sx of [-1, 1]) spark(sx * 2.2, -0.2, sx * grnd(), -1 - grnd(), '#d0d0d0', 26, 0.4);
    }
    if (gas && u < 0.25 && tick % 5 === 0) spark((grnd() - 0.5) * 0.6, -0.6, (grnd() - 0.5) * 1.5, -1.5, '#9a9aa0', 20, 0.28);
  }

  function updateFx() {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * DT; p.y += p.vy * DT; p.vy += 6 * DT;
      if (--p.life <= 0) parts.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 0.035;
      if (--p.t <= 0) popups.splice(i, 1);
    }
    if (banner && --banner.t <= 0) banner = null;
    if (shakeT > 0) shakeT--;
    if (flashT > 0) flashT--;
    if (wobbleT > 0) wobbleT--;
    if (bumpCD > 0) bumpCD--;
    if (invulT > 0) invulT--;
    if (losT > 0) losT--;
    if (fireT > 0) fireT--;
    if (selNudge > 0) selNudge--;
  }

  // ----------------------------------------------------------
  //  Ton (alles synthetisch): Motor + Rauschen auf eigenen Gain-Knoten,
  //  Effekte über einen eigenen Bus, der bei Pause/Ende stummgeschaltet wird
  // ----------------------------------------------------------
  let snd = null, alive = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function sndStart() {
    const A = Core.audio, ac = A && A.ctx;
    if (!ac || !A.master) return;
    if (snd && snd.ac === ac) return;
    if (snd) sndKill();
    try {
      const t = ac.currentTime, master = A.master;
      const eng = ac.createGain();
      eng.gain.setValueAtTime(0, t);
      eng.connect(master);
      const filt = ac.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(500, t);
      filt.Q.setValueAtTime(3, t);
      filt.connect(eng);
      const o1 = ac.createOscillator(), o2 = ac.createOscillator();
      const g1 = ac.createGain(), g2 = ac.createGain();
      o1.type = 'sawtooth';
      o2.type = 'square';
      o1.frequency.setValueAtTime(45, t);
      o2.frequency.setValueAtTime(22.5, t);
      g1.gain.setValueAtTime(0.6, t);
      g2.gain.setValueAtTime(0.4, t);
      o1.connect(g1); g1.connect(filt);
      o2.connect(g2); g2.connect(filt);
      const rate = ac.sampleRate > 0 ? ac.sampleRate : 44100;
      const nbuf = ac.createBuffer(1, Math.floor(rate), rate);
      const data = nbuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const nsrc = ac.createBufferSource();
      nsrc.buffer = nbuf;
      nsrc.loop = true;
      const nf = ac.createBiquadFilter();
      nf.type = 'lowpass';
      nf.frequency.setValueAtTime(400, t);
      nf.Q.setValueAtTime(1, t);
      const ng = ac.createGain();
      ng.gain.setValueAtTime(0, t);
      nsrc.connect(nf); nf.connect(ng); ng.connect(master);
      o1.start(t); o2.start(t); nsrc.start(t);
      snd = { ac, eng, filt, o1, o2, nbuf, nsrc, nf, ng, sfx: null, f: 0, v: -1, nv: -1, nmode: '' };
      newSfxBus();
    } catch (e) { snd = null; }
  }

  function newSfxBus() {
    if (!snd) return;
    try {
      const g = snd.ac.createGain();
      g.gain.setValueAtTime(1, snd.ac.currentTime);
      g.connect(Core.audio.master);
      snd.sfx = g;
    } catch (e) { /* egal */ }
  }

  function fade(params) {
    const t = snd.ac.currentTime;
    for (const p of params) {
      if (!p) continue;
      p.cancelScheduledValues(t);
      p.setTargetAtTime(0, t, 0.02);
    }
  }

  // Motor und Rauschen aus (Game Over), Effekte laufen weiter
  function sndQuiet() {
    if (!snd) return;
    try { fade([snd.eng.gain, snd.ng.gain]); } catch (e) { /* egal */ }
    snd.v = 0; snd.nv = 0; snd.nmode = '';
  }

  // alles stumm (Pause)
  function sndSilence() {
    if (!snd) return;
    try { fade([snd.eng.gain, snd.ng.gain, snd.sfx && snd.sfx.gain]); } catch (e) { /* egal */ }
    snd.v = 0; snd.nv = 0; snd.nmode = '';
  }

  // alles stoppen (Titel, Verlassen)
  function sndKill() {
    if (!snd) return;
    const s = snd;
    snd = null;
    try {
      const t = s.ac.currentTime;
      for (const p of [s.eng.gain, s.ng.gain, s.sfx && s.sfx.gain]) {
        if (!p) continue;
        p.cancelScheduledValues(t);
        p.setTargetAtTime(0, t, 0.02);
      }
      s.o1.stop(t + 0.15);
      s.o2.stop(t + 0.15);
      s.nsrc.stop(t + 0.15);
    } catch (e) { /* egal */ }
  }

  function sndUpdate() {
    if (!snd || paused || state === 'over' || state === 'title') return;
    const t = snd.ac.currentTime, u = speed / MAXV;
    let r, vol;
    if (state === 'lights') { r = 0.16 + rev * 0.8; vol = 0.03 + rev * 0.02; }
    else if (crashT) { r = 0.15; vol = 0.012; }
    else { r = rpm; vol = 0.026 + 0.02 * rpm + (cGas && state === 'race' ? 0.008 : 0); }
    const f = 34 + r * 110 + gear * 4;
    try {
      if (Math.abs(f - snd.f) > 0.4) {
        snd.o1.frequency.setTargetAtTime(f, t, 0.025);
        snd.o2.frequency.setTargetAtTime(f * 0.5, t, 0.025);
        snd.filt.frequency.setTargetAtTime(240 + r * 1200 + (cGas ? 350 : 0), t, 0.04);
        snd.f = f;
      }
      if (Math.abs(vol - snd.v) > 0.002) { snd.eng.gain.setTargetAtTime(vol, t, 0.05); snd.v = vol; }
      // Rauschen: Gelände, Rüttelstreifen, quietschende Reifen
      let mode = '', nv = 0;
      if (crashT || state === 'lights') nv = 0;
      else if (offRoad && u > 0.03) { mode = 'off'; nv = 0.06 + 0.16 * Math.min(1, u * 2.5); }
      else if (skid > 0.05) { mode = 'skid'; nv = 0.02 + 0.05 * skid; }
      else if (onRumble && u > 0.1) { mode = 'rumble'; nv = (tick >> 2) % 2 ? 0.1 : 0.035; }
      if (mode && mode !== snd.nmode) {
        snd.nf.type = mode === 'skid' ? 'bandpass' : 'lowpass';
        snd.nf.frequency.setTargetAtTime(mode === 'skid' ? 2400 : mode === 'off' ? 420 : 170, t, 0.02);
        snd.nf.Q.setTargetAtTime(mode === 'skid' ? 2 : 1, t, 0.02);
        snd.nmode = mode;
      }
      if (Math.abs(nv - snd.nv) > 0.004) { snd.ng.gain.setTargetAtTime(nv, t, 0.03); snd.nv = nv; }
    } catch (e) { /* egal */ }
  }

  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!snd || !snd.sfx) return;
    try {
      const ac = snd.ac, t = ac.currentTime + Math.max(0, delay);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.006);
      g.gain.setValueAtTime(vol, t + dur * 0.75);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(snd.sfx);
      o.start(t);
      o.stop(t + dur + 0.05);
    } catch (e) { /* egal */ }
  }

  function noise(dur, vol, f0, f1, delay = 0) {
    if (!snd || !snd.sfx) return;
    try {
      const ac = snd.ac, t = ac.currentTime + Math.max(0, delay);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = snd.nbuf;
      f.type = 'lowpass';
      f.frequency.setValueAtTime(f0, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(f); f.connect(g); g.connect(snd.sfx);
      src.start(t);
      src.stop(t + dur + 0.05);
    } catch (e) { /* egal */ }
  }

  function sfx(name) {
    if (!snd || paused) return;
    const sq = (m, d, v, at) => tone('square', mtof(m), mtof(m), d, v, at);
    const tri = (m, d, v, at) => tone('triangle', mtof(m), mtof(m), d, v, at);
    switch (name) {
      case 'beep': sq(69, 0.22, 0.06, 0); tri(69, 0.22, 0.22, 0); break;
      case 'go': sq(81, 0.7, 0.06, 0); tri(81, 0.7, 0.25, 0); tri(57, 0.7, 0.2, 0); break;
      case 'pass': tone('square', 988, 1319, 0.06, 0.04); tone('square', 1319, 1976, 0.08, 0.04, 0.06); break;
      case 'bump': tone('triangle', 190, 55, 0.2, 0.35); noise(0.16, 0.35, 2000, 300); break;
      case 'thud': tone('triangle', 130, 50, 0.12, 0.3); break;
      case 'shift': noise(0.06, 0.1, 3000, 700); tone('square', 90, 60, 0.05, 0.03); break;
      case 'crash':
        noise(1.2, 0.6, 4500, 100);
        noise(0.6, 0.4, 900, 60, 0.3);
        tone('sawtooth', 320, 40, 0.9, 0.07);
        tone('triangle', 110, 28, 0.8, 0.35);
        break;
      case 'lap':
        tri(96, 0.18, 0.2, 0); tri(91, 0.3, 0.2, 0.09);
        break;
      case 'extend':
        [72, 76, 79, 84, 79, 84, 88].forEach((m, i) => sq(m, 0.085, 0.05, 0.2 + i * 0.075));
        tri(48, 0.25, 0.25, 0.2); tri(55, 0.3, 0.25, 0.5);
        break;
      case 'clear': {
        const mel = [[67, 0, 1], [72, 1, 1], [76, 2, 1], [79, 3, 2], [76, 5, 1], [79, 6, 3], [81, 9, 1],
          [79, 10, 1], [77, 11, 1], [76, 12, 1], [74, 13, 1], [84, 14, 5]];
        const q = 0.11;
        mel.forEach(([m, s, l]) => sq(m, l * q * 0.92, 0.05, s * q));
        const bass = [[48, 0, 3], [53, 3, 3], [55, 6, 3], [53, 9, 2], [55, 11, 3], [48, 14, 5]];
        bass.forEach(([m, s, l]) => tri(m, l * q * 0.95, 0.26, s * q));
        sq(76, 5 * q, 0.03, 14 * q); sq(79, 5 * q, 0.03, 14 * q);
        break;
      }
      case 'blip': tone('square', 1568, 1568, 0.03, 0.03); break;
      case 'tick': sq(93, 0.07, 0.05, 0); tri(81, 0.07, 0.2, 0); break;
      case 'timeup': tone('sawtooth', 660, 110, 0.6, 0.06); tri(45, 0.6, 0.3, 0); break;
      case 'record':
        [72, 76, 79, 84, 88, 91, 96].forEach((m, i) => sq(m, 0.09, 0.045, 2.2 + i * 0.08));
        tri(60, 0.6, 0.25, 2.2); tri(72, 0.5, 0.2, 2.75);
        break;
      case 'over':
        [64, 63, 62, 61].forEach((m, i) => { sq(m, 0.2, 0.05, i * 0.24); tri(m - 24, 0.2, 0.25, i * 0.24); });
        sq(52, 0.9, 0.05, 0.96); tri(28, 0.9, 0.3, 0.96);
        break;
    }
  }

  // ----------------------------------------------------------
  //  Ablauf
  // ----------------------------------------------------------
  // kurzer Menü-Piep (Titel hat keinen eigenen Ton-Bus)
  function uiBeep(f) {
    if (!alive || !Core.audio || !Core.audio.ctx) return;
    try { Core.audio.tone('square', f, f, 0.05, 0.04); } catch (e) { /* egal */ }
  }

  function startGame() {
    score = 0; scoreAcc = 0; newRecord = false;
    carsLeft = CARS; overReason = '';
    loadStage(titleStage, false);
    state = 'lights'; stT = 0;
    sndStart();
  }

  function toTitle() {
    sndKill();
    paused = false;
    state = 'title'; stT = 0;
    loadStage(titleStage, true);
    speed = MAXV * 0.3;
  }

  function selectStage(d) {
    const n = clamp(titleStage + d, 1, MAX_START);
    selDir = d; selNudge = 10;
    if (n === titleStage) { uiBeep(220); return; }
    titleStage = n;
    uiBeep(d > 0 ? 880 : 660);
    loadStage(titleStage, true);
    speed = MAXV * 0.3;
  }

  function gameOver() {
    state = 'over'; stT = 0; invulT = 0;
    newRecord = score > hi;
    if (newRecord) { hi = score; saveHi(); }
    sndQuiet();
    sfx('over');
    if (newRecord) sfx('record');
  }

  function stageClear() {
    state = 'clear'; stT = 0; banner = null; clearDone = -1; clearGain = 0;
    sfx('clear');
  }

  function pause() {
    if (paused || !raceLike()) return;
    paused = true;
    sndSilence();
  }

  function resume() {
    if (!paused) return;
    paused = false;
    if (!snd) return;
    // Effekt-Bus wieder aufdrehen: ein unterbrochener Jingle spielt weiter
    try {
      const t = snd.ac.currentTime, p = snd.sfx && snd.sfx.gain;
      if (p) { p.cancelScheduledValues(t); p.setTargetAtTime(1, t, 0.02); }
    } catch (e) { /* egal */ }
    snd.v = -1; snd.nv = -1; snd.f = 0; snd.nmode = '';
  }

  function titleTick() {
    autopilot(0.64);
    if (crashT) crashTick(); else drive(cGas, cBrake, cSteer, false);
    moveCars();
    hitCars();
    trackCars(false);
  }

  function lightsTick() {
    readControls();
    rev = clamp(rev + (cGas ? 0.06 : -0.035), 0, 1);
    if (cGas && tick % 4 === 0) spark((grnd() - 0.5) * 0.8, -0.5, (grnd() - 0.5) * 1.5, -1.5 - rev * 2, '#a0a0a8', 22, 0.3);
    if (stT === 30 || stT === 90 || stT === 150) sfx('beep');
    if (stT >= 210) { state = 'race'; stT = 0; losT = 50; sfx('go'); }
    trackCars(false);
  }

  function raceTick() {
    readControls();
    if (crashT) crashTick(); else drive(cGas, cBrake, cSteer, true);
    moveCars();
    hitCars();
    trackCars(true);
    checkLap();
    if (state !== 'race') return;
    const shown = Math.ceil(time);
    time -= DT;
    if (time <= 0) { time = 0; state = 'timeup'; stT = 0; banner = null; overReason = 'time'; sfx('timeup'); }
    else if (Math.ceil(time) < shown && shown <= 6) sfx('tick');   // Warnton in den letzten Sekunden
  }

  function timeupTick() {
    readControls();
    if (crashT) crashTick(); else drive(false, cBrake, cSteer, false);
    moveCars();
    hitCars();
    trackCars(false);
    if (!crashT && speed < 40) gameOver();
  }

  function clearTick() {
    autopilot(0.5);
    if (crashT) crashTick(); else drive(cGas, cBrake, cSteer, false);
    moveCars();
    hitCars();
    trackCars(false);
    if (stT >= 110 && time > 0) {
      if (stT % 2 === 0) {
        const d = Math.min(time, 0.5), pts = Math.round(d * 100);
        time = Math.max(0, time - d);
        addScore(pts);
        clearGain += pts;
        if (stT % 4 === 0) sfx('blip');
      }
    } else if (stT >= 110 && clearDone < 0) clearDone = stT;
    if (clearDone >= 0 && stT > clearDone + 110) {
      loadStage(stageNo + 1, false);
      state = 'lights'; stT = 0;
    }
  }

  function update() {
    if (!alive || paused) return;   // Pause friert auch alle Animationen ein
    tick++;
    stT++;
    if (raceLike() && (!snd || snd.ac !== Core.audio.ctx)) sndStart();
    switch (state) {
      case 'title': titleTick(); break;
      case 'lights': lightsTick(); break;
      case 'race': raceTick(); break;
      case 'timeup': timeupTick(); break;
      case 'clear': clearTick(); break;
      case 'over': if (stT > 480) toTitle(); break;
    }
    updateFx();
    sndUpdate();
  }

  // ----------------------------------------------------------
  //  Zeichnen: Straße (Segment-Projektion), Sprites, Anzeigen
  // ----------------------------------------------------------
  const T = (s, x, y, c, size = 1, align = 'left') => Core.drawText(s, x, y, c, size, align);
  // Text mit schwarzem Schatten (große Einblendungen über hellem Hintergrund)
  const TS = (s, x, y, c, size = 1, align = 'left') => {
    const o = 0.085 * size;
    Core.drawText(s, x + o, y + o, '#000000', size, align);
    Core.drawText(s, x, y, c, size, align);
  };
  const mod = (a, m) => ((a % m) + m) % m;
  let ctx = null, unitPx = 20, projBase = 0, camX = 0, camY = 0, projF = FOCAL;
  const eX = new Float64Array(DRAW + 1), eY = new Float64Array(DRAW + 1), eW = new Float64Array(DRAW + 1);
  const eZ = new Float64Array(DRAW + 1), eS = new Float64Array(DRAW + 1), eWX = new Float64Array(DRAW + 1);
  const CLIP = new Float64Array(DRAW), YB = new Float64Array(DRAW), VIS = new Uint8Array(DRAW);
  let pIdx = 4, pT = 0, pBaseX = 14, pBaseY = 32.6;
  let fogLv = 0, fadeA = 1;   // Dunststufe und Deckkraft der gerade gezeichneten Sprites
  const BK = [];
  for (let i = 0; i < 7 * FOG_N; i++) BK.push([]);
  const carSlots = [];
  for (let i = 0; i < SPR_DRAW; i++) carSlots.push([]);
  const byZDesc = (a, b) => b.z - a.z;
  const RUM = 1 + 1 / 6, LANE_W = 0.03;

  // Kanten der Segmente auf den Bildschirm projizieren und Sichtbarkeit bestimmen.
  // eWX: Straßenmitte seitlich in Welteinheiten. Zwischen zwei Kanten verläuft die Straße
  // gerade, Autos werden deshalb exakt aus ihrer Weltlage projiziert.
  function project(V) {
    const N = track.n, segs = track.segs;
    const cz = wrapZ(pz - PZ);
    const base = Math.floor(cz / SEG) % N;
    const bp = cz / SEG - Math.floor(cz / SEG);
    const ps = segAt(pz), pp = wrapZ(pz) / SEG - Math.floor(wrapZ(pz) / SEG);
    const f = FOCAL * V.k;
    camY = lerp(ps.y1, ps.y2, pp) + CAM_H;
    camX = px * ROAD_W;
    projF = f;
    projBase = base;
    let x = 0, dx = -segs[base].curve * bp;
    for (let n = 0; n <= DRAW; n++) {
      const seg = segs[(base + n) % N];
      const z = (n - bp) * SEG;
      eZ[n] = z;
      eWX[n] = x;
      if (z > NEAR) {
        const s = f / z;
        eS[n] = s;
        eX[n] = SW / 2 + (x - camX) * s;
        eY[n] = V.hy + (camY - seg.y1) * s;
        eW[n] = ROAD_W * s;
      } else {
        eS[n] = 0; eX[n] = SW / 2; eY[n] = V.bottom + 100; eW[n] = 0;
      }
      x += dx;
      dx += seg.curve;
    }
    let maxy = V.bottom;
    for (let n = 0; n < DRAW; n++) {
      CLIP[n] = maxy;
      VIS[n] = 0;
      if (eZ[n] <= NEAR) continue;
      const y1 = eY[n], y2 = eY[n + 1];
      if (y2 >= maxy || y2 >= y1) continue;
      VIS[n] = 1;
      YB[n] = Math.min(y1, maxy);
      maxy = y2;
    }
    const pr = bp + PZ / SEG;
    pIdx = Math.floor(pr);
    pT = pr - pIdx;
    // Fußpunkt des eigenen Autos (Tiefe PZ, seitlich unter der Kamera) exakt projiziert:
    // im Bild interpoliert würde er einmal pro Segment zittern
    const sp = segs[(base + pIdx) % N], sc = f / PZ;
    pBaseX = SW / 2 + lerp(eWX[pIdx], eWX[pIdx + 1], pT) * sc;
    pBaseY = V.hy + (camY - lerp(sp.y1, sp.y2, pT)) * sc;
  }

  // Unterkante von Band n (ohne den Teil, den eine nähere Kuppe verdeckt)
  const BE = { xb: 0, wb: 0 };
  function bandBottom(n) {
    const y1 = eY[n], y2 = eY[n + 1], yb = YB[n];
    BE.xb = eX[n]; BE.wb = eW[n];
    if (yb < y1) {
      const t = (yb - y2) / (y1 - y2);
      BE.xb = eX[n + 1] + (BE.xb - eX[n + 1]) * t;
      BE.wb = eW[n + 1] + (BE.wb - eW[n + 1]) * t;
    }
    return BE;
  }

  function drawRoad(V) {
    for (const b of BK) b.length = 0;
    const segs = track.segs, N = track.n, pal = track.pal;
    let startN = -1;
    for (let n = 0; n < DRAW; n++) {
      if (!VIS[n]) continue;
      const seg = segs[(projBase + n) % N];
      const y1 = eY[n], y2 = eY[n + 1], x2 = eX[n + 1], w2 = eW[n + 1], yb = YB[n];
      const { xb, wb } = bandBottom(n);
      const lo = yb < y1 ? yb : yb + 0.04;   // leichte Überlappung gegen Haarrisse
      const f = FOGLV[n], d = seg.light ? 0 : 1;
      BK[d * FOG_N + f].push(y2, lo - y2);
      BK[(2 + d) * FOG_N + f].push(xb - wb * RUM, lo, xb + wb * RUM, lo, x2 + w2 * RUM, y2, x2 - w2 * RUM, y2);
      BK[(4 + d) * FOG_N + f].push(xb - wb, lo, xb + wb, lo, x2 + w2, y2, x2 - w2, y2);
      if (seg.light) {
        const b = BK[6 * FOG_N + f];
        for (let l = 1; l < LANES; l++) {
          const lx = -1 + 2 * l / LANES;
          b.push(xb + (lx - LANE_W) * wb, lo, xb + (lx + LANE_W) * wb, lo,
            x2 + (lx + LANE_W) * w2, y2, x2 + (lx - LANE_W) * w2, y2);
        }
      }
      if (seg.i === 0) startN = n;
    }
    for (let c = 0; c < 7; c++) {
      for (let f = 0; f < FOG_N; f++) {
        const b = BK[c * FOG_N + f];
        if (!b.length) continue;
        ctx.fillStyle = pal[c][f];
        ctx.beginPath();
        if (c < 2) {
          for (let i = 0; i < b.length; i += 2) ctx.rect(-1, b[i], SW + 2, b[i + 1]);
        } else {
          for (let i = 0; i < b.length; i += 8) {
            ctx.moveTo(b[i], b[i + 1]);
            ctx.lineTo(b[i + 2], b[i + 3]);
            ctx.lineTo(b[i + 4], b[i + 5]);
            ctx.lineTo(b[i + 6], b[i + 7]);
            ctx.closePath();
          }
        }
        ctx.fill();
      }
    }
    if (startN >= 0) drawStartLine(startN);
  }

  // Schachbrett-Linie über die Straße
  function drawStartLine(n) {
    const y2 = eY[n + 1], x2 = eX[n + 1], w2 = eW[n + 1], yb = YB[n];
    const { xb, wb } = bandBottom(n);
    const cols = 10, rows = 2;
    for (let pass = 0; pass < 2; pass++) {
      ctx.fillStyle = pass ? '#141414' : '#ffffff';
      ctx.beginPath();
      for (let r = 0; r < rows; r++) {
        const ya = lerp(yb, y2, r / rows), yc = lerp(yb, y2, (r + 1) / rows);
        const xa = lerp(xb, x2, r / rows), wa = lerp(wb, w2, r / rows);
        const xc = lerp(xb, x2, (r + 1) / rows), wc = lerp(wb, w2, (r + 1) / rows);
        for (let c = 0; c < cols; c++) {
          if ((r + c) % 2 !== pass) continue;
          const u0 = -1 + 2 * c / cols, u1 = -1 + 2 * (c + 1) / cols;
          ctx.moveTo(xa + u0 * wa, ya);
          ctx.lineTo(xa + u1 * wa, ya);
          ctx.lineTo(xc + u1 * wc, yc);
          ctx.lineTo(xc + u0 * wc, yc);
          ctx.closePath();
        }
      }
      ctx.fill();
    }
  }

  // Sprite-Farbe in der aktuellen Dunststufe (je Strecke zwischengespeichert)
  function fogCol(c) {
    let a = track.fogCache.get(c);
    if (!a) { a = FOG_T.map(t => mix(c, track.def.fog, t)); track.fogCache.set(c, a); }
    return a[fogLv];
  }

  // Sprite als Pixel-Rechtecke; Fußpunkt (cx, by), s = Einheiten pro Pixel,
  // alles unterhalb von clip (Kuppe davor) bleibt verdeckt
  function drawSpr(spr, cx, by, s, clip, flip, V) {
    const w = spr.w * s, h = spr.h * s, left = cx - w / 2, top = by - h;
    if (left > SW + 1 || left + w < -1 || top >= clip || by < V.top || top >= V.bottom || w < 0.02) return;
    const pxs = s * unitPx / spr.lod;
    let li = 0;
    if (pxs < 0.9 && spr.lods.length > 1) li = 1;
    if (pxs < 0.45 && spr.lods.length > 2) li = 2;
    const L = spr.lods[li], ss = s * (1 << li), e = ss * 0.06;
    const groups = L.groups;
    if (fadeA < 1) ctx.globalAlpha = fadeA;
    for (let g = 0; g < groups.length; g++) {
      const r = groups[g].r;
      let any = false;
      for (let i = 0; i < r.length; i += 4) {
        const ry = top + r[i + 1] * ss;
        if (ry >= clip) continue;
        let rh = r[i + 3] * ss + e;
        if (ry + rh > clip) rh = clip - ry;
        const rw = r[i + 2] * ss + e;
        const rx = flip ? left + (L.w - r[i] - r[i + 2]) * ss : left + r[i] * ss;
        if (rx > SW + 1 || rx + rw < -1 || ry + rh < V.top) continue;   // außerhalb des Bildes
        if (!any) { ctx.fillStyle = fogLv ? fogCol(groups[g].c) : groups[g].c; ctx.beginPath(); any = true; }
        ctx.rect(rx, ry, rw, rh);
      }
      if (any) ctx.fill();
    }
    if (fadeA < 1) ctx.globalAlpha = 1;
  }

  function gantryVariant() {
    if (state === 'lights') return stT < 30 ? 0 : stT < 90 ? 1 : stT < 150 ? 2 : stT < 210 ? 3 : 4;
    if (state === 'race' && losT > 0) return 4;
    return 0;
  }

  function drawStatic(sp, n, clip, V, gv) {
    let spr = sp.spr;
    if (spr.gantry) spr = SPR.gantry[gv];
    const s = eS[n] * PX * spr.s, cx = eX[n] + sp.x * eW[n], by = eY[n];
    drawSpr(spr, cx, by, s, clip, sp.flip, V);
    if (spr.glow && track.def.theme === 'night') {
      const gx = cx + ((sp.flip ? spr.w - spr.glow[0] : spr.glow[0]) - spr.w / 2) * s;
      const gy = by - (spr.h - spr.glow[1]) * s;
      if (gy < clip && gy > V.top) {
        const r = clamp(3.2 * s, 0.05, 1.3);
        ctx.globalAlpha = 0.2 * fadeA;
        Core.circ(gx, gy, r, '#fff0a0');
        ctx.globalAlpha = 0.45 * fadeA;
        Core.circ(gx, gy, r * 0.45, '#fff8d0');
        ctx.globalAlpha = 1;
      }
    }
  }

  // Gegner an seiner echten Weltlage (Segment n, Anteil t) projiziert
  function drawCar(c, n, t, clip, V) {
    const z = eZ[n] + t * SEG;
    if (z <= NEAR) return;
    const seg = track.segs[(projBase + n) % track.n], sc = projF / z, s = sc * PX;
    const cx = SW / 2 + (lerp(eWX[n], eWX[n + 1], t) + c.x * ROAD_W - camX) * sc;
    const by = V.hy + (camY - lerp(seg.y1, seg.y2, t)) * sc;
    const fr = c.type.fr[Math.floor(c.ph) & 1];
    if (by < clip && s > 0.03) {
      ctx.globalAlpha = fadeA;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(cx - fr.w * s * 0.48, by - s, fr.w * s * 0.96, Math.min(s * 1.4, clip - by + s));
      ctx.globalAlpha = 1;
    }
    drawSpr(fr, cx, by, s, clip, false, V);
    // Blinker vor dem Spurwechsel
    if (c.sig && (tick >> 3) % 2 === 0) {
      const y = by - (fr.h - c.type.sig[1]) * s;
      if (y < clip && y > V.top) {
        const w = Math.max(2 * s, 0.12), hh = Math.min(Math.max(1.5 * s, 0.1), clip - y);
        ctx.globalAlpha = fadeA;
        ctx.fillStyle = '#ffb000';
        ctx.fillRect(cx + c.sig * c.type.sig[0] * s - w / 2, y, w, hh);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawSprites(V) {
    const N = track.n, segs = track.segs, gv = gantryVariant();
    for (const sl of carSlots) sl.length = 0;
    for (const c of cars) {
      const n = mod(Math.floor(c.z / SEG) - projBase, N);
      if (n >= 1 && n < SPR_DRAW) carSlots[n].push(c);
    }
    for (let n = SPR_DRAW - 1; n >= 1; n--) {
      const isP = n === pIdx;
      if (eZ[n] <= NEAR) { if (isP) drawPlayer(V); continue; }
      const clip = CLIP[n];
      if (clip <= V.top) { if (isP) drawPlayer(V); continue; }
      const seg = segs[(projBase + n) % N], slot = carSlots[n];
      // in der Ferne Farben im Dunst, ganz hinten sanft einblenden
      fogLv = FOGLV[n];
      fadeA = Math.min(1, (SPR_DRAW - n) / SPR_FADE);
      if (slot.length > 1) slot.sort(byZDesc);
      let pDone = !isP;
      for (const c of slot) {
        const t = (c.z - seg.i * SEG) / SEG;
        if (!pDone && t < pT) { drawPlayer(V); pDone = true; }
        drawCar(c, n, t, clip, V);
      }
      if (!pDone) drawPlayer(V);
      for (const sp of seg.sprites) drawStatic(sp, n, clip, V, gv);
    }
    fogLv = 0; fadeA = 1;
  }

  function drawPlayer(V) {
    const f0 = fogLv, a0 = fadeA;
    fogLv = 0; fadeA = 1;
    drawPlayerCar(V);
    fogLv = f0; fadeA = a0;
  }

  function drawPlayerCar(V) {
    const k = V.k, s = FOCAL * k / PZ * PX;
    let cx = pBaseX, by = pBaseY;
    if (offRoad && speed > 50 && !crashT) by -= ((tick >> 1) % 2) * 0.12 * k;
    else if (speed > MAXV * 0.5 && tick % 7 === 0) by -= 0.05 * k;
    if (wobbleT) cx += Math.sin(wobbleT * 0.8) * 0.35 * k * (wobbleT / 36);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(cx - 2.8 * k, by - 0.3 * k, 5.6 * k, 0.45 * k);
    if (crashT) { drawCrash(cx, by, s, k, V); return; }
    if (invulT && (tick >> 2) % 2) return;
    const st = steer < -0.8 ? 0 : steer < -0.3 ? 1 : steer > 0.8 ? 4 : steer > 0.3 ? 3 : P_MID;
    drawSpr(P_CAR[st][Math.floor(wheel) & 1], cx, by, s, 99, false, V);
    if (cBrake && speed > 0 && raceLike()) {
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = '#ff3030';
      ctx.fillRect(cx - 2 * s, by - 3.8 * s, 4 * s, 3 * s);
      ctx.globalAlpha = 1;
    }
    if (fireT) {
      const fl = (fireT % 4 < 2 ? 1 : 0.7) * k;
      ctx.fillStyle = '#ff7020';
      ctx.fillRect(cx - 0.45 * fl, by - 0.55 * k, 0.9 * fl, 0.5 * fl);
      ctx.fillStyle = '#ffe060';
      ctx.fillRect(cx - 0.22 * fl, by - 0.5 * k, 0.44 * fl, 0.3 * fl);
    }
  }

  function drawCrash(cx, by, s, k, V) {
    const ph = CRASH_T - crashT;
    if (ph < 40) {
      const spin = Math.floor(ph / 3) % 4;
      const spr = spin === 0 ? P_CAR[P_MID][0] : spin === 1 ? P_CAR[4][0] : spin === 2 ? P_BURNT : P_CAR[0][0];
      const hop = Math.sin(Math.min(ph, 30) / 30 * Math.PI) * 1.6 * k;
      drawSpr(spr, cx + Math.sin(ph * 0.5) * 0.6 * k, by - hop, s, 99, spin === 2, V);
    } else if (crashT > 20 || (tick >> 2) % 2) {
      drawSpr(P_BURNT, cx, by, s, 99, false, V);
    }
    const bi = ph < 6 ? 0 : ph < 14 ? 1 : ph < 26 ? 2 : ph < 46 ? 3 : -1;
    if (bi >= 0) drawSpr(SPR.boom[bi], cx, by + 0.6 * k, s * 1.5 * (1 + ph / 70), 99, (ph >> 2) % 2 === 1, V);
  }

  function drawParts(V) {
    const k = V.k;
    for (const p of parts) {
      ctx.globalAlpha = Math.min(1, p.life / p.max * 1.6);
      ctx.fillStyle = p.color;
      const sz = p.size * k;
      ctx.fillRect(pBaseX + p.x * k - sz / 2, pBaseY + p.y * k - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  // Scheinwerfer bei Nacht: mehrere schwache Lagen übereinander, nach vorn immer
  // weniger davon, so läuft der Lichtkegel ohne harte Kante aus
  function drawBeams(V) {
    if (crashT || (invulT && (tick >> 2) % 2)) return;
    const k = V.k, x = pBaseX, y = pBaseY - 1.6 * k, top = V.hy + 1.2 * k;
    ctx.fillStyle = '#fff4b0';
    ctx.globalAlpha = 0.032;
    for (let i = 1; i <= 7; i++) {
      const far = Math.max(top, y - i * 1.2 * k), sp = 1.7 * k + (y - far) * 0.42;
      ctx.beginPath();
      ctx.moveTo(x - 1.7 * k, y);
      ctx.lineTo(x + 1.7 * k, y);
      ctx.lineTo(x + sp, far);
      ctx.lineTo(x - sp, far);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSky(V) {
    const sky = track.def.sky, n = sky.length, h = (V.hy - V.top) / n;
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = sky[i];
      ctx.fillRect(-1, V.top + i * h - (i ? 0 : 1), SW + 2, h + (i ? 0.06 : 1.06));
    }
  }

  // Parallaxe: Muster der Breite pw, um bgScroll * rate verschoben, über die Bildbreite
  function tileX(rate, pw, fn) {
    for (let bx = mod(bgScroll * rate, pw) - pw; bx < SW + 1; bx += pw) fn(bx);
  }

  function drawBg(V) {
    const bg = track.bg, k = V.k, hy = V.hy, top = V.top, H = hy - top;
    if (bg.theme === 'coast') {
      ctx.globalAlpha = 0.3;
      Core.circ(21, top + H * 0.3, 1.9 * k, '#fffff0');
      ctx.globalAlpha = 1;
      Core.circ(21, top + H * 0.3, 1.25 * k, '#fff8b0');
      for (const c of bg.clouds) {
        const x = mod(c.x + bgScroll * 0.15 + tick * 0.004, 64) - 12, s = c.s * k;
        drawSpr(c.spr, x, top + H * c.y + c.spr.h * s, s, 99, false, V);
      }
      const seaY = hy - 0.9 * k;
      ctx.fillStyle = '#1a50c0';
      ctx.fillRect(-1, seaY, SW + 2, hy - seaY + 0.1);
      ctx.fillStyle = '#2c7a5c';
      ctx.beginPath();
      tileX(0.35, 56, bx => {
        for (const pts of bg.islands) {
          ctx.moveTo(bx + pts[0], seaY);
          for (let j = 0; j < pts.length; j += 2) ctx.lineTo(bx + pts[j], seaY - pts[j + 1] * k);
          ctx.closePath();
        }
      });
      ctx.fill();
      ctx.fillStyle = '#80b4ff';
      for (let i = 0; i < 12; i++) {
        if (((tick >> 4) + i) % 3 === 0) continue;
        ctx.fillRect(mod(i * 7.3 + bgScroll * 0.5, 30) - 1, seaY + (0.2 + (i % 3) * 0.22) * k, (0.6 + (i % 2) * 0.6) * k, 0.08);
      }
    } else if (bg.theme === 'desert') {
      const sy = hy - 1.1 * k, r = 3.4 * k;
      Core.circ(16, sy, r, '#ffd84a');
      ctx.fillStyle = track.def.sky[5];
      for (let i = 0; i < 5; i++) ctx.fillRect(16 - r - 0.1, sy + (0.1 + i * 0.6) * k, 2 * r + 0.2, (0.1 + i * 0.07) * k);
      for (const [layer, rate, col, cap] of [[bg.far, 0.3, '#6c2058', '#8a3070'], [bg.near, 0.6, '#8a3018', '#c05a30']]) {
        // Tafelberge: Sockel + schmalere Kuppe, dann die helle Oberkante
        for (const pass of [0, 1]) {
          ctx.fillStyle = pass ? cap : col;
          ctx.beginPath();
          tileX(rate, layer.pw, bx => {
            for (const m of layer.list) {
              const x = bx + m[0];
              if (x > SW + 1 || x + m[1] < -1) continue;
              if (pass) { ctx.rect(x + m[3] * 0.5, hy - m[2] * k, m[1] - m[3], 0.12 * k); continue; }
              ctx.rect(x, hy - m[2] * 0.75 * k, m[1], m[2] * 0.75 * k + 0.1);
              ctx.rect(x + m[3] * 0.5, hy - m[2] * k, m[1] - m[3], m[2] * 0.25 * k + 0.05);
            }
          });
          ctx.fill();
        }
      }
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      const st = bg.stars;
      for (let i = 0; i < st.length; i += 3) {
        if (((tick >> 4) + i) % 11 === 0) continue;
        const x = mod(st[i] + bgScroll * 0.08, 56) - 14;
        if (x < -1 || x > SW + 1) continue;
        ctx.rect(x, top + st[i + 1] * H * 0.8, st[i + 2], st[i + 2]);
      }
      ctx.fill();
      Core.circ(6, top + H * 0.3, 1.1 * k, '#f4f0d8');
      Core.circ(5.6, top + H * 0.3 - 0.3 * k, 0.25 * k, '#d6d2b8');
      Core.circ(6.5, top + H * 0.3 + 0.35 * k, 0.18 * k, '#d6d2b8');
      for (const [layer, rate, col, lit] of [[bg.far, 0.25, '#161638', ['#4a4a7a', '#4a4a7a', '#4a4a7a']],
        [bg.near, 0.5, '#0a0a1c', ['#ffd040', '#40e0ff', '#ff60c0']]]) {
        ctx.fillStyle = col;
        ctx.beginPath();
        tileX(rate, layer.pw, bx => {
          for (const b of layer.list) {
            const x = bx + b[0];
            if (x > SW + 1 || x + b[1] < -1) continue;
            ctx.rect(x, hy - b[2] * k, b[1], b[2] * k + 0.1);
          }
        });
        ctx.fill();
        const w = layer.wins;
        for (let c = 0; c < 3; c++) {
          ctx.fillStyle = lit[c];
          ctx.beginPath();
          tileX(rate, layer.pw, bx => {
            for (let i = 0; i < w.length; i += 3) {
              if (w[i + 2] !== c) continue;
              const x = bx + w[i];
              if (x < -1 || x > SW + 1) continue;
              ctx.rect(x, hy - (w[i + 1] + 0.25) * k, 0.2, 0.22 * k);
            }
          });
          ctx.fill();
        }
      }
      if ((tick >> 5) % 2) {
        ctx.fillStyle = '#ff2020';
        tileX(0.25, bg.far.pw, bx => {
          for (const b of bg.far.list) if (b[2] > 3.4) ctx.fillRect(bx + b[0] + b[1] / 2 - 0.08, hy - b[2] * k - 0.2, 0.16, 0.16);
        });
      }
    }
  }

  function drawWorld(V) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, V.top, SW, V.bottom - V.top);
    ctx.clip();
    let sx = 0, sy = 0;
    if (shakeT > 0) { sx = Math.sin(tick * 2.1) * shakeT * 0.025; sy = Math.cos(tick * 2.9) * shakeT * 0.02; }
    else if (offRoad && speed > MAXV * 0.08 && !crashT) sy = (tick >> 1) % 2 ? 0.05 : -0.05;
    if (sx || sy) ctx.translate(sx * V.k, sy * V.k);
    drawSky(V);
    drawBg(V);
    ctx.fillStyle = track.ground;
    ctx.fillRect(-1, V.hy, SW + 2, V.bottom - V.hy + 1);
    project(V);
    drawRoad(V);
    if (track.def.theme === 'night') drawBeams(V);
    drawSprites(V);
    drawParts(V);
    ctx.restore();
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHud() {
    T('PUNKTE', 0.5, 0.15, COL.red, 0.75);
    T(String(score), 0.5, 0.95, COL.white, 1);
    T('REKORD', 27.5, 0.15, COL.red, 0.75, 'right');
    T(String(Math.max(hi, score)), 27.5, 0.95, COL.white, 1, 'right');
    T('ZEIT', 14, 0.05, COL.yellow, 0.75, 'center');
    const low = time < 10 && (state === 'race' || state === 'timeup');
    if (!low || (tick >> 3) % 2 === 0) T(String(Math.ceil(time - 1e-6)), 14, 0.8, low ? COL.red : COL.yellow, 2, 'center');
    T('RUNDE ' + Math.min(LAPS, lapsDone + 1) + '/' + LAPS, 0.5, 3.0, COL.cyan, 0.75);
    T('STRECKE ' + stageNo, 27.5, 3.0, track.def.color, 0.75, 'right');
    // verbleibende Autos als kleine Symbole (verlorene grau)
    for (let i = 0; i < CARS; i++) drawLifeCar(12.1 + i * 1.9, 3.0, i < carsLeft);
    // unten: Tempo, Drehzahl, Rundenfortschritt
    T(String(Math.round(speed / MAXV * KMH)), 6.4, 33.35, COL.white, 1.5, 'right');
    T('KM/H', 6.7, 34.05, COL.cyan, 0.75);
    const lit = Math.round((state === 'lights' ? 0.16 + rev * 0.8 : crashT ? 0 : rpm) * 16);
    for (const [from, to, on, offc] of [[0, 10, '#20e040', '#0c3010'], [10, 13, '#ffe020', '#3a3408'], [13, 16, '#ff2828', '#3c0c0c']]) {
      for (const isOn of [true, false]) {
        ctx.fillStyle = isOn ? on : offc;
        ctx.beginPath();
        for (let i = from; i < to; i++) if ((i < lit) === isOn) ctx.rect(10.4 + i * 0.98, 33.95 - i * 0.04, 0.82, 0.55 + i * 0.04);
        ctx.fill();
      }
    }
    T(String(gear), 27.5, 33.35, COL.white, 1, 'right');   // Gang rechts neben der Drehzahl
    const prog = clamp(travel / (LAPS * track.len), 0, 1);
    ctx.fillStyle = '#1c1c40';
    ctx.fillRect(1, 35.1, 26, 0.45);
    ctx.fillStyle = track.def.color;
    ctx.fillRect(1, 35.1, 26 * prog, 0.45);
    ctx.fillStyle = COL.white;
    for (let i = 1; i < LAPS; i++) ctx.fillRect(1 + 26 * i / LAPS - 0.05, 34.95, 0.1, 0.75);
    ctx.fillStyle = COL.yellow;
    ctx.fillRect(1 + 26 * prog - 0.25, 34.9, 0.5, 0.85);
  }

  function drawLights(lit) {
    ctx.fillStyle = '#101018';
    rrect(8.4, 5, 11.2, 2.6, 0.5);
    ctx.fill();
    ctx.strokeStyle = COL.blue;
    ctx.lineWidth = 0.14;
    ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const on = lit === 4 || (i < 3 && i < lit);
      const col = lit === 4 ? '#20ff40' : on ? '#ff2020' : '#401010';
      if (on) {
        ctx.globalAlpha = 0.3;
        Core.circ(10.1 + i * 2.6, 6.3, 1.15, col);
        ctx.globalAlpha = 1;
      }
      Core.circ(10.1 + i * 2.6, 6.3, 0.8, col);
    }
  }

  function drawOverlay() {
    if (flashT > 0) {
      ctx.globalAlpha = flashT / 10;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 4, SW, 29);
      ctx.globalAlpha = 1;
    }
    for (const p of popups) T(p.text, p.x, p.y, p.color, p.size, 'center');
    if (banner && state === 'race') {
      TS(banner.text, 14, 8.2, (tick >> 2) % 2 ? COL.yellow : COL.white, 1.5, 'center');
      if (banner.sub) TS(banner.sub, 14, 10.2, COL.cyan, 1, 'center');
    }
    if (state === 'lights') {
      const lit = gantryVariant();
      drawLights(lit);
      if (stT < 200) {
        ctx.fillStyle = 'rgba(0,0,16,0.7)';
        rrect(5.5, 8.6, 17, 4.1, 0.5);
        ctx.fill();
        T('STRECKE ' + stageNo + (round ? '  STUFE ' + (round + 1) : ''), 14, 9.0, COL.white, 0.9, 'center');
        T(track.def.name, 14, 10.4, track.def.color, 1.6, 'center');
      }
      if (lit >= 1 && lit <= 3) {
        const age = (stT - 30) % 60, size = 6 - Math.min(1, age / 8) * 1.6, y = 17.6 - size * 0.44;
        ctx.fillStyle = 'rgba(0,0,16,0.6)';
        rrect(14 - size * 0.62, y - 0.45, size * 1.24, size * 0.875 + 0.9, 0.6);
        ctx.fill();
        T(String(4 - lit), 14.3, y + 0.3, '#000000', size, 'center');
        T(String(4 - lit), 14, y, COL.yellow, size, 'center');
      }
    } else if (state === 'race' && losT > 0) {
      drawLights(4);
      if ((losT >> 2) % 2 === 0) TS('LOS!', 14, 14.5, COL.green, 3, 'center');
    } else if (state === 'race' && time < 5.5 && time > 0 && (tick >> 3) % 2 === 0) {
      TS('ZEIT!', 14, 9, COL.red, 1.4, 'center');
    } else if (state === 'timeup') {
      // dunkler Kasten: das Rot steht sonst direkt auf dem Schachbrett der Brücke
      if ((tick >> 3) % 2 === 0) {
        ctx.fillStyle = 'rgba(0,0,16,0.6)';
        rrect(4.4, 11.4, 19.2, 3.1, 0.5);
        ctx.fill();
        TS('ZEIT UM!', 14, 12, COL.red, 2.2, 'center');
      }
    } else if (state === 'clear') {
      drawClear();
    } else if (state === 'over') {
      drawOver();
    }
  }

  function drawClear() {
    if (stT < 110) {
      if ((stT >> 3) % 2 === 0) TS('ZIEL!', 14, 9, COL.yellow, 3.2, 'center');
      return;
    }
    ctx.fillStyle = 'rgba(0,0,24,0.6)';
    ctx.fillRect(1, 6.4, 26, 10.4);
    T('STRECKE GESCHAFFT', 14, 7.2, COL.yellow, 1.2, 'center');
    T('RESTZEIT', 3, 9.6, COL.white, 1);
    T(time.toFixed(1), 25, 9.6, COL.white, 1, 'right');
    T('BONUSPUNKTE', 3, 11.2, COL.white, 1);   // Punkte für die Restzeit (nicht Sekunden)
    T('+' + clearGain, 25, 11.2, COL.cyan, 1, 'right');
    if (clearDone >= 0) {
      // nach der letzten Strecke einer Runde geht es schwerer weiter: Stufe mit anzeigen
      const nx = STAGES[stageNo % STAGES.length], r = Math.floor(stageNo / STAGES.length);
      T('NÄCHSTE STRECKE', 14, 13.4, COL.white, 0.9, 'center');
      if ((tick >> 3) % 4) T(nx.name + (r ? '  STUFE ' + (r + 1) : ''), 14, 14.6, nx.color, r ? 1.2 : 1.5, 'center');
    }
  }

  // kleines Auto-Symbol (Heckansicht) für die Lebensanzeige
  const LIFE_CAR = ['..RRRRR..', '.RWWWWWR.', 'RRRRRRRRR', 'YRRRRRRRY', 'KK.....KK'];
  const LIFE_ON = { R: '#ff2a2a', W: '#9fd8ff', Y: '#ffff40', K: '#202020' };
  const LIFE_OFF = { R: '#3a3a44', W: '#4a4a56', Y: '#3a3a44', K: '#202020' };
  function drawLifeCar(x, y, alive) {
    const pal = alive ? LIFE_ON : LIFE_OFF;
    const s = 0.14;
    LIFE_CAR.forEach((row, ry) => {
      for (let rx = 0; rx < row.length; rx++) {
        const c = pal[row[rx]];
        if (!c) continue;
        ctx.fillStyle = c;
        ctx.fillRect(x + rx * s, y + ry * s, s + 0.01, s + 0.01);
      }
    });
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';

  function drawLogo(y) {
    const size = 3.6, ph = 0.125 * size, y0 = y + 0.0625 * size;
    T('VOLLGAS', 14.28, y + 0.28, '#2121ff', size, 'center');
    const bands = [[0, 3, '#ffff40'], [3, 5, '#ffa020'], [5, 7, '#ff3020']];
    for (const [a, b, c] of bands) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, y0 + a * ph - (a ? 0 : 1), SW, (b - a) * ph + (a ? 0 : 1) + (b === 7 ? 1 : 0));

      T('VOLLGAS', 14, y, c, size, 'center');
      ctx.restore();

    if (g < 50) {
      ctx.save();
      ctx.beginPath();

      T('VOLLGAS', 14, y, '#ffffff', size, 'center');

  // Lage des Strecken-Wählers 'START-STRECKE  < n >' (für Zeichnen und Tippen)
  const SEL_Y = 24.4;

    const n = String(titleStage), len = 19 + n.length, x0 = 14 - len / 2;

  function draw() {
    ctx = Core.ctx;
    unitPx = typeof Core.unitPx === 'function' ? Core.unitPx() || 20 : 20;
    if (state === 'title') { drawTitle(); return; }
    drawWorld(VIEW_RACE);
    drawHud();
    // in der Pause keine Einblendungen unter dem Pausen-Block
    if (paused) drawPause(); else drawOverlay();
  }

  // ----------------------------------------------------------
  //  Eingabe
  // ----------------------------------------------------------
  const DRIVE_KEYS = { ArrowLeft: 1, KeyA: 1, ArrowRight: 1, KeyD: 1, ArrowUp: 1, KeyW: 1, ArrowDown: 1, KeyS: 1 };
  const SYS_KEYS = { Enter: 1, NumpadEnter: 1, Space: 1, KeyP: 1, Escape: 1 };

  function confirmKey() {
    if (paused) resume();
    else if (state === 'title') startGame();
    else if (state === 'over' && stT > 45) toTitle();
  }

  function escapeKey() {
    if (paused || state === 'title') Core.exitToMenu();
    else if (state === 'over') toTitle();
    else if (raceLike()) pause();
  }

  function onKeyDown(e) {
    const code = e && e.code;
    if (!code || !alive) return false;
    const rep = !!e.repeat;
    if (DRIVE_KEYS[code]) {
      down.add(code);
      if (!rep) {
        if (code === 'ArrowLeft' || code === 'KeyA') {
          lastSteer = -1;
          if (state === 'title') selectStage(-1);
        } else if (code === 'ArrowRight' || code === 'KeyD') {
          lastSteer = 1;
          if (state === 'title') selectStage(1);
        }
      }
      return true;
    }
    if (!SYS_KEYS[code]) return false;
    if (rep) return true;
    if (code === 'KeyP') { if (paused) resume(); else pause(); }
    else if (code === 'Escape') escapeKey();
    else confirmKey();
    return true;
  }

  function onKeyUp(e) {
    const code = e && e.code;
    if (!code) return false;
    down.delete(code);
    return !!(DRIVE_KEYS[code] || SYS_KEYS[code]);
  }

  // Tipp auf Schaltflächen; true = verbraucht (kein Fahr-Finger)
  function tap(x, y) {
    if (paused) {
      if (x >= 9 && x <= 19 && y >= 21 && y <= 23) Core.exitToMenu();
      else resume();
      return true;
    }
    if (state === 'title') {
      const sel = selLayout();
      if (y >= 32.4) Core.exitToMenu();
      else if (y >= SEL_Y - 0.4 && y < SEL_Y + 1.2 && x >= sel.lt - 1 && x < sel.num) selectStage(-1);
      else if (y >= SEL_Y - 0.4 && y < SEL_Y + 1.2 && x >= sel.num && x < sel.gt + 1.5) selectStage(1);
      else if (y >= SEL_Y - 0.4 && y < SEL_Y + 2.9 && x < 7) selectStage(-1);
      else if (y >= SEL_Y - 0.4 && y < SEL_Y + 2.9 && x > 21) selectStage(1);
      else startGame();
      return true;
    }
    if (state === 'over') {
      if (stT > 45) toTitle();
      return true;
    }
    if (y < 4) { pause(); return true; }
    return false;
  }

  function onPointer(type, x, y, id) {
    if (!alive || !Number.isFinite(x) || !Number.isFinite(y)) return;
    if (type === 'down') {
      if (ptrs.size >= 8) ptrs.clear();
      const inside = x >= 0 && x <= SW && y >= 0 && y <= 36;
      const ui = inside ? tap(x, y) : true;
      if (alive) ptrs.set(id, { x, y, ui });
    } else if (type === 'move') {
      const p = ptrs.get(id);
      if (p) { p.x = x; p.y = y; }
    } else if (type === 'up' || type === 'cancel') {
      ptrs.delete(id);
    }
  }

  function onBlur() {
    if (alive && raceLike()) pause();
    down.clear();
    ptrs.clear();
  }

  // ----------------------------------------------------------
  //  Lebenszyklus
  // ----------------------------------------------------------
  function defineGlyphs() {
    if (typeof Core.defineGlyph === 'function') Core.defineGlyph('+', '.....|..#..|..#..|#####|..#..|..#..|.....');
  }
  defineGlyphs();

  function enter() {
    alive = true;
    defineGlyphs();
    loadHi();
    down.clear();
    ptrs.clear();
    paused = false;
    score = 0;
    toTitle();
  }

  function exit() {
    alive = false;
    sndKill();
    down.clear();
    ptrs.clear();
    paused = false;
    if (score > hi) hi = score;
    saveHi();
    state = 'title';
    stT = 0;
  }

  function hiScore() {
    return hi;
  }

  return { id: 'racer', title: 'VOLLGAS', phase: () => state === 'title' ? 'title' : state === 'over' ? 'over' : paused ? 'paused' : 'play',
           enter, exit, update, draw,
           onKeyDown, onKeyUp, onPointer, onBlur, hiScore };
})();
