<script>
/*
 * SPIELHALLE – Mampf-Man, Tetris, Vollgas und Super Hüpfer in einer einzigen Datei.

 * Schrift als eingebettete Pixel-Schrift.
 *
 * Aufbau: Core (Canvas, Schrift, Audio, Speicher, Eingabe-Verteilung, Touch-Gamepad,
 *         Hauptschleife) und die Module MampfMan, Tetris, Racer (VOLLGAS), Hopper (SUPER HÜPFER)
 *         und Launcher.
 * Auf Touch-Geräten (z. B. iPad) erscheint ein Gamepad neben bzw. unter dem Spielfeld.
 */
(() => {
'use strict';

// ============================================================
//  CORE – Canvas, Spielfläche & Platz für das Touch-Gamepad
// ============================================================
const COLS = 28, ROWS = 36;          // Spielfläche in Einheiten (Hochformat wie ein Arcade-Automat)
const FPS = 60, STEP = 1000 / FPS;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let SCALE = 16, DPR = 1;             // SCALE = Geräte-Pixel pro Einheit
const VIEW = { x: 0, y: 0 };         // linke obere Ecke der Spielfläche in Geräte-Pixeln
const resizeHooks = [];
let padArea = null;                  // freier Bereich für das Gamepad (CSS-Pixel) oder null

// Gamepad zeigen, wenn das Gerät einen Touchscreen hat (wird beim ersten Finger auch nachgeholt).
// Mit ?touch=1 in der Adresse lässt es sich erzwingen, mit ?touch=0 abschalten.
let touchUI = false, touchForced = null;
try {
  touchUI = (navigator.maxTouchPoints || 0) > 0 || window.matchMedia('(any-pointer: coarse)').matches;
  const force = /[?&]touch=([01])/.exec(location.search);
  if (force) { touchForced = force[1]; touchUI = force[1] === '1'; }
} catch (e) { /* egal */ }

const insetProbe = document.createElement('div');
insetProbe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
  'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.appendChild(insetProbe);
function safeInsets() {
  const s = getComputedStyle(insetProbe);
  return {
    t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0,
    b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0
  };
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ins = safeInsets();
  const ax = ins.l, ay = ins.t;
  const aw = Math.max(60, W - ins.l - ins.r), ah = Math.max(60, H - ins.t - ins.b);
  let box = { x: ax, y: ay, w: aw, h: ah };
  padArea = null;
  if (touchUI) {
    const side = (aw - ah * COLS / ROWS) / 2;
    if (side >= 130) {
      // Querformat: Gamepad links und rechts neben dem Spielfeld
      box = { x: ax + side, y: ay, w: aw - 2 * side, h: ah };
      padArea = { mode: 'side', left: { x: ax, y: ay, w: side, h: ah }, right: { x: ax + aw - side, y: ay, w: side, h: ah } };
    } else {
      // Hochformat: Gamepad unter dem Spielfeld
      const ctrlH = Math.min(Math.max(ah * 0.27, 170), 320);
      const u = Math.min(aw / COLS, (ah - ctrlH) / ROWS);
      box = { x: ax, y: ay, w: aw, h: u * ROWS };
      padArea = { mode: 'bottom', area: { x: ax, y: ay + u * ROWS, w: aw, h: ah - u * ROWS } };
    }
  }
  const u = Math.min(box.w / COLS, box.h / ROWS);
  SCALE = Math.max(2, Math.floor(u * DPR));
  VIEW.x = Math.round(box.x * DPR + (box.w * DPR - COLS * SCALE) / 2);
  VIEW.y = Math.round(box.y * DPR + (box.h * DPR - ROWS * SCALE) / 2);
  for (const h of resizeHooks) h();
}

function parseGlyph(src) {
  const runs = [];
  src.split('|').forEach((row, y) => {
    for (let x = 0; x < row.length;) {
      if (row[x] === '#') {
        const s = x;
        while (x < row.length && row[x] === '#') x++;
        runs.push([s, y, x - s]);
      } else x++;
    }
  });
  return runs;
}
const GLYPHS = {};
for (const ch in FONT_SRC) GLYPHS[ch] = parseGlyph(FONT_SRC[ch]);

function defineGlyph(ch, pattern) {
  GLYPHS[String(ch).toUpperCase()] = parseGlyph(String(pattern));
}

function drawText(str, x, y, color, size = 1, align = 'left') {
  str = String(str).toUpperCase();
  const w = str.length * size;
  if (align === 'center') x -= w / 2;
  else if (align === 'right') x -= w;
  const pw = 0.16 * size, ph = 0.125 * size;
  ctx.fillStyle = color;
  for (let i = 0; i < str.length; i++) {
    const g = GLYPHS[str[i]];
    if (!g) continue;
    const ox = x + i * size + 0.1 * size, oy = y + 0.0625 * size;
    for (const [sx, sy, n] of g) ctx.fillRect(ox + sx * pw, oy + sy * ph, n * pw, ph + 0.02);
  }
}

function circ(x, y, r, c) {
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function roundRectPath(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// ============================================================
//  CORE – Audio (Web Audio, alles synthetisch)
// ============================================================
const AudioCore = (() => {
  const VOL = 0.6;
  let ac = null, master = null;
  let muted = !!Number(Store.get('arcade.mute', Store.get('mampfman.mute', 0)));

  function init() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        // In einem Fenster des Tipp-Trainers legt die App den Audio-Kontext beim Klick (Nutzergeste) selbst an
        // und gibt ihn hierher weiter – Safari/iPad erlaubt Ton in eingebetteten Fenstern sonst oft nicht.
        let shared = null;
        try { shared = window.parent !== window ? window.parent.__ttArcadeAudio : null; } catch (e) { shared = null; }
        ac = shared && shared.state !== 'closed' ? shared : new AC();
        master = ac.createGain();
        master.gain.value = muted ? 0 : VOL;
        master.connect(ac.destination);
      }
      // auch 'interrupted' (iOS nach Anruf/Siri/Sperre) wieder aufnehmen
      if (ac.state !== 'running' && ac.state !== 'closed') {
        const p = ac.resume();
        if (p && p.catch) p.catch(() => { /* ohne Nutzergeste nicht erlaubt */ });
      }
    } catch (e) { ac = null; master = null; }
  }

  function tone(type, f0, f1, dur, vol, delay = 0, dest = null) {
    if (!ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol, t + dur * 0.75);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(dest || master);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  return {
    init, tone,
    get ctx() { return ac; },
    get master() { return master; },
    muted: () => muted,
    toggle() {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : VOL;
      Store.set('arcade.mute', muted ? 1 : 0);
    }
  };
})();

// ============================================================
//  ANBINDUNG AN DEN TIPP-TRAINER
//  Läuft die Spielhalle in einem Fenster der App (iframe), meldet sie jeden Wechsel der Spielphase
//  (title / play / paused / over / menu) samt gespielter Zeit an die App. Die App entscheidet danach,
//  ob weitergespielt werden darf. Eigenständig geöffnet passiert nichts.
// ============================================================
const Host = (() => {
  const embedded = window.parent !== window;
  let playTicks = 0, lastKey = '';
  function post(ev, extra) {
    try { window.parent.postMessage(Object.assign({ tippTrainerArcade: 1, ev }, extra), '*'); } catch (e) { /* egal */ }
  }
  // einmal pro Update-Schritt: Spielzeit zählen (nur in der Phase "play", nicht in Pause/Titel/Ende)
  function step() {
    if (!embedded || !current) return;
    const phase = typeof current.phase === 'function' ? current.phase() : 'play';
    if (phase === 'play') playTicks++;
    const key = current.id + ':' + phase;
    if (key !== lastKey) {
      lastKey = key;
      post('phase', { game: current.id, phase, secs: playTicks / FPS });
    } else if (phase === 'play' && playTicks % FPS === 0) {
      post('tick', { secs: playTicks / FPS });
    }
  }
  return { step, ready() { post('ready'); } };
})();

// Wandkonturen: Wandkacheln werden um 3/8 Kachel nach innen versetzt umrandet.
// Einfach dicke Wände (Außenrand, Geisterhaus) ergeben so automatisch Doppellinien.
function buildWallLoops(wall) {
  const S = 3, o = 0.375, OFF = [0, o, 1 - o];
  const isW = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH && wall[y * MW + x] === 1;
  const GW = MW * S, GH = MH * S, VW = GW + 1;
  const R = new Uint8Array(GW * GH);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (!isW(x, y)) continue;
    for (let sy = 0; sy < 3; sy++) for (let sx = 0; sx < 3; sx++) {
      const dx = sx - 1, dy = sy - 1;
      let ok = true;
      if (dx && !isW(x + dx, y)) ok = false;
      if (dy && !isW(x, y + dy)) ok = false;
      if (dx && dy && !isW(x + dx, y + dy)) ok = false;
      if (ok) R[(y * S + sy) * GW + x * S + sx] = 1;
    }
  }
  const inR = (i, j) => i >= 0 && j >= 0 && i < GW && j < GH && R[j * GW + i] === 1;
  const edges = new Map();
  const add = (i0, j0, i1, j1, d) => {
    const k = j0 * VW + i0;
    let a = edges.get(k);
    if (!a) edges.set(k, a = []);
    a.push({ i0, j0, i1, j1, d, used: false });
  };
  // Richtungen: 0 rechts, 1 runter, 2 links, 3 hoch (im Uhrzeigersinn um die Fläche)
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    if (!inR(i, j)) continue;
    if (!inR(i, j - 1)) add(i, j, i + 1, j, 0);
    if (!inR(i + 1, j)) add(i + 1, j, i + 1, j + 1, 1);
    if (!inR(i, j + 1)) add(i + 1, j + 1, i, j + 1, 2);
    if (!inR(i - 1, j)) add(i, j + 1, i, j, 3);
  }
  const X = i => Math.floor(i / S) + OFF[i % S];
  const loops = [];
  for (const arr of edges.values()) for (const e0 of arr) {
    if (e0.used) continue;
    const pts = [];
    let e = e0;
    while (e && !e.used) {
      e.used = true;
      pts.push(e);
      const nexts = edges.get(e.j1 * VW + e.i1) || [];
      let best = null, bestRank = 9;
      for (const n of nexts) {
        if (n.used) continue;
        const turn = (n.d - e.d + 4) % 4;
        const rank = turn === 1 ? 0 : turn === 0 ? 1 : 2;
        if (rank < bestRank) { bestRank = rank; best = n; }
      }
      e = best;
    }
    const corners = [];
    for (let k = 0; k < pts.length; k++) {
      const prev = pts[(k + pts.length - 1) % pts.length];
      if (prev.d !== pts[k].d) corners.push([X(pts[k].i0), X(pts[k].j0)]);
    }
    if (corners.length >= 4) loops.push(corners);
  }
  return loops;
}

const MAZES = MAZE_DEFS.map(def => {
  const rows = def.rows || def.half.map(h => h + [...h].reverse().join(''));
  const wall = new Uint8Array(MW * MH), dots = new Uint8Array(MW * MH);
  let total = 0;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const ch = rows[y][x], i = y * MW + x;
    if (ch === '#') wall[i] = 1;
    else if (ch === '-') wall[i] = 2;
    else if (ch === '.') { dots[i] = 1; total++; }
    else if (ch === 'o') { dots[i] = 2; total++; }
  }
  return { def, rows, wall, dotsInit: dots, total, loops: buildWallLoops(wall) };
});

function strokeLoops(g, loops) {
  for (const L of loops) {
    const n = L.length;
    g.beginPath();
    for (let k = 0; k < n; k++) {
      const p = L[(k + n - 1) % n], q = L[k], r = L[(k + 1) % n];
      const lin = Math.hypot(q[0] - p[0], q[1] - p[1]);
      const lout = Math.hypot(r[0] - q[0], r[1] - q[1]);
      const cross = (q[0] - p[0]) * (r[1] - q[1]) - (q[1] - p[1]) * (r[0] - q[0]);
      const rad = Math.min(cross > 0 ? 0.5 : 0.25, lin / 2, lout / 2);
      if (k === 0) g.moveTo((p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      g.arcTo(q[0], q[1], r[0], r[1], rad);
    }
    g.closePath();
    g.stroke();
  }
}

  let c = wallCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = COLS * SCALE; c.height = ROWS * SCALE;
  const g = c.getContext('2d');
  g.setTransform(SCALE, 0, 0, SCALE, 0, SCALE * TOP);
  g.strokeStyle = color;
  g.lineWidth = 0.14;
  g.lineJoin = 'round';
  strokeLoops(g, MAZES[mi].loops);
  wallCache.set(key, c);
  return c;
}

// ============================================================
//  Level-Tabelle (angelehnt an das Original)
// ============================================================
const FRUITS = ['cherry', 'strawberry', 'orange', 'orange', 'apple', 'apple', 'melon', 'melon',
  'galaxian', 'galaxian', 'bell', 'bell', 'key'];
const FRUIT_PTS = { cherry: 100, strawberry: 300, orange: 500, apple: 700, melon: 1000, galaxian: 2000, bell: 3000, key: 5000 };
const fruitFor = L => FRUITS[Math.min(Math.max(L, 1), 13) - 1];

function getSpec(L) {
  const i = L === 1 ? 0 : L <= 4 ? 1 : L <= 20 ? 2 : 3;
  const FR = [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1];
  const FL = [5, 5, 5, 5, 5, 5, 5, 5, 3, 5, 5, 3, 3, 5, 3, 3, 0, 3];
  const EL = [20, 30, 40, 40, 40, 50, 50, 50, 60, 60, 60, 80, 80, 80, 100, 100, 100, 100, 120];
  return {
    pac: [0.80, 0.90, 1.00, 0.90][i],
    pacFright: [0.90, 0.95, 1.00, 0.90][i],
    ghost: [0.75, 0.85, 0.95, 0.95][i],
    ghostFright: [0.50, 0.55, 0.60, 0.60][i],
    ghostTunnel: [0.40, 0.45, 0.50, 0.50][i],
    elroy1: [0.80, 0.90, 1.00, 1.00][i],
    elroy2: [0.85, 0.95, 1.05, 1.05][i],
    elroyDots: EL[Math.min(L, 19) - 1],
    fright: L <= 18 ? FR[L - 1] : 0,
    flashes: L <= 18 ? FL[L - 1] : 0,
    modes: L === 1 ? [7, 20, 7, 20, 5, 20, 5] : L <= 4 ? [7, 20, 7, 20, 5, 1033, 1 / 60] : [5, 20, 5, 20, 5, 1037, 1 / 60],
    idle: L < 5 ? 4 : 3,
    fruit: fruitFor(L)
  };
}

const GHOST_INFO = [
  { name: 'BLINKY', nick: 'SHADOW', color: '#ff0000', scatter: [25, -3], x: 14, y: 11.5, dir: LEFT, house: false },
  { name: 'PINKY', nick: 'SPEEDY', color: '#ffb8ff', scatter: [2, -3], x: 14, y: 14.5, dir: DOWN, house: true },
  { name: 'INKY', nick: 'BASHFUL', color: '#00ffff', scatter: [27, 32], x: 12, y: 14.5, dir: UP, house: true },
  { name: 'CLYDE', nick: 'POKEY', color: '#ffb852', scatter: [0, 32], x: 16, y: 14.5, dir: UP, house: true }
];

// ============================================================
//  Sound (über AudioCore, alles synthetisch)
// ============================================================
const Sound = (() => {
  let loopOsc = null, loopGain = null, flip = false, phase = 0;
  // Einzeltöne laufen über einen eigenen Bus, damit sie beim Verlassen sofort verstummen
  let bus = null;
  const tone = (type, f0, f1, dur, vol, delay = 0) => {
    const ac = AudioCore.ctx;
    if (!ac) return;
    if (!bus) { bus = ac.createGain(); bus.connect(AudioCore.master); }
    AudioCore.tone(type, f0, f1, dur, vol, delay, bus);
  };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // Dauerton-Oszillator erst anlegen, wenn es einen AudioContext gibt
  function ensureLoop() {
    const ac = AudioCore.ctx;
    if (!ac) return false;
    if (!loopOsc) {
      loopOsc = ac.createOscillator();
      loopOsc.type = 'triangle';
      loopGain = ac.createGain();
      loopGain.gain.value = 0;
      loopOsc.connect(loopGain);
      loopGain.connect(AudioCore.master);
      loopOsc.start();
    }
    return true;
  }

  return {
    intro() {
      // Eigene kleine Start-Melodie (Arpeggien C – Dm – Em – F/G – C)
      const q = 0.125;
      const mel = [72, 79, 76, 79, 84, 79, 76, 79, 74, 81, 77, 81, 86, 81, 77, 81,
        76, 83, 79, 83, 88, 83, 79, 83, 77, 81, 84, 81, 79, 83, 86, 91];
      mel.forEach((m, i) => tone('square', mtof(m), mtof(m), q * 0.85, 0.07, i * q));
      const bass = [48, 48, 50, 50, 52, 52, 53, 55];
      bass.forEach((m, i) => tone('triangle', mtof(m), mtof(m), q * 3.7, 0.28, i * 4 * q));
      tone('square', mtof(84), mtof(84), 0.4, 0.07, 32 * q);
      tone('square', mtof(88), mtof(88), 0.4, 0.05, 32 * q);
      tone('triangle', mtof(36), mtof(36), 0.4, 0.3, 32 * q);
    },
    waka() {
      flip = !flip;
      if (flip) tone('triangle', 560, 240, 0.085, 0.38);
      else tone('triangle', 240, 560, 0.085, 0.38);
    },
    eatGhost() {
      tone('square', 110, 1400, 0.45, 0.06);
      tone('triangle', 220, 2000, 0.45, 0.25);
    },
    fruit() {
      tone('triangle', 400, 1300, 0.11, 0.35);
      tone('triangle', 1300, 500, 0.12, 0.35, 0.11);
    },
    extra() {
      for (let i = 0; i < 6; i++) tone('square', 1250, 1250, 0.08, 0.05, i * 0.13);
    },
    death() {
      for (let i = 0; i < 11; i++) {
        const hi = 950 - i * 60;
        tone('triangle', hi, hi * 0.55, 0.1, 0.32, i * 0.105);
      }
      tone('triangle', 110, 900, 0.12, 0.32, 1.28);
      tone('triangle', 110, 900, 0.12, 0.32, 1.46);
    },
    // Dauerton: 0 aus, 1 Sirene, 2 Angst-Modus, 3 Augen auf dem Heimweg
    loop(mode, lvl) {
      if (!ensureLoop()) return;
      const t = AudioCore.ctx.currentTime;
      phase += 1 / FPS;
      let f = 0, v = 0;
      if (mode === 1) {
        const p = (phase * (2.4 + lvl * 0.35)) % 1;
        const tri = p < 0.5 ? p * 2 : 2 - p * 2;
        const lo = 360 + lvl * 55;
        f = lo + lo * 0.8 * tri; v = 0.10;
      } else if (mode === 2) {
        const p = (phase * 7.5) % 1;
        f = 170 + 520 * p; v = 0.13;
      } else if (mode === 3) {
        const p = (phase * 12) % 1;
        f = 850 + 1300 * p; v = 0.07;
      }
      if (f) loopOsc.frequency.setTargetAtTime(f, t, 0.004);
      loopGain.gain.setTargetAtTime(v, t, 0.02);
    },
    silence() {
      if (loopGain && AudioCore.ctx) loopGain.gain.setTargetAtTime(0, AudioCore.ctx.currentTime, 0.01);
    },
    stopAll() {
      if (bus) { try { bus.disconnect(); } catch (e) { /* egal */ } bus = null; }
    }
  };
})();

// ============================================================
//  Spielzustand
// ============================================================
let state = 'title', prevState = null, stateT = 0, stateAge = 0;
let level = 1, startLevel = 1, score = 0, hiScore = 0, lives = 3, extraGiven = false;
let mazeIdx = 0, maze = MAZES[0], dots = MAZES[0].dotsInit.slice(), dotsLeft = 0, dotsEaten = 0;
let spec = getSpec(1);
let pac = null, ghosts = [];
let modeIdx = 0, modeT = 0, frightT = 0, combo = 0, elroy = 0;
let fruit = null, popups = [];
let dotIdle = 0, globalOn = false, globalDots = 0;
let inputDir = -1, tick = 0;
let eatenGhost = null, readyText = null, readyHide = 0;
let attract = null;

hiScore = Number(Store.get('mampfman.hi', 0)) || 0;

function saveHi() {
  Store.set('mampfman.hi', hiScore);
}

function setState(s, t) { state = s; stateT = t; stateAge = 0; }

function cellAt(x, y) {
  if (y < 0 || y >= MH) return 1;
  return maze.wall[y * MW + wrapT(x)];
}
const open = (x, y) => cellAt(x, y) === 0;

function inTunnel(tx, ty) {
  const z = maze.def.tunnel || 6;
  return ty >= 0 && ty < MH && maze.wall[ty * MW] === 0 && (tx < z || tx >= MW - z);
}
const isRestricted = (tx, ty) => (ty === 11 || ty === 23) && (tx === 12 || tx === 15);
const isScatter = () => modeIdx < spec.modes.length && modeIdx % 2 === 0;

function resetActors() {
  pac = { x: 14, y: 23.5, dir: LEFT, anim: 0, pause: 0 };
  ghosts = GHOST_INFO.map((g, i) => ({
    i, info: g, x: g.x, y: g.y, dir: g.dir,
    state: g.house ? 'house' : 'active', fright: false, dotCount: 0, dotLimit: 0
  }));
  ghosts[2].dotLimit = level === 1 ? 30 : 0;
  ghosts[3].dotLimit = level === 1 ? 60 : level === 2 ? 50 : 0;
  modeIdx = 0;
  modeT = Math.round(spec.modes[0] * FPS);
  frightT = 0; combo = 0; elroy = 0; dotIdle = 0;
  fruit = null; popups = []; eatenGhost = null; inputDir = -1;
}

function loadLevel() {
  spec = getSpec(level);
  mazeIdx = Math.floor((level - 1) / 2) % MAZES.length;
  maze = MAZES[mazeIdx];
  dots = maze.dotsInit.slice();
  dotsLeft = maze.total; dotsEaten = 0;
  globalOn = false; globalDots = 0;
  resetActors();
}

function startGame() {
  AudioCore.init();
  score = 0; lives = 3; extraGiven = false; level = startLevel;
  loadLevel();
  setState('ready', Math.round(4.4 * FPS));
  readyText = 'PLAYER ONE'; readyHide = Math.round(2.2 * FPS);
  Sound.intro();
}

function toTitle() {
  saveHi();
  setState('title', 0);
  resetAttract();
}

function addScore(n) {
  score += n;
  if (!extraGiven && score >= 10000) { extraGiven = true; lives++; Sound.extra(); }
  if (score > hiScore) hiScore = score;
}

function togglePause() {
  if (state === 'paused') { state = prevState; return; }
  if (['play', 'ready', 'eat', 'dying', 'clear'].includes(state)) { prevState = state; state = 'paused'; }
}

// ============================================================
//  Pac-Man-Bewegung (inkl. Kurvenschneiden wie im Original)
// ============================================================
const TURN_TOL = 0.45;

function movePac() {
  if (pac.pause > 0) { pac.pause--; return; }
  const s = (frightT > 0 ? spec.pacFright : spec.pac) * BASE;
  const tx = Math.floor(pac.x), ty = Math.floor(pac.y);
  const nd = inputDir;
  if (nd >= 0 && nd !== pac.dir) {
    if (nd === opp(pac.dir)) pac.dir = nd;
    else if (open(tx + DX[nd], ty + DY[nd])) {
      const off = DX[nd] !== 0 ? Math.abs(pac.y - (ty + 0.5)) : Math.abs(pac.x - (tx + 0.5));
      if (off <= TURN_TOL) pac.dir = nd;
    }
  }
  const d = pac.dir;
  let moved = 0;
  if (DX[d] !== 0) {
    pac.y = approach(pac.y, ty + 0.5, s);
    const cx = tx + 0.5, nx = pac.x + DX[d] * s;
    if (!open(tx + DX[d], ty) && (DX[d] > 0 ? nx >= cx : nx <= cx)) { moved = Math.abs(cx - pac.x); pac.x = cx; }
    else { pac.x = nx; moved = s; }
  } else {
    pac.x = approach(pac.x, tx + 0.5, s);
    const cy = ty + 0.5, ny = pac.y + DY[d] * s;
    if (!open(tx, ty + DY[d]) && (DY[d] > 0 ? ny >= cy : ny <= cy)) { moved = Math.abs(cy - pac.y); pac.y = cy; }
    else { pac.y = ny; moved = s; }
  }
  if (pac.x < 0) pac.x += MW; else if (pac.x >= MW) pac.x -= MW;
  pac.anim += moved;
}

// ============================================================
//  Geister-KI
// ============================================================
function ghostTarget(g) {
  if (g.state === 'eyes') return [13, 11];
  const ptx = Math.floor(pac.x), pty = Math.floor(pac.y), pd = pac.dir;
  if (isScatter() && !(g.i === 0 && elroy > 0)) return g.info.scatter;
  switch (g.i) {
    case 0: return [ptx, pty];
    case 1: {
      let tx = ptx + 4 * DX[pd], ty = pty + 4 * DY[pd];
      if (pd === UP) tx -= 4;           // originaler Überlauf-Fehler
      return [tx, ty];
    }
    case 2: {
      let ax = ptx + 2 * DX[pd], ay = pty + 2 * DY[pd];
      if (pd === UP) ax -= 2;
      const b = ghosts[0];
      return [2 * ax - Math.floor(b.x), 2 * ay - Math.floor(b.y)];
    }
    default: {
      const dx = Math.floor(g.x) - ptx, dy = Math.floor(g.y) - pty;
      return dx * dx + dy * dy > 64 ? [ptx, pty] : g.info.scatter;
    }
  }
}

function chooseDir(g) {
  const tx = wrapT(Math.floor(g.x)), ty = Math.floor(g.y);
  const rev = opp(g.dir);
  const opts = [];
  for (let d = 0; d < 4; d++) {
    if (d === rev) continue;
    if (!open(tx + DX[d], ty + DY[d])) continue;
    if (d === UP && g.state === 'active' && !g.fright && isRestricted(tx, ty)) continue;
    opts.push(d);
  }
  if (!opts.length) return rev;
  if (g.fright && g.state === 'active') return opts[Math.floor(Math.random() * opts.length)];
  const [gx, gy] = ghostTarget(g);
  let best = opts[0], bd = Infinity;
  for (const d of opts) {
    const nx = tx + DX[d], ny = ty + DY[d];
    const dd = (nx - gx) * (nx - gx) + (ny - gy) * (ny - gy);
    if (dd < bd) { bd = dd; best = d; }
  }
  return best;
}

// Ankunft in einer Kachelmitte – true = Bewegung für diesen Tick beenden
function arriveCenter(g) {
  const tx = wrapT(Math.floor(g.x)), ty = Math.floor(g.y);
  if (g.state === 'eyes' && ty === 11 && (tx === 13 || tx === 14)) { g.state = 'entering'; return true; }
  g.dir = chooseDir(g);
  return false;
}

function moveGrid(g, s) {
  for (let guard = 0; s > 1e-9 && guard < 8; guard++) {
    const horiz = DX[g.dir] !== 0;
    const pos = horiz ? g.x : g.y;
    const sign = horiz ? DX[g.dir] : DY[g.dir];
    if (Math.abs(pos - Math.floor(pos) - 0.5) < 1e-7) {
      const tx = wrapT(Math.floor(g.x)), ty = Math.floor(g.y);
      if (!open(tx + DX[g.dir], ty + DY[g.dir])) { g.dir = chooseDir(g); continue; }
    }
    const c = sign > 0 ? Math.floor(pos - 0.5) + 1.5 : Math.ceil(pos - 0.5) - 0.5;
    const dist = Math.abs(c - pos);
    if (s < dist) {
      if (horiz) g.x += sign * s; else g.y += sign * s;
      s = 0;
    } else {
      if (horiz) g.x = c; else g.y = c;
      s -= dist;
      if (g.x < 0) g.x += MW; else if (g.x >= MW) g.x -= MW;
      if (arriveCenter(g)) return;
    }
  }
  if (g.x < 0) g.x += MW; else if (g.x >= MW) g.x -= MW;
}

function ghostSpeed(g) {
  if (g.state === 'eyes' || g.state === 'entering') return BASE * 1.9;
  if (g.state === 'house' || g.state === 'leaving') return BASE * 0.5;
  if (inTunnel(wrapT(Math.floor(g.x)), Math.floor(g.y))) return BASE * spec.ghostTunnel;
  if (g.fright) return BASE * spec.ghostFright;
  if (g.i === 0 && elroy) return BASE * (elroy === 2 ? spec.elroy2 : spec.elroy1);
  return BASE * spec.ghost;
}

function updateGhost(g) {
  const s = ghostSpeed(g);
  switch (g.state) {
    case 'house':
      g.y += DY[g.dir] * s;
      if (g.y <= 14) { g.y = 14; g.dir = DOWN; }
      else if (g.y >= 15) { g.y = 15; g.dir = UP; }
      break;
    case 'leaving':
      if (Math.abs(g.x - 14) > 1e-6) {
        if (Math.abs(g.y - 14.5) > 1e-6) { g.dir = g.y > 14.5 ? UP : DOWN; g.y = approach(g.y, 14.5, s); }
        else { g.dir = g.x < 14 ? RIGHT : LEFT; g.x = approach(g.x, 14, s); }
      } else {
        g.x = 14; g.dir = UP;
        g.y = approach(g.y, 11.5, s);
        if (g.y <= 11.5) { g.y = 11.5; g.state = 'active'; g.dir = LEFT; }
      }
      break;
    case 'entering':
      if (Math.abs(g.x - 14) > 1e-6) { g.dir = g.x < 14 ? RIGHT : LEFT; g.x = approach(g.x, 14, s); }
      else {
        g.dir = DOWN;
        g.y = approach(g.y, 14.5, s);
        if (g.y >= 14.5) g.state = 'leaving';
      }
      break;
    default:
      moveGrid(g, s);
  }
}

function reverseGhosts() {
  for (const g of ghosts) if (g.state === 'active') g.dir = opp(g.dir);
}

function releaseGhosts() {
  const g = ghosts.find(h => h.i > 0 && h.state === 'house');
  if (!g || ghosts.some(h => h.state === 'leaving')) return;   // immer nur einer gleichzeitig
  if (globalOn) {
    if (globalDots >= [0, 7, 17, 32][g.i]) {
      g.state = 'leaving';
      if (g.i === 3) globalOn = false;
      return;
    }
  } else if (g.dotCount >= g.dotLimit) { g.state = 'leaving'; return; }
  if (dotIdle >= spec.idle * FPS) { g.state = 'leaving'; dotIdle = 0; }
}

function energize() {
  combo = 0;
  if (spec.fright > 0) {
    frightT = Math.round(spec.fright * FPS);
    for (const g of ghosts) {
      if (g.state === 'active') { g.fright = true; g.dir = opp(g.dir); }
      else if (g.state === 'house' || g.state === 'leaving') g.fright = true;
    }
  } else reverseGhosts();
}

// ============================================================
//  Spiellogik
// ============================================================
function eatDot() {
  const tx = wrapT(Math.floor(pac.x)), ty = Math.floor(pac.y);
  const i = ty * MW + tx, d = dots[i];
  if (!d) return false;
  dots[i] = 0; dotsLeft--; dotsEaten++; dotIdle = 0;
  if (globalOn) globalDots++;
  else {
    const g = ghosts.find(h => h.i > 0 && h.state === 'house');
    if (g) g.dotCount++;
  }
  if (d === 1) { addScore(10); pac.pause = 1; }
  else { addScore(50); pac.pause = 3; energize(); }
  Sound.waka();
  if (dotsEaten === 70 || dotsEaten === 170) fruit = { kind: spec.fruit, t: Math.round((9.3 + Math.random() * 0.7) * FPS) };
  if (dotsLeft === 0) { saveHi(); setState('clear', 0); return true; }
  return false;
}

function collide() {
  const ptx = wrapT(Math.floor(pac.x)), pty = Math.floor(pac.y);
  for (const g of ghosts) {
    if (g.state !== 'active') continue;
    let dx = Math.abs(g.x - pac.x);
    if (dx > MW / 2) dx = MW - dx;
    const dy = g.y - pac.y;
    const hit = (wrapT(Math.floor(g.x)) === ptx && Math.floor(g.y) === pty) || dx * dx + dy * dy < 0.36;
    if (!hit) continue;
    if (g.fright) {
      g.state = 'eyes'; g.fright = false;
      const pts = 200 << combo;
      combo = Math.min(combo + 1, 3);
      addScore(pts);
      popups.push({ x: g.x, y: g.y, text: String(pts), color: COL.cyan, t: FPS, freeze: true });
      eatenGhost = g;
      setState('eat', FPS);
      Sound.eatGhost();
    } else {
      setState('dying', 0);
    }
    return true;
  }
  return false;
}

function updateFruit() {
  if (!fruit) return;
  if (--fruit.t <= 0) { fruit = null; return; }
  if (Math.abs(pac.x - 14) < 0.8 && Math.abs(pac.y - 17.5) < 0.5) {
    const pts = FRUIT_PTS[fruit.kind];
    addScore(pts);
    popups.push({ x: 14, y: 17.5, text: String(pts), color: COL.pink, t: 2 * FPS });
    fruit = null;
    Sound.fruit();
  }
}

function updatePlay() {
  if (frightT > 0) {
    if (--frightT === 0) for (const g of ghosts) g.fright = false;
  } else if (modeIdx < spec.modes.length) {
    if (--modeT <= 0) {
      modeIdx++;
      modeT = modeIdx < spec.modes.length ? Math.round(spec.modes[modeIdx] * FPS) : 0;
      reverseGhosts();
    }
  }
  elroy = 0;
  if (!(globalOn && ghosts[3].state === 'house')) {
    if (dotsLeft <= spec.elroyDots / 2) elroy = 2;
    else if (dotsLeft <= spec.elroyDots) elroy = 1;
  }
  dotIdle++;
  releaseGhosts();
  movePac();
  if (eatDot()) return;
  if (collide()) return;
  for (const g of ghosts) updateGhost(g);
  if (collide()) return;
  updateFruit();
}

function updateDying() {
  if (stateAge === 60) Sound.death();
  if (stateAge >= 200) {
    lives--;
    if (lives <= 0) { saveHi(); setState('over', 3 * FPS); }
    else {
      resetActors();
      globalOn = true; globalDots = 0;
      setState('ready', 2 * FPS);
      readyText = null; readyHide = 0;
    }
  }
}

function updateClear() {
  if (stateAge >= 60 + 8 * 12 + 20) {
    level++;
    loadLevel();
    setState('ready', 3 * FPS);
    readyText = 'LEVEL ' + level; readyHide = Math.round(1.4 * FPS);
  }
}

// Kleine Verfolgungsjagd auf dem Titelbildschirm
function resetAttract() {
  attract = { phase: 0, px: 30, gx: [32.5, 34.5, 36.5, 38.5], eaten: [false, false, false, false],
    pause: 0, combo: 0, pop: null, pill: true, anim: 0 };
}
function updateAttract() {
  if (stateAge < 240) return;
  const a = attract;
  if (a.pause > 0) { if (--a.pause === 0) a.pop = null; return; }
  a.anim += 0.16;
  if (a.phase === 0) {
    a.px -= 0.16;
    for (let i = 0; i < 4; i++) a.gx[i] -= 0.165;
    if (a.px <= 3) { a.phase = 1; a.pill = false; }
  } else {
    a.px += 0.17;
    for (let i = 0; i < 4; i++) {
      if (a.eaten[i]) continue;
      a.gx[i] += 0.08;
      if (a.px >= a.gx[i] - 0.4) {
        a.eaten[i] = true;
        a.pop = { x: a.gx[i], text: String(200 << a.combo) };
        a.combo++;
        a.pause = 50;
        break;
      }
    }
    if (a.px > 32) resetAttract();
  }
}

function loopMode() {
  if (state !== 'play') return 0;
  if (ghosts.some(g => g.state === 'eyes' || g.state === 'entering')) return 3;
  if (frightT > 0) return 2;
  return 1;
}

function update() {
  tick++;
  if (state !== 'paused') {
    stateAge++;
    if (stateT > 0) stateT--;
  }
  switch (state) {
    case 'title': updateAttract(); break;
    case 'ready': if (stateT <= 0) setState('play', 0); break;
    case 'play': updatePlay(); break;
    case 'eat':
      if (stateT <= 0) {
        eatenGhost = null;
        popups = popups.filter(p => !p.freeze);
        setState('play', 0);
      }
      break;
    case 'dying': updateDying(); break;
    case 'clear': updateClear(); break;
    case 'over': if (stateT <= 0) toTitle(); break;
  }
  if (state === 'play') {
    for (const p of popups) p.t--;
    popups = popups.filter(p => p.t > 0);
  }
  Sound.loop(loopMode(), Math.min(4, Math.floor((1 - dotsLeft / maze.total) * 5)));
}

//  Zeichnen
// ============================================================
function drawPac(x, y, dir, mouth, r = 0.82) {
  ctx.fillStyle = COL.pac;
  ctx.beginPath();
  if (mouth < 0.02) {
    ctx.arc(x, y, r, 0, Math.PI * 2);
  } else {
    const base = [-Math.PI / 2, Math.PI, Math.PI / 2, 0][dir < 0 ? LEFT : dir];
    const a = mouth * 0.27 * Math.PI;
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, base + a, base + Math.PI * 2 - a);
    ctx.closePath();
  }
  ctx.fill();
}

function drawPacDeath(x, y, p) {
  if (p < 1) {
    const a = 0.05 + p * (Math.PI - 0.05);
    const base = -Math.PI / 2;
    ctx.fillStyle = COL.pac;
    ctx.beginPath();
    ctx.moveTo(x, y + 0.15 * p);
    ctx.arc(x, y, 0.82, base + a, base + Math.PI * 2 - a);
    ctx.closePath();
    ctx.fill();
  } else if (p < 1.25) {
    ctx.strokeStyle = COL.pac;
    ctx.lineWidth = 0.12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const ang = k * Math.PI / 4, c = Math.cos(ang), s = Math.sin(ang);
      ctx.moveTo(x + c * 0.35, y + s * 0.35);
      ctx.lineTo(x + c * 0.75, y + s * 0.75);
    }
    ctx.stroke();
  }
}

function drawGhost(x, y, color, dir, look, frame) {
  const r = 0.8;
  if (look !== 'eyes') {
    ctx.fillStyle = look === 'fright' ? COL.blue : look === 'flash' ? '#ffffff' : color;
    ctx.beginPath();
    ctx.arc(x, y - 0.1, r, Math.PI, 0);
    const yb = y + 0.78, h = 0.26, x0 = x + r, w = 2 * r, N = 12;
    ctx.lineTo(x0, yb - (frame ? h : 0));
    for (let k = 1; k <= N; k++) {
      const ph = (k / N) * 3 + (frame ? 0.5 : 0);
      const tri = Math.abs((ph % 1) * 2 - 1);
      ctx.lineTo(x0 - (w * k) / N, yb - h * (1 - tri));
    }
    ctx.closePath();
    ctx.fill();
  }
  if (look === 'fright' || look === 'flash') {
    const fc = look === 'fright' ? '#ffb8ae' : '#ff0000';
    ctx.fillStyle = fc;
    ctx.fillRect(x - 0.36, y - 0.32, 0.2, 0.2);
    ctx.fillRect(x + 0.16, y - 0.32, 0.2, 0.2);
    ctx.strokeStyle = fc;
    ctx.lineWidth = 0.09;
    ctx.lineJoin = 'miter';
    ctx.beginPath();
    for (let k = 0; k <= 6; k++) {
      const px = x - 0.54 + k * 0.18, py = y + 0.3 + (k % 2 ? -0.09 : 0.06);
      if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.stroke();
  } else {
    const ox = DX[dir] * 0.1, oy = DY[dir] * 0.12;
    ctx.fillStyle = '#ffffff';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(x + s * 0.3 + ox, y - 0.18 + oy, 0.21, 0.27, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = COL.blue;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(x + s * 0.3 + ox * 2, y - 0.18 + oy * 1.9, 0.12, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawFruit(kind, x, y, s = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  switch (kind) {
    case 'cherry':
      ctx.strokeStyle = '#de9751'; ctx.lineWidth = 0.11;
      ctx.beginPath();
      ctx.moveTo(-0.38, 0.12); ctx.quadraticCurveTo(-0.1, -0.4, 0.52, -0.62);
      ctx.moveTo(0.22, 0.3); ctx.quadraticCurveTo(0.18, -0.2, 0.52, -0.62);
      ctx.stroke();
      circ(-0.36, 0.3, 0.32, '#ff0000'); circ(0.22, 0.46, 0.32, '#ff0000');
      circ(-0.47, 0.2, 0.07, '#ffffff'); circ(0.11, 0.36, 0.07, '#ffffff');
      break;
    case 'strawberry':
      ctx.fillStyle = '#ff0000';
      ctx.beginPath();
      ctx.moveTo(0, 0.78);
      ctx.bezierCurveTo(-0.5, 0.45, -0.85, -0.45, 0, -0.42);
      ctx.bezierCurveTo(0.85, -0.45, 0.5, 0.45, 0, 0.78);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      for (const [sx, sy] of [[-0.35, -0.2], [0, -0.22], [0.35, -0.2], [-0.2, 0.05], [0.2, 0.05], [0, 0.3], [-0.18, 0.5], [0.18, 0.48]])
        ctx.fillRect(sx - 0.04, sy - 0.04, 0.08, 0.08);
      ctx.fillStyle = '#00de00';
      ctx.beginPath();
      ctx.moveTo(-0.45, -0.42); ctx.lineTo(-0.12, -0.52); ctx.lineTo(0, -0.76);
      ctx.lineTo(0.12, -0.52); ctx.lineTo(0.45, -0.42); ctx.lineTo(0, -0.3);
      ctx.closePath(); ctx.fill();
      break;
    case 'orange':
      circ(0, 0.12, 0.6, '#ffb852');
      ctx.strokeStyle = '#de9751'; ctx.lineWidth = 0.1;
      ctx.beginPath(); ctx.moveTo(0, -0.42); ctx.lineTo(-0.05, -0.7); ctx.stroke();
      ctx.fillStyle = '#00de00';
      ctx.beginPath(); ctx.ellipse(0.25, -0.6, 0.26, 0.11, -0.35, 0, Math.PI * 2); ctx.fill();
      circ(-0.25, -0.05, 0.05, '#de8a2a'); circ(0.2, 0.25, 0.05, '#de8a2a'); circ(-0.1, 0.45, 0.05, '#de8a2a');
      break;
    case 'apple':
      ctx.fillStyle = '#ff0000';
      ctx.beginPath();
      ctx.moveTo(0, -0.38);
      ctx.bezierCurveTo(0.45, -0.62, 0.82, -0.2, 0.56, 0.35);
      ctx.bezierCurveTo(0.42, 0.75, 0.12, 0.74, 0, 0.62);
      ctx.bezierCurveTo(-0.12, 0.74, -0.42, 0.75, -0.56, 0.35);
      ctx.bezierCurveTo(-0.82, -0.2, -0.45, -0.62, 0, -0.38);
      ctx.fill();
      ctx.strokeStyle = '#de9751'; ctx.lineWidth = 0.1;
      ctx.beginPath(); ctx.moveTo(0, -0.36); ctx.lineTo(0.12, -0.72); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.arc(-0.12, 0.1, 0.3, Math.PI * 1.05, Math.PI * 1.45); ctx.stroke();
      break;
    case 'melon':
      circ(0, 0.12, 0.62, '#7bde00');
      ctx.strokeStyle = '#008a00'; ctx.lineWidth = 0.07;
      for (const rx of [0.18, 0.42]) {
        ctx.beginPath(); ctx.ellipse(0, 0.12, rx, 0.6, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(0, -0.48); ctx.lineTo(0, 0.72); ctx.stroke();
      ctx.strokeStyle = '#de9751'; ctx.lineWidth = 0.1;
      ctx.beginPath(); ctx.moveTo(0, -0.5); ctx.lineTo(0.1, -0.74); ctx.stroke();
      break;
    case 'galaxian':
      ctx.strokeStyle = '#2121ff'; ctx.lineWidth = 0.2;
      ctx.beginPath();
      ctx.moveTo(-0.66, -0.45); ctx.lineTo(-0.66, 0.05); ctx.lineTo(0, 0.45);
      ctx.lineTo(0.66, 0.05); ctx.lineTo(0.66, -0.45);
      ctx.stroke();
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.moveTo(0, -0.62); ctx.lineTo(0.22, 0.05); ctx.lineTo(0, 0.72); ctx.lineTo(-0.22, 0.05);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(-0.36, -0.22, 0.72, 0.16);
      ctx.fillRect(-0.08, -0.45, 0.16, 0.2);
      break;
    case 'bell':
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.moveTo(-0.64, 0.45);
      ctx.quadraticCurveTo(-0.5, 0.3, -0.48, -0.05);
      ctx.quadraticCurveTo(-0.45, -0.64, 0, -0.66);
      ctx.quadraticCurveTo(0.45, -0.64, 0.48, -0.05);
      ctx.quadraticCurveTo(0.5, 0.3, 0.64, 0.45);
      ctx.closePath(); ctx.fill();
      circ(0, 0.54, 0.16, '#00ffff');
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.moveTo(-0.28, 0.25); ctx.quadraticCurveTo(-0.3, -0.35, -0.05, -0.45); ctx.stroke();
      break;
    case 'key':
      circ(0, -0.45, 0.3, '#00ffff');
      circ(0, -0.5, 0.1, '#000000');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-0.06, -0.18, 0.12, 0.92);
      ctx.fillRect(0.06, 0.38, 0.18, 0.1);
      ctx.fillRect(0.06, 0.58, 0.13, 0.1);
      break;
  }
  ctx.restore();
}

function ghostLook(g) {
  if (g.state === 'eyes' || g.state === 'entering') return 'eyes';
  if (g.fright) {
    if (spec.flashes && frightT <= spec.flashes * 24 && Math.floor(frightT / 12) % 2 === 0) return 'flash';
    return 'fright';
  }
  return 'normal';
}

function wrapped(x, fn) {
  fn(x);
  if (x < 1) fn(x + MW);
  else if (x > MW - 1) fn(x - MW);
}

function drawHud() {
  const blink = state !== 'play' || Math.floor(tick / 16) % 2 === 0;
  if (blink) drawText('1UP', 3, 0, COL.white);
  drawText('HIGH SCORE', 9, 0, COL.white);
  drawText(score ? String(score) : '00', 7, 1, COL.white, 1, 'right');
  if (hiScore) drawText(String(hiScore), 17, 1, COL.white, 1, 'right');
  if (state !== 'title') {
    drawText('LEVEL', 22, 0, COL.white);
    drawText(String(level), 27, 1, COL.white, 1, 'right');
    const shown = Math.min(lives - (state === 'over' ? 0 : 1), 6);
    for (let i = 0; i < shown; i++) drawPac(2 + i * 2, 34.95, LEFT, 0.6, 0.72);
    const n = Math.min(level, 7);
    for (let i = 0; i < n; i++) drawFruit(fruitFor(level - i), 26 - i * 2, 34.95, 0.8);
  }
}

function drawTitle() {
  drawText('MAMPF-MAN', 14, 4, COL.yellow, 2, 'center');
  const a = stateAge;
  if (a > 10) drawText('CHARACTER / NICKNAME', 7, 8, COL.white);
  for (let i = 0; i < 4; i++) {
    const g = GHOST_INFO[i], y = 10 + i * 2.5, base = 30 + i * 45;
    if (a > base) drawGhost(4.5, y + 0.5, g.color, RIGHT, 'normal', Math.floor(tick / 8) % 2);
    if (a > base + 15) drawText('-' + g.nick, 7, y, g.color);
    if (a > base + 30) drawText('"' + g.name + '"', 17, y, g.color);
  }
  if (a > 210) {
    ctx.fillStyle = COL.dot;
    ctx.fillRect(10.375, 20.375, 0.25, 0.25);
    drawText('10 PTS', 12, 20, COL.white);
    if (Math.floor(tick / 10) % 2 === 0) circ(10.5, 22, 0.45, COL.dot);
    drawText('50 PTS', 12, 21.5, COL.white);
  }
  drawText('START-LEVEL  < ' + startLevel + ' >', 14, 24, COL.cyan, 1, 'center');
  const mz = MAZES[Math.floor((startLevel - 1) / 2) % MAZES.length].def;
  drawText('LABYRINTH: ' + mz.name, 14, 25.2, mz.color, 0.8, 'center');
  if (Math.floor(tick / 30) % 2 === 0) drawText('ENTER ODER TIPPEN', 14, 27, COL.white, 1, 'center');
  drawText('ZUM STARTEN', 14, 28, COL.white, 1, 'center');

  // Verfolgungsjagd
  if (a >= 240) {
    const at = attract, y = 31;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 29.5, COLS, 3); ctx.clip();
    if (at.pill && Math.floor(tick / 10) % 2 === 0) circ(2.5, y, 0.45, COL.dot);
    for (let i = 0; i < 4; i++) {
      if (at.eaten[i]) continue;
      drawGhost(at.gx[i], y, GHOST_INFO[i].color, at.phase ? RIGHT : LEFT, at.phase ? 'fright' : 'normal', Math.floor(tick / 8) % 2);
    }
    if (at.pop) drawText(at.pop.text, at.pop.x, y - 0.4, COL.cyan, 0.8, 'center');
    else drawPac(at.px, y, at.phase ? RIGHT : LEFT, Math.abs(Math.sin(at.anim * Math.PI / 0.75)));
    ctx.restore();
  }
  drawText('PFEILTASTEN / WASD / WISCHEN', 14, 32.9, COL.white, 0.8, 'center');
  drawText('P = PAUSE    M = TON AN/AUS', 14, 33.9, COL.white, 0.8, 'center');
  drawText('ESC ODER HIER TIPPEN = MENÜ', 14, 35.1, COL.cyan, 0.8, 'center');
}

const PAUSE_BTN = {
  resume: { x0: 9, y0: 18, x1: 19, y1: 20 },
  menu: { x0: 9, y0: 21, x1: 19, y1: 23 }
};

function drawButton(b, label) {
  roundRectPath(ctx, b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0, 0.5);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.strokeStyle = COL.blue;
  ctx.lineWidth = 0.14;
  ctx.stroke();
  drawText(label, (b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2 - 0.45, COL.white, 1, 'center');
}

function draw() {
  drawHud();
  if (state === 'title') { drawTitle(); return; }

  const st = state === 'paused' ? prevState : state;
  const age = stateAge;

  // Labyrinth (blinkt nach Levelende)
  const flashing = st === 'clear' && age >= 60;
  let wc = maze.def.color;
  if (flashing && Math.floor((age - 60) / 12) % 2 === 0) wc = '#ffffff';
  ctx.drawImage(getWallCanvas(mazeIdx, wc), 0, 0, COLS, ROWS);
  if (!flashing) {
    ctx.fillStyle = COL.door;
    ctx.fillRect(12.8, TOP + 12.42, 2.4, 0.16);
  }

  // Punkte
  ctx.fillStyle = COL.dot;
  const pillOn = st !== 'play' || Math.floor(tick / 10) % 2 === 0;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const d = dots[y * MW + x];
    if (d === 1) ctx.fillRect(x + 0.375, y + TOP + 0.375, 0.25, 0.25);
    else if (d === 2 && pillOn) {
      ctx.beginPath(); ctx.arc(x + 0.5, y + TOP + 0.5, 0.45, 0, Math.PI * 2); ctx.fill();
    }
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(0, TOP, MW, MH); ctx.clip();

  if (fruit) drawFruit(fruit.kind, 14, 17.5 + TOP, 1);
  for (const p of popups) drawText(p.text, p.x, p.y + TOP - 0.4, p.color, 0.8, 'center');

  const hideAll = st === 'ready' && age < readyHide;
  // Pac-Man
  if (!hideAll && st !== 'eat' && st !== 'over') {
    if (st === 'dying' && age >= 60) {
      drawPacDeath(pac.x, pac.y + TOP, (age - 60) / 90);
    } else {
      const mouth = (st === 'play' || st === 'dying') ? Math.abs(Math.sin(pac.anim * Math.PI / 0.75)) : 0;
      wrapped(pac.x, x => drawPac(x, pac.y + TOP, pac.dir, mouth));
    }
  }
  // Geister
  const hideGhosts = hideAll || st === 'over' || (st === 'dying' && age >= 60) || (st === 'clear' && age >= 60);
  if (!hideGhosts) {
    const frame = Math.floor(tick / 8) % 2;
    for (let k = ghosts.length - 1; k >= 0; k--) {
      const g = ghosts[k];
      if (g === eatenGhost) continue;
      const look = ghostLook(g);
      wrapped(g.x, x => drawGhost(x, g.y + TOP, g.info.color, g.dir, look, frame));
    }
  }
  ctx.restore();

  // Texte
  if (st === 'ready') {
    if (readyText && age < readyHide) drawText(readyText, 14, 14, COL.cyan, 1, 'center');
    drawText('READY!', 14, 20, COL.yellow, 1, 'center');
  } else if (st === 'over') {
    drawText('GAME  OVER', 14, 20, COL.red, 1, 'center');
  }
  if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, TOP, COLS, MH);
    drawText('PAUSE', 14, 14, COL.yellow, 2, 'center');
    drawButton(PAUSE_BTN.resume, 'WEITER');
    drawButton(PAUSE_BTN.menu, 'MENÜ');
    drawText('P = WEITER    ESC = MENÜ', 14, 25, COL.white, 0.8, 'center');
  }
}

// ============================================================
//  Eingabe & Modul-Schnittstelle
// ============================================================
const KEYS = { ArrowUp: UP, KeyW: UP, ArrowLeft: LEFT, KeyA: LEFT, ArrowDown: DOWN, KeyS: DOWN, ArrowRight: RIGHT, KeyD: RIGHT };
const inBox = (b, x, y) => x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1;

function onKeyDown(e) {
  const d = KEYS[e.code];
  if (d !== undefined) {
    if (state === 'title') {
      if (d === LEFT || d === DOWN) startLevel = Math.max(1, startLevel - 1);
      else startLevel = Math.min(MAX_START, startLevel + 1);
    } else inputDir = d;
    return true;
  }
  const own = ['Enter', 'NumpadEnter', 'Space', 'KeyP', 'Escape'].includes(e.code);
  if (!own) return false;
  if (e.repeat) return true;
  switch (e.code) {
    case 'Enter': case 'NumpadEnter': case 'Space':
      if (state === 'title') startGame();
      else if (state === 'paused') togglePause();
      break;
    case 'KeyP':
      togglePause();
      break;
    case 'Escape':
      if (state === 'title' || state === 'over' || state === 'paused') Core.exitToMenu();
      else togglePause();
      break;
  }
  return true;
}

function onKeyUp() { return false; }

function handleTap(tx, ty) {
  if (tx < 0 || tx > COLS || ty < 0 || ty > ROWS) return;
  if (state === 'title') {
    if (ty >= 23.3 && ty <= 26) {
      if (tx < 14) startLevel = Math.max(1, startLevel - 1);
      else startLevel = Math.min(MAX_START, startLevel + 1);
      return;
    }
    if (ty >= 34.8) { Core.exitToMenu(); return; }
    if (ty >= 32.5) return;                     // Hinweiszeilen: nichts tun
    startGame();
  } else if (state === 'paused') {
    if (inBox(PAUSE_BTN.menu, tx, ty)) Core.exitToMenu();
    else togglePause();
  } else if (state === 'over') {
    toTitle();
  } else if (ty < TOP) {
    togglePause();
  }
}

// Wischen (Richtung) und Tippen; Schwelle 16 CSS-Pixel
let ptr = null;
function onPointer(type, x, y, id) {
  if (type === 'down') {
    if (!ptr) ptr = { id, x, y, moved: false };
    return;
  }
  if (!ptr || id !== ptr.id) return;
  if (type === 'move') {
    const px = Core.unitPx();
    const dx = (x - ptr.x) * px, dy = (y - ptr.y) * px;
    if (Math.hypot(dx, dy) >= 16) {
      const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
      if (state !== 'title' && state !== 'paused') inputDir = d;
      ptr.x = x; ptr.y = y; ptr.moved = true;
    }
  } else if (type === 'up') {
    const tap = !ptr.moved;
    ptr = null;
    if (tap) handleTap(x, y);
  } else {
    ptr = null;
  }
}

function onBlur() {
  ptr = null;
  Sound.silence();                              // Sirene verstummt auch bei verstecktem Tab
  if (['play', 'ready', 'eat', 'dying', 'clear'].includes(state)) togglePause();
}

function enter() {
  ptr = null; inputDir = -1;
  toTitle();
}

function exit() {
  saveHi();
  Sound.silence();
  Sound.stopAll();
  ptr = null; inputDir = -1;
  setState('title', 0);
}

return {
  id: 'mampf', title: 'MAMPF-MAN',
  enter, exit, update, draw, onKeyDown, onKeyUp, onPointer, onBlur,
  hiScore: () => hiScore,
  phase: () => state === 'title' ? 'title' : state === 'over' ? 'over' : state === 'paused' ? 'paused' : 'play',
  drawPac, drawGhost
};
})();
