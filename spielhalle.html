const Tetris = (() => {
  // ------------------------------------------------------------
  //  Regeln: Konstanten und Tabellen (reine Daten)
  // ------------------------------------------------------------
  const W = 10, VIS = 20, HID = 20, H = VIS + HID;  // 20 sichtbare + 20 versteckte Reihen darüber
  const SPAWN_X = 3, SPAWN_Y = HID - 2;             // Box-Ursprung: die zwei Reihen direkt über dem Sichtbereich
  const LOCK_DELAY = 30, MAX_RESETS = 15;
  const READY_T = 45, ARE_T = 6, CLEAR_T = 20;
  const DAS = 10, ARR = 2;
  const SOFT_FACTOR = 20, SOFT_MIN = 20 / 60;       // Softdrop: 20-fache Schwerkraft, mindestens 20 Reihen/s
  const MAX_START = 15, MAX_GRAV_LEVEL = 20, MAX_SCORE = 999999999;
  const LINES_PER_LEVEL = 6;   // schneller als die Guideline (10), damit Partien nicht ewig dauern
  const OVER_MIN = 60, OVER_AUTO = 480;             // Game Over: Eingabe ab 1 s, automatisch zurück nach 8 s
  const BUF_T = 12;                                 // IRS/IHS: so lange vor dem Erscheinen zählt ein Druck noch
  const EPS = 1e-9;
  const I = 0, O = 1, T = 2, GRAY = 7;              // Typen in der Reihenfolge I O T S Z J L

  // Grundstellung (Zustand 0, flache Seite unten); box = Drehbox, 0 = dreht nicht (O)
  const PIECE_DEFS = [
    { box: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]] },  // I
    { box: 0, cells: [[1, 0], [2, 0], [1, 1], [2, 1]] },  // O
    { box: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]] },  // T
    { box: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },  // S
    { box: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]] },  // Z
    { box: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]] },  // J
    { box: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]] }   // L
  ];
  // SHAPES[typ][zustand], Zustände 0, R, 2, L (Drehung im Uhrzeigersinn um die Boxmitte, y nach unten)
  const SHAPES = PIECE_DEFS.map(d => {
    const s = [d.cells];
    for (let r = 1; r < 4; r++) s.push(d.box ? s[r - 1].map(([x, y]) => [d.box - 1 - y, x]) : d.cells);
    return s;
  });
  const BOTTOM = SHAPES.map(s => s.map(cells => Math.max(...cells.map(p => p[1]))));

  // SRS-Kicktabellen in der üblichen Schreibweise (x nach rechts, y nach OBEN), Schlüssel 'von>nach'
  const SRS_JLSTZ = {
    '0>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '1>0': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '1>2': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '2>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '2>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    '3>2': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '3>0': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '0>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]]
  };
  const SRS_I = {
    '0>1': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '1>0': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '1>2': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    '2>1': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '2>3': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '3>2': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '3>0': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '0>3': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]]
  };
  // auf Feldkoordinaten umgerechnet (y nach unten)
  const toField = tab => {
    const o = {};
    for (const k in tab) o[k] = tab[k].map(([x, y]) => [x, y ? -y : 0]);
    return o;
  };
  const KICKS_JLSTZ = toField(SRS_JLSTZ), KICKS_I = toField(SRS_I);

  // Punkte (x Level); Index = Anzahl Reihen
  const LINE_PTS = [0, 100, 300, 500, 800];
  const TSPIN_PTS = [400, 800, 1200, 1600];
  const MINI_PTS = [100, 200, 400];
  const PC_PTS = [0, 800, 1200, 1800, 2000], PC_B2B_TETRIS = 3200;   // Perfect Clear (Bonus)
  const COMBO_PTS = 50, B2B_FACTOR = 1.5;
  const CLEAR_NAMES = ['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS!'];

  // Schwerkraft nach Guideline: Sekunden pro Reihe = (0.8 - (L-1)*0.007)^(L-1); Ergebnis in Reihen pro Tick
  function gravityOf(level) {
    const L = Math.max(1, Math.min(MAX_GRAV_LEVEL, level));
    return 1 / (Math.pow(0.8 - (L - 1) * 0.007, L - 1) * 60);
  }

  // ------------------------------------------------------------
  //  Spiellogik (rein, ohne Core, ohne Zeichnen)
  // ------------------------------------------------------------
  function newBag(rng) {
    const b = [0, 1, 2, 3, 4, 5, 6];
    for (let i = 6; i > 0; i--) {
      const v = rng();
      const j = v >= 0 && v < 1 ? Math.floor(v * (i + 1)) : 0;
      const tmp = b[i]; b[i] = b[j]; b[j] = tmp;
    }
    return b;
  }

  function newGame(level, rng = Math.random) {
    const G = {
      board: new Uint8Array(W * H), rng, queue: [],
      cur: null, hold: -1, holdUsed: false,
      startLevel: level, level, lines: 0, score: 0, combo: -1, b2b: false,
      phase: 'ready', timer: READY_T, clearRows: [], over: '',
      grav: 0, softPrev: false, lockT: 0, resets: 0, lowest: 0, touched: false, wasGround: false,
      lastRot: false, lastKick: -1, pieces: 0, events: []
    };
    fillQueue(G);
    return G;
  }

  function fillQueue(G) {
    while (G.queue.length < 7) G.queue.push(...newBag(G.rng));
  }

  function takeNext(G) {
    const t = G.queue.shift();
    fillQueue(G);
    return t;
  }

  function fits(G, t, r, x, y) {
    for (const [cx, cy] of SHAPES[t][r]) {
      const px = x + cx, py = y + cy;
      if (px < 0 || px >= W || py < 0 || py >= H || G.board[py * W + px]) return false;
    }
    return true;
  }

  function addScore(G, n) {
    G.score = Math.min(MAX_SCORE, G.score + n);
  }

  // tiefste erreichte Reihe (unterste Zelle); neue Tiefe setzt den Reset-Zähler zurück
  function noteLowest(G) {
    const p = G.cur, b = p.y + BOTTOM[p.t][p.r];
    if (b > G.lowest) {
      G.lowest = b; G.resets = 0; G.lockT = 0; G.touched = false;
    }
  }

  // erfolgreiche Bewegung/Drehung: Lock-Verzögerung zurücksetzen (max. 15 Mal)
  function manipulated(G) {
    if (G.touched && G.resets < MAX_RESETS) {
      G.resets++;
      G.lockT = 0;
    }
  }

  function gameOver(G, why) {
    G.phase = 'over';
    G.over = why;
    G.cur = null;
    G.events.push({ type: 'over', why });
  }

  function spawnPiece(G, t) {
    G.cur = { t, r: 0, x: SPAWN_X, y: SPAWN_Y };
    G.phase = 'fall';
    G.grav = 0; G.softPrev = false; G.lockT = 0; G.resets = 0; G.touched = false; G.wasGround = false;
    G.lastRot = false; G.lastKick = -1;
    G.pieces++;
    if (!fits(G, t, 0, SPAWN_X, SPAWN_Y)) { gameOver(G, 'blockout'); return false; }
    if (fits(G, t, 0, SPAWN_X, SPAWN_Y + 1)) G.cur.y++;
    G.lowest = G.cur.y + BOTTOM[t][0];
    G.events.push({ type: 'spawn', t, first: G.pieces === 1 });
    return true;
  }

  function moveDown(G) {
    const p = G.cur;
    if (!fits(G, p.t, p.r, p.x, p.y + 1)) return false;
    p.y++;
    G.lastRot = false;
    noteLowest(G);
    return true;
  }

  function tryMove(G, dx) {
    const p = G.cur;
    if (!p || G.phase !== 'fall' || !fits(G, p.t, p.r, p.x + dx, p.y)) return false;
    p.x += dx;
    G.lastRot = false;
    manipulated(G);
    G.events.push({ type: 'move' });
    return true;
  }

  function tryRotate(G, dir) {
    const p = G.cur;
    if (!p || G.phase !== 'fall' || p.t === O) return false;
    const to = (p.r + (dir > 0 ? 1 : 3)) % 4;
    const kicks = (p.t === I ? KICKS_I : KICKS_JLSTZ)[p.r + '>' + to];
    for (let k = 0; k < kicks.length; k++) {
      const nx = p.x + kicks[k][0], ny = p.y + kicks[k][1];
      if (!fits(G, p.t, to, nx, ny)) continue;
      p.x = nx; p.y = ny; p.r = to;
      G.lastRot = true;
      G.lastKick = k;
      noteLowest(G);
      manipulated(G);
      G.events.push({ type: 'rotate', kick: k });
      return true;
    }
    return false;
  }

  function softStep(G) {
    if (!G.cur || G.phase !== 'fall' || !moveDown(G)) return false;
    addScore(G, 1);
    return true;
  }

  function hardDrop(G) {
    if (!G.cur || G.phase !== 'fall') return false;
    let n = 0;
    while (n < H && moveDown(G)) n++;
    addScore(G, 2 * n);
    const p = G.cur;
    G.events.push({ type: 'hard', rows: n, t: p.t, r: p.r, x: p.x, y: p.y });
    lockPiece(G, true);
    return true;
  }

  function holdPiece(G) {
    if (!G.cur || G.phase !== 'fall' || G.holdUsed) return false;
    const t = G.cur.t;
    const next = G.hold >= 0 ? G.hold : takeNext(G);
    G.hold = t;
    G.holdUsed = true;
    G.events.push({ type: 'hold' });
    spawnPiece(G, next);
    return true;
  }

  // T-Spin nach der 3-Ecken-Regel; '' / 'mini' / 'full'
  function spinType(G) {
    const p = G.cur;
    if (!p || p.t !== T || !G.lastRot) return '';
    const cx = p.x + 1, cy = p.y + 1;
    const occ = (x, y) => (x < 0 || x >= W || y < 0 || y >= H || G.board[y * W + x] ? 1 : 0);
    // Ecken im Uhrzeigersinn: oben links, oben rechts, unten rechts, unten links
    const k = [occ(cx - 1, cy - 1), occ(cx + 1, cy - 1), occ(cx + 1, cy + 1), occ(cx - 1, cy + 1)];
    if (k[0] + k[1] + k[2] + k[3] < 3) return '';
    // die zwei Ecken auf der Seite, in die die Spitze zeigt
    const front = k[p.r] && k[(p.r + 1) % 4];
    return front || G.lastKick === 4 ? 'full' : 'mini';
  }

  // Wertung einer Ablage (rein): Punkte, neuer B2B-Status, neuer Combo-Zähler, Perfect Clear
  function rateClear(lines, spin, level, b2b, combo, perfect = false) {
    const table = spin === 'full' ? TSPIN_PTS : spin === 'mini' ? MINI_PTS : LINE_PTS;
    const base = table[lines] || 0;
    const difficult = lines > 0 && (lines === 4 || spin !== '');
    const isB2B = difficult && b2b;
    let pts = base * level;
    if (isB2B) pts = Math.floor(pts * B2B_FACTOR);
    const nextCombo = lines > 0 ? combo + 1 : -1;
    if (nextCombo > 0) pts += COMBO_PTS * nextCombo * level;
    const pc = !!perfect && lines > 0;
    if (pc) pts += (lines === 4 && isB2B ? PC_B2B_TETRIS : PC_PTS[Math.min(4, lines)]) * level;
    return { pts, isB2B, b2b: lines > 0 ? difficult : b2b, combo: nextCombo, pc };
  }

  function fullRows(G) {
    const rows = [];
    for (let y = 0; y < H; y++) {
      let full = true;
      for (let x = 0; x < W && full; x++) if (!G.board[y * W + x]) full = false;
      if (full) rows.push(y);
    }
    return rows;
  }

  function lockPiece(G, hard = false) {
    const p = G.cur;
    const spin = spinType(G);
    const cells = SHAPES[p.t][p.r].map(([cx, cy]) => [p.x + cx, p.y + cy]);
    let above = true;
    for (const [x, y] of cells) {
      G.board[y * W + x] = p.t + 1;
      if (y >= HID) above = false;
    }
    G.cur = null;
    G.holdUsed = false;
    G.events.push({ type: 'lock', t: p.t, cells, hard });
    if (above) { gameOver(G, 'lockout'); return; }
    const rows = fullRows(G);
    // Perfect Clear: nach dem Abräumen bliebe das ganze Feld (auch versteckte Reihen) leer
    let filled = 0;
    if (rows.length) for (let i = 0; i < G.board.length; i++) if (G.board[i]) filled++;
    const level = G.level;
    const res = rateClear(rows.length, spin, level, G.b2b, G.combo, rows.length > 0 && filled === rows.length * W);
    G.b2b = res.b2b;
    G.combo = res.combo;
    addScore(G, res.pts);
    if (rows.length || spin) {
      G.events.push({ type: 'clear', lines: rows.length, rows, spin, b2b: res.isB2B, combo: res.combo, pts: res.pts, perfect: res.pc });
    }
    if (rows.length) {
      G.lines += rows.length;
      const lv = G.startLevel + Math.floor(G.lines / LINES_PER_LEVEL);
      if (lv > G.level) {
        G.level = lv;
        G.events.push({ type: 'level', level: lv });
      }
      G.clearRows = rows;
      G.phase = 'clear';
      G.timer = CLEAR_T;
    } else {
      G.phase = 'are';
      G.timer = ARE_T;
    }
  }

  function collapse(G) {
    const gone = new Set(G.clearRows);
    const nb = new Uint8Array(W * H);
    let dst = H - 1;
    for (let y = H - 1; y >= 0; y--) {
      if (gone.has(y)) continue;
      nb.set(G.board.subarray(y * W, y * W + W), dst * W);
      dst--;
    }
    G.board.set(nb);
    G.clearRows = [];
  }

  // Phasen-Zeitgeber: Bereit, Spawn-Verzögerung (ARE), Reihen-Animation; true = neuer Stein erschienen
  function advance(G) {
    if (G.phase === 'ready' || G.phase === 'are') {
      if (--G.timer <= 0) return spawnPiece(G, takeNext(G));
    } else if (G.phase === 'clear') {
      if (--G.timer <= 0) {
        collapse(G);
        return spawnPiece(G, takeNext(G));
      }
    }
    return false;
  }

  // Schwerkraft, Softdrop und Lock-Verzögerung für einen Tick
  function fall(G, soft) {
    const p = G.cur;
    if (!p || G.phase !== 'fall') return;
    const g0 = gravityOf(G.level);
    const v = soft ? Math.max(g0 * SOFT_FACTOR, SOFT_MIN) : g0;
    if (soft && !G.softPrev) G.grav = Math.max(G.grav, 1 - v);   // Softdrop reagiert sofort
    else if (!soft && G.softPrev) G.grav = 0;                     // danach wieder normale Schwerkraft
    G.softPrev = soft;
    G.grav += v;
    for (let n = 0; G.grav >= 1 - EPS && n <= H; n++) {
      if (!moveDown(G)) break;
      G.grav -= 1;
      if (soft) addScore(G, 1);
    }
    const ground = !fits(G, p.t, p.r, p.x, p.y + 1);
    if (!ground) {
      G.wasGround = false;
      if (G.grav > 1) G.grav = 0;
      return;
    }
    G.grav = 0;
    const landed = !G.wasGround;
    G.wasGround = true;
    G.touched = true;
    // ohne Resets: Sperre sofort beim Aufsetzen, sonst nach 30 Ticks
    if ((landed && G.resets >= MAX_RESETS) || ++G.lockT >= LOCK_DELAY) lockPiece(G);
  }

  function ghostY(G) {
    const p = G.cur;
    let y = p.y;
    while (y < H && fits(G, p.t, p.r, p.x, y + 1)) y++;
    return y;
  }

  // ------------------------------------------------------------
  //  Sitzung (Modus, Eingabe, Rekord)
  // ------------------------------------------------------------
  let mode = 'title', modeT = 0, game = null, clock = 0;
  let startLevel = 1, hi = 0, hiStored = 0, hiAtStart = 0, newRecord = false, musicOn = true;
  let popup = null, lvPop = null, bgPieces = [];
  const fx = [];
  const keys = new Set(), actions = [], pointers = new Map();
  let dasDir = 0, dasT = 0, arrT = 0;
  let irs = null, ihs = null, ims = null;   // gepuffert ohne aktiven Stein: Drehen, Halten, erster Schritt

  function read(k, f) {
    try { return Core.storage.get(k, f); } catch (e) { return f; }
  }
  function write(k, v) {
    try { Core.storage.set(k, v); } catch (e) { /* egal */ }
  }
  function readInt(k, f, lo, hiLim) {
    const v = Number(read(k, f));
    return Number.isFinite(v) ? Math.max(lo, Math.min(hiLim, Math.floor(v))) : f;
  }

  function loadPrefs() {
    hiStored = readInt('tetris.hi', 0, 0, MAX_SCORE);
    hi = Math.max(hi, hiStored);   // Rekord dieser Sitzung bleibt, auch wenn der Speicher versagt
    musicOn = read('tetris.music', true) !== false;
    startLevel = readInt('tetris.start', 1, 1, MAX_START);
  }

  function saveHi() {
    if (game && game.score > hi) hi = game.score;
    if (hi !== hiStored) {
      write('tetris.hi', hi);
      hiStored = hi;
    }
  }

  function resetInput() {
    keys.clear();
    actions.length = 0;
    pointers.clear();
    dasDir = 0; dasT = 0; arrT = 0;
    irs = null; ihs = null; ims = null;
  }

  // Aktion für den nächsten Tick; src = auslösende Taste ('' bei Touch)
  function queue(a, src = '') {
    if (actions.length < 32) actions.push({ a, src, t: clock });
  }

  function startGame() {
    game = newGame(startLevel);
    mode = 'play'; modeT = 0;
    hiAtStart = hi; newRecord = false;
    musIdx = 0;
    popup = null; lvPop = null; fx.length = 0;
    resetInput();
    sfx('start');
  }

  function toTitle() {
    saveHi();
    stopMusic();
    mode = 'title'; modeT = 0;
    game = null; popup = null; lvPop = null; fx.length = 0;
    resetInput();
    if (!bgPieces.length) initBg();
  }

  function pause() {
    if (mode !== 'play') return;
    mode = 'paused'; modeT = 0;
    resetInput();
    stopMusic();
    sfx('pause');
  }

  function resume() {
    if (mode !== 'paused') return;
    mode = 'play'; modeT = 0;
    resetInput();
    sfx('pause');
  }

  function enterOver() {
    mode = 'over'; modeT = 0;
    resetInput();
    stopMusic();
    newRecord = game.score > hiAtStart;
    saveHi();
    popup = null; lvPop = null;
    sfx('over');
  }

  function changeLevel(d) {
    const v = Math.max(1, Math.min(MAX_START, startLevel + d));
    if (v === startLevel) return;
    startLevel = v;
    write('tetris.start', startLevel);
    sfx('select');
  }

  function toggleMusic() {
    musicOn = !musicOn;
    write('tetris.music', musicOn);
    Core.toast(musicOn ? 'MUSIK AN' : 'MUSIK AUS');
    if (!musicOn) stopMusic();
  }

  // ------------------------------------------------------------
  //  Tastatur
  // ------------------------------------------------------------
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowDown: 'soft', KeyS: 'soft', Space: 'hard',
    ArrowUp: 'cw', KeyW: 'cw', KeyX: 'cw',
    KeyZ: 'ccw', KeyY: 'ccw', ControlLeft: 'ccw',   // QWERTZ: Z und Y sind vertauscht, beide drehen zurück
    KeyC: 'hold', ShiftLeft: 'hold', ShiftRight: 'hold',
    KeyP: 'pause', Escape: 'pause', KeyB: 'music',
    Enter: 'enter', NumpadEnter: 'enter'
  };
  const ACTION_OF = { hard: 'HARD', cw: 'CW', ccw: 'CCW', hold: 'HOLD' };

  // gehaltene Taste für eine Richtung ('' = keine)
  function dirKey(d) {
    for (const k of keys) {
      const a = KEYMAP[k];
      if ((a === 'left' && d < 0) || (a === 'right' && d > 0)) return k;
    }
    return '';
  }
  const dirHeld = d => dirKey(d) !== '';

  function softHeld() {
    for (const k of keys) if (KEYMAP[k] === 'soft') return true;
    return false;
  }

  // zuletzt gedrückte Richtung gewinnt; beim Loslassen übernimmt die andere sofort (mit neuem DAS)
  function releaseDir(d) {
    if (dasDir !== d || dirHeld(d)) return;
    const other = dirKey(-d);
    if (other) {
      dasDir = -d; dasT = -1; arrT = 0;
      queue(d < 0 ? 'R' : 'L', other);
    } else dasDir = 0;
  }

  function onKeyDown(e) {
    const code = e ? e.code : '';
    const a = KEYMAP[code];
    if (!a || e.metaKey || e.altKey) return false;
    if (e.repeat) return true;   // eigene DAS/ARR statt Auto-Repeat des Systems
    if (a === 'music') { toggleMusic(); return true; }
    const confirm = a === 'enter' || code === 'Space';
    switch (mode) {
      case 'title':
        if (a === 'left' || a === 'right') changeLevel(a === 'left' ? -1 : 1);
        else if (confirm) startGame();
        else if (code === 'Escape') Core.exitToMenu();
        return true;
      case 'play':
        if (a === 'pause') { pause(); return true; }
        if (a === 'enter') return false;
        keys.add(code);
        if (a === 'left' || a === 'right') {
          const d = a === 'left' ? -1 : 1;
          dasDir = d; dasT = -1; arrT = 0;
          queue(d < 0 ? 'L' : 'R', code);
        } else if (ACTION_OF[a]) queue(ACTION_OF[a], code);
        return true;
      case 'paused':
        if (code === 'Escape') Core.exitToMenu();
        else if (code === 'KeyP' || confirm) resume();
        return true;
      case 'over':
        if (confirm) { if (modeT >= OVER_MIN) toTitle(); }
        else if (code === 'Escape') Core.exitToMenu();
        return true;
    }
    return false;
  }

  function onKeyUp(e) {
    const code = e ? e.code : '';
    const a = KEYMAP[code];
    if (!a) return false;
    if (keys.delete(code) && (a === 'left' || a === 'right')) releaseDir(a === 'left' ? -1 : 1);
    return true;
  }

  function onBlur() {
    if (mode === 'play') pause();
    resetInput();
  }

  // ------------------------------------------------------------
  //  Spielablauf pro Tick
  // ------------------------------------------------------------
  function applyAction(G, act) {
    const a = act.a;
    if (!G.cur || G.phase !== 'fall') {
      // kein aktiver Stein (READY, ARE, Reihen-Animation): Drehen/Halten/ersten Schritt vormerken
      if (G.phase === 'over') return;
      const b = { src: act.src, t: act.t, ready: G.phase === 'ready', d: 0 };
      if (a === 'CW' || a === 'CCW') { b.d = a === 'CW' ? 1 : -1; irs = b; }
      else if (a === 'HOLD') ihs = b;
      else if ((a === 'L' || a === 'R') && act.src) { b.d = a === 'L' ? -1 : 1; ims = b; }
      return;
    }
    switch (a) {
      case 'L': tryMove(G, -1); break;
      case 'R': tryMove(G, 1); break;
      case 'CW': tryRotate(G, 1); break;
      case 'CCW': tryRotate(G, -1); break;
      case 'HOLD': holdPiece(G); break;
      case 'HARD': hardDrop(G); break;
      case 'D': softStep(G); break;
    }
  }

  // Vorgemerktes gilt, wenn es kurz vor dem Erscheinen kam, noch gehalten wird oder während READY kam
  function bufferedOk(b) {
    return !!b && (b.ready || clock - b.t <= BUF_T || (b.src !== '' && keys.has(b.src)));
  }

  // IHS / IRS / erster Schritt für den gerade erschienenen Stein
  // (Richtung noch gehalten: Schritt, falls DAS nicht ohnehin schon schiebt; kurz vorher getippt: ein Schritt)
  function applyBuffered(G) {
    const h = ihs, r = irs, m = ims;
    irs = null; ihs = null; ims = null;
    if (bufferedOk(h)) holdPiece(G);
    if (bufferedOk(r)) tryRotate(G, r.d);
    if (m && (keys.has(m.src) ? dasDir === m.d && dasT < DAS : clock - m.t <= BUF_T)) tryMove(G, m.d);
  }

  function dasStep(G) {
    if (!dasDir) return;
    if (dasT < DAS) {
      if (++dasT >= DAS) { arrT = 0; tryMove(G, dasDir); }
    } else if (++arrT >= ARR) {
      arrT = 0;
      tryMove(G, dasDir);
    }
  }

  function updatePlay(G) {
    if (advance(G)) applyBuffered(G);
    for (let i = 0; i < actions.length; i++) applyAction(G, actions[i]);
    actions.length = 0;
    dasStep(G);
    fall(G, softHeld());
    if (G.score > hi) hi = G.score;
    handleEvents(G);
    if (popup && --popup.t <= 0) popup = null;
    if (lvPop && --lvPop.t <= 0) lvPop = null;
    tickFx();
  }

  function tickFx() {
    let j = 0;
    for (const f of fx) {
      if (f.k === 'spark') { f.x += f.vx; f.y += f.vy; f.vy += 0.012; }
      if (--f.life > 0) fx[j++] = f;
    }
    fx.length = j;
  }

  // Funken aus den abgeräumten Reihen (bleiben im Schacht, siehe Clip in drawGame)
  function sparks(G, rows) {
    for (const y of rows) {
      if (y < HID) continue;
      for (let x = 0; x < W; x++) {
        const k = G.board[y * W + x];
        const life = 22 + Math.floor(Math.random() * 16);
        fx.push({
          k: 'spark', col: k ? PAL[k - 1].light : '#ffffff', life, max: life,
          x: WX + (x + 0.5) * CS, y: WY + (y - HID + 0.5) * CS,
          vx: (x - 4.5) * 0.03 + (Math.random() - 0.5) * 0.1, vy: -0.08 - Math.random() * 0.16
        });
      }
    }
    if (fx.length > 240) fx.splice(0, fx.length - 240);
  }

  function showClear(ev) {
    const lines = [];
    if (ev.spin) {
      lines.push([ev.spin === 'mini' ? 'T-SPIN MINI' : 'T-SPIN', COL.purple, 1.1]);
      if (ev.lines) lines.push([CLEAR_NAMES[ev.lines], COL.white, 1]);
    } else {
      lines.push([CLEAR_NAMES[ev.lines], ev.lines === 4 ? COL.cyan : COL.white, ev.lines === 4 ? 1.4 : 1.1]);
    }
    if (ev.b2b) lines.push(['BACK-TO-BACK', COL.yellow, 0.9]);
    if (ev.combo > 0) lines.push(['COMBO ' + ev.combo, COL.orange, 0.9]);
    if (ev.perfect) lines.push(['PERFECT CLEAR!', COL.label, 0.9]);
    if (ev.pts > 0) lines.push([PLUS + ev.pts, COL.green, 1]);
    popup = { lines, t: 80 };
    if (ev.spin) sfx('tspin');
    if (ev.lines === 4) sfx('tetris');
    else if (ev.lines) sfx('clear', ev.lines);
    if (ev.perfect) sfx('perfect');
  }

  function handleEvents(G) {
    for (const ev of G.events) {
      switch (ev.type) {
        case 'move': sfx('move'); break;
        case 'rotate': sfx('rotate'); break;
        case 'hold': sfx('hold'); break;
        case 'hard': {
          sfx('drop');
          if (ev.rows > 0) {
            const top = {};
            for (const [cx, cy] of SHAPES[ev.t][ev.r]) {
              const x = ev.x + cx, y = ev.y + cy;
              if (top[x] === undefined || y < top[x]) top[x] = y;
            }
            fx.push({ k: 'trail', t: ev.t, rows: ev.rows, top, life: 9 });
          }
          break;
        }
        case 'lock':
          if (!ev.hard) sfx('lock');
          fx.push({ k: 'flash', cells: ev.cells, life: 7 });
          break;
        case 'clear':
          showClear(ev);
          if (ev.lines) sparks(G, ev.rows);
          break;
        case 'level':
          lvPop = { level: ev.level, t: LV_T };
          sfx('level');
          break;
        case 'spawn':
          if (ev.first) popup = { lines: [['GO!', COL.yellow, 2]], t: 40 };
          break;
        case 'over': enterOver(); break;
      }
    }
    G.events.length = 0;
  }

  // Titel: langsam fallende Steine im Hintergrund
  function newBgPiece(y) {
    return {
      t: Math.floor(Math.random() * 7) % 7, r: Math.floor(Math.random() * 4) % 4,
      x: 0.5 + Math.random() * 23.5, y, v: 0.025 + Math.random() * 0.045
    };
  }
  function initBg() {
    bgPieces = [];
    for (let i = 0; i < 9; i++) bgPieces.push(newBgPiece(-4 + Math.random() * 40));
  }
  function updateTitle() {
    for (let i = 0; i < bgPieces.length; i++) {
      const p = bgPieces[i];
      p.y += p.v;
      if (p.y > 37) bgPieces[i] = newBgPiece(-4.5);
    }
  }

  function update() {
    clock++;
    modeT++;
    if (mode === 'title') updateTitle();
    else if (mode === 'play' && game) updatePlay(game);
    else if (mode === 'over') {
      tickFx();
      if (modeT >= OVER_AUTO) toTitle();
    }
    try {
      musicTick(mode === 'play' && musicOn && !!game && game.phase !== 'over');
    } catch (e) { /* Ton darf das Spiel nie anhalten */ }
  }

  // ------------------------------------------------------------
  //  Sound: eigene Busse (Musik / Effekte) an Core.audio.master
  // ------------------------------------------------------------
  const EIGHTH = 60 / 144 / 2;     // 144 BPM, Achtel in Sekunden
  const LOOKAHEAD = 0.25, MUS_VOL = 0.9;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // Korobeiniki (russisches Volkslied, gemeinfrei), eigene Umsetzung. Paare: MIDI-Note, Länge in Achteln (0 = Pause)
  const MEL_A = [
    76, 2, 71, 1, 72, 1, 74, 2, 72, 1, 71, 1,
    69, 2, 69, 1, 72, 1, 76, 2, 74, 1, 72, 1,
    71, 3, 72, 1, 74, 2, 76, 2,
    72, 2, 69, 2, 69, 2, 0, 2,
    0, 1, 74, 2, 77, 1, 81, 2, 79, 1, 77, 1,
    76, 3, 72, 1, 76, 2, 74, 1, 72, 1,
    71, 2, 71, 1, 72, 1, 74, 2, 76, 2,
    72, 2, 69, 2, 69, 2, 0, 2
  ];
  const MEL_B = [
    76, 4, 72, 4, 74, 4, 71, 4, 72, 4, 69, 4, 68, 4, 71, 2, 0, 2,
    76, 4, 72, 4, 74, 4, 71, 4, 72, 2, 76, 2, 81, 4, 80, 8
  ];
  // Grundton des Basses je Takt (Achtel im Oktavwechsel)
  const BASS_A = [40, 45, 44, 45, 38, 48, 40, 45];
  const BASS_B = [45, 44, 45, 40, 45, 44, 45, 40];

  const SONG = (() => {
    const ev = [];
    let at = 0;
    for (const part of [MEL_A, MEL_A, MEL_B]) {
      for (let i = 0; i < part.length; i += 2) {
        if (part[i]) ev.push({ at, len: part[i + 1], m: part[i], v: 0 });
        at += part[i + 1];
      }
    }
    [...BASS_A, ...BASS_A, ...BASS_B].forEach((root, bar) => {
      for (let k = 0; k < 8; k++) ev.push({ at: bar * 8 + k, len: 1, m: root + (k % 2 ? 12 : 0), v: 1 });
    });
    ev.sort((a, b) => a.at - b.at || a.v - b.v);
    return { ev, len: at };
  })();

  let busCtx = null, musicBus = null, sfxBus = null, sfxMuted = false;
  let musicNodes = [], sfxNodes = [];
  let musPlaying = false, musIdx = 0, musT0 = 0;

  // Busse anlegen, sobald es einen AudioContext gibt (auch erst später im Spiel)
  function audioReady() {
    const ac = Core.audio.ctx, master = Core.audio.master;
    if (!ac || !master) return null;
    if (busCtx !== ac) {
      busCtx = ac;
      musicBus = ac.createGain();
      musicBus.gain.value = 0;
      musicBus.connect(master);
      sfxBus = ac.createGain();
      sfxBus.gain.value = 1;
      sfxBus.connect(master);
      musicNodes = []; sfxNodes = [];
      musPlaying = false; sfxMuted = false;
    }
    return ac;
  }

  function prune(list, now) {
    let j = 0;
    for (const n of list) if (n.end > now) list[j++] = n;
    list.length = j;
  }

  function voiceAt(list, bus, type, f0, f1, dur, vol, t, idx) {
    const ac = busCtx;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.setValueAtTime(vol, t + Math.max(0.007, dur * 0.75));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(bus);
    o.start(t);
    o.stop(t + dur + 0.02);
    list.push({ o, g, start: t, end: t + dur + 0.02, idx });
  }

  // Bus sofort stumm schalten und alle noch laufenden/geplanten Oszillatoren stoppen
  function fadeOut(bus, list) {
    const ac = busCtx;
    if (!ac || !bus) return;
    const now = ac.currentTime;
    try {
      bus.gain.cancelScheduledValues(now);
      bus.gain.setValueAtTime(bus.gain.value, now);
      bus.gain.linearRampToValueAtTime(0, now + 0.03);
    } catch (e) { /* egal */ }
    for (const n of list) {
      if (n.end > now) {
        try { n.o.stop(now + 0.04); } catch (e) { /* egal */ }
      }
    }
    list.length = 0;
  }

  function stopMusic() {
    if (!musPlaying) return;
    musPlaying = false;
    if (!busCtx) return;
    // Position merken: frühester noch nicht begonnener Ton
    const now = busCtx.currentTime;
    let first = null;
    for (const n of musicNodes) {
      if (n.start > now && (!first || n.start < first.start)) first = n;
    }
    if (first) musIdx = first.idx;
    fadeOut(musicBus, musicNodes);
  }

  function playNote(ev, t, idx) {
    const f = mtof(ev.m);
    if (ev.v) voiceAt(musicNodes, musicBus, 'triangle', f, f, EIGHTH * 0.8, 0.2, t, idx);
    else voiceAt(musicNodes, musicBus, 'square', f, f, ev.len * EIGHTH * 0.88, 0.05, t, idx);
  }

  // Lookahead-Planer: plant alle Töne der nächsten 0,25 s
  function musicTick(want) {
    if (!want) { stopMusic(); return; }
    const ac = audioReady();
    if (!ac) return;
    const now = ac.currentTime;
    if (!(now >= 0) || !Number.isFinite(now)) return;
    const evs = SONG.ev;
    if (musIdx < 0 || musIdx >= evs.length) musIdx = 0;
    if (!musPlaying) {
      musPlaying = true;
      const g = musicBus.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(0, now);
      g.linearRampToValueAtTime(MUS_VOL, now + 0.05);
      musT0 = now + 0.05 - evs[musIdx].at * EIGHTH;
    } else if (musT0 + evs[musIdx].at * EIGHTH < now - 0.1) {
      musT0 = now + 0.05 - evs[musIdx].at * EIGHTH;   // weit hinterher (Tab war gedrosselt): neu ansetzen
    }
    for (let n = 0; n < 48; n++) {
      const ev = evs[musIdx], t = musT0 + ev.at * EIGHTH;
      if (t > now + LOOKAHEAD) break;
      playNote(ev, Math.max(t, now), musIdx);
      if (++musIdx >= evs.length) {
        musIdx = 0;
        musT0 += SONG.len * EIGHTH;   // nahtlose Schleife
      }
    }
    prune(musicNodes, now);
  }

  function tone(type, f0, f1, dur, vol, delay = 0) {
    voiceAt(sfxNodes, sfxBus, type, f0, f1, dur, vol, busCtx.currentTime + delay, -1);
  }

  function arp(type, notes, step, dur, vol, delay = 0) {
    notes.forEach((m, i) => tone(type, mtof(m), mtof(m), dur, vol, delay + i * step));
  }

  function sfx(name, arg) {
    try {
      const ac = audioReady();
      if (!ac) return;
      const now = ac.currentTime;
      if (sfxMuted) {
        sfxBus.gain.cancelScheduledValues(now);
        sfxBus.gain.setValueAtTime(1, now);
        sfxMuted = false;
      }
      if (sfxNodes.length > 40) prune(sfxNodes, now);
      switch (name) {
        case 'move': tone('triangle', 900, 760, 0.03, 0.1); break;
        case 'rotate': tone('triangle', 520, 820, 0.05, 0.16); break;
        case 'hold':
          tone('triangle', 440, 440, 0.05, 0.18);
          tone('triangle', 660, 660, 0.06, 0.18, 0.05);
          break;
        case 'drop':
          tone('triangle', 260, 60, 0.12, 0.33);
          tone('square', 120, 50, 0.07, 0.035);
          break;
        case 'lock': tone('triangle', 190, 120, 0.06, 0.24); break;
        case 'clear': {
          const n = Math.max(1, Math.min(3, arg | 0));
          arp('square', [72, 76, 79].slice(0, n), 0.06, 0.08, 0.05);
          tone('triangle', mtof(48 + n * 2), mtof(60 + n * 2), 0.18, 0.25);
          break;
        }
        case 'tetris':
          arp('square', [72, 76, 79, 84], 0.07, 0.09, 0.055);
          tone('square', mtof(88), mtof(88), 0.32, 0.05, 0.28);
          tone('square', mtof(84), mtof(84), 0.32, 0.04, 0.28);
          tone('triangle', mtof(48), mtof(48), 0.6, 0.3);
          break;
        case 'tspin':
          tone('square', 330, 990, 0.14, 0.045);
          tone('triangle', 660, 1320, 0.16, 0.22, 0.02);
          break;
        case 'perfect': arp('triangle', [84, 88, 91, 96], 0.07, 0.18, 0.18, 0.45); break;
        case 'level': arp('square', [67, 71, 74, 79, 83], 0.06, 0.08, 0.05); break;
        case 'over':
          arp('triangle', [76, 74, 72, 71, 69, 67, 65, 64], 0.11, 0.1, 0.3);
          tone('triangle', mtof(40), mtof(28), 0.5, 0.33, 0.9);
          break;
        case 'start': arp('square', [60, 64, 67, 72], 0.06, 0.07, 0.045); break;
        case 'select': tone('square', 880, 880, 0.04, 0.035); break;
        case 'pause': tone('triangle', 660, 440, 0.08, 0.2); break;
      }
    } catch (e) { /* Ton darf das Spiel nie anhalten */ }
  }

  // ------------------------------------------------------------
  //  Zeichnen
  // ------------------------------------------------------------
  const COL = {
    blue: '#2121ff', white: '#ffffff', yellow: '#ffff00', cyan: '#00ffff', red: '#ff0000',
    orange: '#ffb852', purple: '#d070ff', label: '#ffb8ff', green: '#5cff7a', dim: '#a0a0c8'
  };
  // I O T S Z J L, dazu Grau für das Game Over
  const PIECE_COL = ['#00e8f8', '#f8e000', '#b040ff', '#30e030', '#f83030', '#3060ff', '#ff9a10', '#8c8c8c'];
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
      .map(v => Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f)));
    return 'rgb(' + ch.join(',') + ')';
  }
  const PAL = PIECE_COL.map(b => ({ base: b, light: shade(b, 0.55), dark: shade(b, -0.45), shine: shade(b, 0.85) }));
  // Begrenzungsrahmen der Grundstellung (für Vorschau-Kästen)
  const BBOX = SHAPES.map(s => {
    const xs = s[0].map(p => p[0]), ys = s[0].map(p => p[1]);
    return { x0: Math.min(...xs), x1: Math.max(...xs) + 1, y0: Math.min(...ys), y1: Math.max(...ys) + 1 };
  });

  // zusätzliche Zeichen der Pixel-Schrift (Plus, Pfeile)
  const GLYPHS = {
    '+': '.....|..#..|..#..|#####|..#..|..#..|.....',
    '←': '.....|..#..|.#...|#####|.#...|..#..|.....',
    '→': '.....|..#..|...#.|#####|...#.|..#..|.....',
    '↑': '..#..|.###.|#.#.#|..#..|..#..|..#..|..#..',
    '↓': '..#..|..#..|..#..|..#..|#.#.#|.###.|..#..'
  };
  const GLYPHS_OK = (() => {
    try {
      if (typeof Core.defineGlyph !== 'function') return false;
      for (const ch in GLYPHS) Core.defineGlyph(ch, GLYPHS[ch]);
      return true;
    } catch (e) { return false; }
  })();
  const PLUS = GLYPHS_OK ? '+' : '';
  const ARW = GLYPHS_OK ? { l: '←', r: '→', u: '↑', d: '↓' } : { l: 'LI', r: 'RE', u: 'HOCH', d: 'RUNTER' };

  // Layout (Einheiten): Schacht links, Seitenleiste rechts
  const CS = 1.5, WX = 1.25, WY = 4.25, WW = W * CS, WH = VIS * CS, WCX = WX + WW / 2;
  const PX = 17.6, PW = 9.8, PCX = PX + PW / 2;
  const WELL_FRAME = { x: WX - 0.55, y: WY - 0.55, w: WW + 1.1, h: WH + 1.1 };
  const BOX_HOLD = { x: PX, y: 3.7, w: PW, h: 5.9 };
  const BOX_NEXT = { x: PX, y: 10.1, w: PW, h: 14.5 };
  const BOX_STAT = { x: PX, y: 25.2, w: PW, h: 9.6 };
  const BTN_PAUSE = { x: 24.6, y: 0.5, w: 2.8, h: 2.6 };
  const HUD_H = 3.6;
  // Pausenmenü im Schacht
  const BTN_RESUME = { x: WX + 1.5, y: WY + 9, w: WW - 3, h: 3 };
  const BTN_MENU = { x: WX + 1.5, y: WY + 13.5, w: WW - 3, h: 3 };
  const BTN_PMUSIC = { x: WX + 1.5, y: WY + 18, w: WW - 3, h: 3 };
  // Titel
  const SEL_DEC = { x: 3.5, y: 9.6, w: 8.6, h: 2.8 };
  const SEL_INC = { x: 15.9, y: 9.6, w: 8.6, h: 2.8 };
  const BTN_TMENU = { x: 0.8, y: 33.2, w: 10, h: 2.3 };
  const BTN_MUSIC = { x: 16.4, y: 33.0, w: 11.2, h: 2.7 };
  const LV_T = 100;

  const LOGO = {
    T: ['###', '.#.', '.#.', '.#.', '.#.'],
    E: ['###', '#..', '##.', '#..', '###'],
    R: ['##.', '#.#', '##.', '#.#', '#.#'],
    I: ['###', '.#.', '.#.', '.#.', '###'],
    S: ['.##', '#..', '.#.', '..#', '##.']
  };
  const LOGO_COLS = [4, 6, 1, 3, 0, 2];
  const HELP_KEYS = [
    [ARW.l + ' ' + ARW.r + ' / A D', 'BEWEGEN'],
    [ARW.d + ' / S', 'SOFT DROP'],
    ['LEERTASTE', 'HARD DROP'],
    [ARW.u + ' / W / X', 'DREHEN'],
    ['Z / Y / STRG', 'LINKS DREHEN'],
    ['C / SHIFT', 'HALTEN'],
    ['P / ESC', 'PAUSE'],
    ['B', 'MUSIK AN/AUS']
  ];
  const HELP_TOUCH = [
    ['TIPPEN', 'DREHEN'],
    ['2. FINGER TIPPT', 'LINKS DREHEN'],
    ['ZIEHEN ' + ARW.l + ' ' + ARW.r, 'BEWEGEN'],
    ['LANGSAM ' + ARW.d, 'SOFT DROP'],
    ['WISCHEN ' + ARW.d, 'HARD DROP'],
    ['HALTEN-BOX', 'HALTEN'],
    ['II OBEN RECHTS', 'PAUSE']
  ];

  let c = null;   // Zeichenkontext während draw()
  const txt = (s, x, y, col, size = 1, align = 'left') => Core.drawText(s, x, y, col, size, align);

  // Stein mit Fase: hell oben/links, dunkel unten/rechts, kleiner Glanzpunkt (nur Rechtecke)
  function drawBlock(x, y, s, k) {
    const p = PAL[k], b = s * 0.15;
    c.fillStyle = p.light;
    c.fillRect(x, y, s, s);
    c.fillStyle = p.dark;
    c.fillRect(x + b, y + b, s - b, s - b);
    c.fillStyle = p.base;
    c.fillRect(x + b, y + b, s - 2 * b, s - 2 * b);
    c.fillStyle = p.shine;
    c.fillRect(x + b * 1.4, y + b * 1.4, b * 1.2, b * 1.2);
  }

  function roundRect(x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // Arcade-Rahmen: blaue Doppellinie mit runden Ecken
  function frame(b, fill, color = COL.blue) {
    if (fill) {
      c.fillStyle = fill;
      roundRect(b.x, b.y, b.w, b.h, 0.6);
      c.fill();
    }
    c.strokeStyle = color;
    c.lineWidth = 0.14;
    c.lineJoin = 'round';
    roundRect(b.x, b.y, b.w, b.h, 0.6);
    c.stroke();
    roundRect(b.x + 0.35, b.y + 0.35, b.w - 0.7, b.h - 0.7, 0.3);
    c.stroke();
  }

  function button(b, label, size, color = COL.white) {
    c.fillStyle = '#000000';
    roundRect(b.x, b.y, b.w, b.h, 0.5);
    c.fill();
    c.strokeStyle = COL.blue;
    c.lineWidth = 0.14;
    c.stroke();
    txt(label, b.x + b.w / 2, b.y + (b.h - 0.875 * size) / 2, color, size, 'center');
  }

  function drawMini(t, cx, cy, s, gray) {
    const bb = BBOX[t];
    const ox = cx - (bb.x0 + bb.x1) / 2 * s, oy = cy - (bb.y0 + bb.y1) / 2 * s;
    for (const [x, y] of SHAPES[t][0]) drawBlock(ox + x * s, oy + y * s, s, gray ? GRAY : t);
  }

  function drawHud() {
    const word = 'TETRIS';
    for (let i = 0; i < word.length; i++) txt(word[i], 1.0 + i * 1.4, 0.95, PIECE_COL[LOGO_COLS[i]], 1.4);
    if (mode !== 'play' && mode !== 'paused') return;
    // Pause-Knopf oben rechts; in der Pause ein Weiter-Dreieck
    const b = BTN_PAUSE;
    c.strokeStyle = COL.blue;
    c.lineWidth = 0.14;
    roundRect(b.x, b.y, b.w, b.h, 0.5);
    c.stroke();
    if (mode === 'paused') {
      c.fillStyle = COL.yellow;
      c.beginPath();
      c.moveTo(b.x + 0.95, b.y + 0.62);
      c.lineTo(b.x + b.w - 0.8, b.y + b.h / 2);
      c.lineTo(b.x + 0.95, b.y + b.h - 0.62);
      c.closePath();
      c.fill();
    } else {
      c.fillStyle = COL.white;
      c.fillRect(b.x + 0.8, b.y + 0.62, 0.4, b.h - 1.24);
      c.fillRect(b.x + b.w - 1.2, b.y + 0.62, 0.4, b.h - 1.24);
    }
  }

  function drawGrid() {
    c.strokeStyle = 'rgba(70,70,255,0.18)';
    c.lineWidth = 0.08;
    c.beginPath();
    for (let i = 1; i < W; i++) { c.moveTo(WX + i * CS, WY); c.lineTo(WX + i * CS, WY + WH); }
    for (let j = 1; j < VIS; j++) { c.moveTo(WX, WY + j * CS); c.lineTo(WX + WW, WY + j * CS); }
    c.stroke();
  }

  // Reihen-Animation (e = 0..19): Blitzen, Wischen von der Mitte nach außen, Nachrutschen der Reihen darüber
  function drawBoard(G) {
    const clr = G.phase === 'clear' ? G.clearRows : null;
    const e = CLEAR_T - G.timer;
    const half = clr && e >= 6 ? Math.min(5, Math.ceil((e - 5) * 5 / 9)) : 0;
    const drop = clr && e >= 15 ? Math.pow((e - 14) / 5, 2) : 0;
    for (let y = drop > 0 ? HID - clr.length : HID; y < H; y++) {
      const isClr = clr !== null && clr.indexOf(y) >= 0;
      let sy = WY + (y - HID) * CS;
      if (drop > 0 && !isClr) {
        let below = 0;
        for (const r of clr) if (r > y) below++;
        sy += below * CS * drop;
      }
      if (sy + CS <= WY) continue;
      for (let x = 0; x < W; x++) {
        const k = G.board[y * W + x];
        if (!k) continue;
        if (isClr && x >= 5 - half && x < 5 + half) continue;
        drawBlock(WX + x * CS, sy, CS, k - 1);
      }
      if (isClr && e < 6 && (e >> 1) % 2 === 0) {
        c.fillStyle = 'rgba(255,255,255,0.85)';
        c.fillRect(WX, sy, WW, CS);
      }
    }
  }

  function drawGhost(G) {
    const p = G.cur, gy = ghostY(G);
    if (gy === p.y) return;
    c.strokeStyle = PIECE_COL[p.t];
    c.fillStyle = PIECE_COL[p.t];
    c.lineWidth = 0.12;
    for (const [cx, cy] of SHAPES[p.t][p.r]) {
      if (gy + cy < HID) continue;
      const sx = WX + (p.x + cx) * CS, sy = WY + (gy + cy - HID) * CS;
      c.globalAlpha = 0.12;
      c.fillRect(sx + 0.1, sy + 0.1, CS - 0.2, CS - 0.2);
      c.globalAlpha = 0.65;
      c.strokeRect(sx + 0.16, sy + 0.16, CS - 0.32, CS - 0.32);
    }
    c.globalAlpha = 1;
  }

  // aktiver Stein; liegt er auf, dunkelt er mit ablaufender Lock-Verzögerung ab
  function drawPiece(G) {
    const p = G.cur;
    const dim = fits(G, p.t, p.r, p.x, p.y + 1) ? 0 : 0.45 * Math.min(1, G.lockT / LOCK_DELAY);
    for (const [cx, cy] of SHAPES[p.t][p.r]) {
      if (p.y + cy < HID) continue;
      const sx = WX + (p.x + cx) * CS, sy = WY + (p.y + cy - HID) * CS;
      drawBlock(sx, sy, CS, p.t);
      if (dim > 0) {
        c.globalAlpha = dim;
        c.fillStyle = '#000000';
        c.fillRect(sx, sy, CS, CS);
        c.globalAlpha = 1;
      }
    }
  }

  function drawFx() {
    for (const f of fx) {
      if (f.k === 'trail') {
        c.fillStyle = PIECE_COL[f.t];
        c.globalAlpha = 0.3 * f.life / 9;
        for (const xs in f.top) {
          const x = Number(xs), y = f.top[xs];
          c.fillRect(WX + x * CS + 0.2, WY + (y - f.rows - HID) * CS, CS - 0.4, f.rows * CS);
        }
      } else if (f.k === 'spark') {
        c.fillStyle = f.col;
        c.globalAlpha = f.life / f.max;
        c.fillRect(f.x - 0.15, f.y - 0.15, 0.3, 0.3);
      } else {
        c.fillStyle = '#ffffff';
        c.globalAlpha = 0.55 * f.life / 7;
        for (const [x, y] of f.cells) if (y >= HID) c.fillRect(WX + x * CS, WY + (y - HID) * CS, CS, CS);
      }
    }
    c.globalAlpha = 1;
  }

  function drawPopups(G) {
    if (G.phase === 'ready') {
      txt('READY', WCX, WY + 11.5, COL.yellow, 2, 'center');
      txt('LEVEL ' + Math.min(99, G.level), WCX, WY + 14.5, COL.white, 1, 'center');
    }
    if (popup) {
      const n = popup.lines.length;
      let h = 0.5, w = 0;
      for (const [s, , size] of popup.lines) { h += size * 1.25; w = Math.max(w, s.length * size); }
      const rise = Math.min(1, (80 - popup.t) / 80) * 0.8;
      let y = WY + 8 - rise;
      c.globalAlpha = Math.min(1, popup.t / 15);
      c.fillStyle = 'rgba(0,0,0,0.6)';
      c.fillRect(WCX - w / 2 - 0.4, y - 0.3, w + 0.8, h);
      for (let i = 0; i < n; i++) {
        const [s, col, size] = popup.lines[i];
        txt(s, WCX, y, col, size, 'center');
        y += size * 1.25;
      }
      c.globalAlpha = 1;
    }
    // Level-Aufstieg oben im Schacht, ohne abdunkelnden Kasten
    if (lvPop) {
      const t = lvPop.t;
      c.globalAlpha = Math.min(1, t / 20);
      if ((t >> 2) & 1 || t < LV_T - 40) txt('LEVEL UP!', WCX, WY + 2.4, COL.yellow, 1.1, 'center');
      txt('LEVEL ' + Math.min(99, lvPop.level), WCX, WY + 3.8, COL.white, 1.2, 'center');
      c.globalAlpha = 1;
    }
  }

  function drawSide(G, hide) {
    frame(BOX_HOLD);
    txt('HALTEN', PCX, BOX_HOLD.y + 0.65, COL.label, 0.8, 'center');
    if (!hide && G.hold >= 0) drawMini(G.hold, PCX, 7.3, 1, G.holdUsed);
    frame(BOX_NEXT);
    txt('NÄCHSTE', PCX, BOX_NEXT.y + 0.65, COL.label, 0.8, 'center');
    if (!hide) {
      drawMini(G.queue[0], PCX, 13.1, 1, false);
      for (let i = 1; i < 5; i++) drawMini(G.queue[i], PCX, 13.85 + i * 2.15, 0.75, false);
    }
    frame(BOX_STAT);
    const lx = PX + 0.65, rx = PX + PW - 0.65;
    const rows = [
      ['PUNKTE', G.score], ['REKORD', Math.max(hi, G.score)],
      ['LEVEL', Math.min(99, G.level)], ['REIHEN', G.lines]
    ];
    rows.forEach(([label, v], i) => {
      const y = 25.8 + i * 2.25;
      txt(label, lx, y, COL.label, 0.8);
      txt(String(v), rx, y + 0.9, COL.white, 0.9, 'right');
    });
  }

  // Pausenmenü im Schacht (Feld verdeckt, kein Spicken)
  function drawPauseMenu() {
    txt('PAUSE', WCX, WY + 3.5, COL.yellow, 2.2, 'center');
    button(BTN_RESUME, 'WEITER', 1.2);
    button(BTN_MENU, 'MENÜ', 1.2);
    button(BTN_PMUSIC, musicOn ? 'MUSIK: AN' : 'MUSIK: AUS', 1, COL.cyan);
    txt('P / ENTER = WEITER', WCX, WY + 23.6, COL.white, 0.75, 'center');
    txt('ESC = MENÜ', WCX, WY + 24.8, COL.white, 0.75, 'center');
  }

  function drawOverFill() {
    const n = Math.min(VIS, Math.floor(modeT / 2));
    for (let v = VIS - n; v < VIS; v++) {
      for (let x = 0; x < W; x++) drawBlock(WX + x * CS, WY + v * CS, CS, GRAY);
    }
  }

  function drawOverPanel(G) {
    if (modeT < 40) return;
    frame({ x: WX + 0.3, y: 11.3, w: WW - 0.6, h: 12.9 }, 'rgba(0,0,0,0.85)');
    txt('GAME OVER', WCX, 12.4, COL.red, 1.4, 'center');
    txt('PUNKTE', WCX, 14.6, COL.label, 0.8, 'center');
    txt(String(G.score), WCX, 15.6, COL.white, 1.2, 'center');
    if (newRecord && Math.floor(modeT / 15) % 2 === 0) txt('NEUER REKORD!', WCX, 17.5, COL.yellow, 0.9, 'center');
    txt('LEVEL ' + Math.min(99, G.level), WCX, 19.1, COL.cyan, 0.8, 'center');
    txt('REIHEN ' + G.lines, WCX, 20.1, COL.cyan, 0.8, 'center');
    if (modeT >= OVER_MIN) txt('ENTER / TIPPEN', WCX, 22.0, COL.white, 0.8, 'center');
  }

  // Stapel in den obersten 4 sichtbaren Reihen?
  function danger(G) {
    for (let i = HID * W; i < (HID + 4) * W; i++) if (G.board[i]) return true;
    return false;
  }

  function wellColor(G) {
    if (mode !== 'play') return COL.blue;
    if (lvPop && lvPop.t > LV_T - 36 && (lvPop.t >> 2) & 1) return COL.white;   // Aufblitzen beim Level-Aufstieg
    if (danger(G) && (clock >> 3) & 1) return COL.red;                         // Warnung: Stapel fast oben
    return COL.blue;
  }

  function drawGame() {
    const G = game;
    if (!G) return;
    const hide = mode === 'paused';   // Pause: kein Blick aufs Feld
    drawHud();
    frame(WELL_FRAME, null, wellColor(G));
    if (hide) drawPauseMenu();
    else {
      drawGrid();
      c.save();
      c.beginPath();
      c.rect(WX, WY, WW, WH);
      c.clip();
      drawBoard(G);
      if (G.cur && G.phase === 'fall') {
        drawGhost(G);
        drawPiece(G);
      }
      drawFx();
      if (mode === 'over') drawOverFill();
      c.restore();
      if (mode !== 'over') drawPopups(G);
    }
    drawSide(G, hide);
    if (mode === 'over') drawOverPanel(G);
  }

  // Logo aus Steinen: fällt beim Öffnen herein, danach leichtes Wippen und ab und zu ein Glanzstreifen
  function drawLogo() {
    const word = 'TETRIS', t = modeT;
    const sh = (t - 90) % 300, shineX = sh >= 0 && sh < 50 ? 1 + sh / 50 * 27 : -99;
    for (let i = 0; i < word.length; i++) {
      const pat = LOGO[word[i]], bob = Math.sin((t + i * 9) / 16) * 0.15;
      for (let r = 0; r < 5; r++) {
        for (let q = 0; q < 3; q++) {
          if (pat[r][q] !== '#') continue;
          const d = i * 5 + (4 - r) * 2 + q;
          const p = (t - d) / 16;
          if (p <= 0) continue;
          const fallIn = p >= 1 ? 0 : (1 - p) * (1 - p) * 12;
          const x = 2.5 + i * 4 + q, y = 3 + r + bob - fallIn;
          if (y + 1 <= 0) continue;
          drawBlock(x, y, 1, LOGO_COLS[i]);
          const land = t - d - 16;
          let glow = land >= 0 && land < 6 ? (1 - land / 6) * 0.7 : 0;
          const dx = Math.abs(x + 0.5 - shineX);
          if (dx < 1.5) glow = Math.max(glow, (1 - dx / 1.5) * 0.6);
          if (glow > 0) {
            c.globalAlpha = glow;
            c.fillStyle = '#ffffff';
            c.fillRect(x, y, 1, 1);
            c.globalAlpha = 1;
          }
        }
      }
    }
  }

  function drawTitle() {
    c.save();
    c.globalAlpha = 0.2;
    for (const p of bgPieces) for (const [x, y] of SHAPES[p.t][p.r]) drawBlock(p.x + x, p.y + y, 1, p.t);
    c.restore();
    drawLogo();
    txt('START-LEVEL', 14, 9.0, COL.cyan, 0.9, 'center');
    txt('<', 8.25, 10.1, startLevel > 1 ? COL.yellow : '#555555', 1.8, 'center');
    txt(String(startLevel), 14, 10.1, COL.white, 1.8, 'center');
    txt('>', 19.75, 10.1, startLevel < MAX_START ? COL.yellow : '#555555', 1.8, 'center');
    txt('REKORD ' + hi, 14, 12.3, COL.white, 0.9, 'center');
    if (Math.floor(modeT / 30) % 2 === 0) {
      txt('ENTER ODER TIPPEN', 14, 13.7, COL.yellow, 1, 'center');
      txt('ZUM STARTEN', 14, 14.8, COL.yellow, 1, 'center');
    }
    // Steuerung in zwei Spalten
    frame({ x: 0.8, y: 16.0, w: 26.4, h: 16.8 }, 'rgba(0,0,0,0.75)');
    const table = (y0, list) => list.forEach(([k, d], i) => {
      txt(k, 1.8, y0 + i * 0.92, COL.white, 0.75);
      txt(d, 13.6, y0 + i * 0.92, COL.dim, 0.75);
    });
    txt('TASTATUR', 14, 16.55, COL.cyan, 0.8, 'center');
    table(17.55, HELP_KEYS);
    txt('TOUCH', 14, 25.0, COL.cyan, 0.8, 'center');
    table(26.0, HELP_TOUCH);
    button(BTN_TMENU, 'ESC = MENÜ', 0.8);
    txt('B = MUSIK ' + (musicOn ? 'AN' : 'AUS'), 27.2, 33.95, COL.white, 0.75, 'right');
  }

  function draw() {
    c = Core.ctx;
    if (!c) return;
    c.save();
    try {
      if (mode === 'title') drawTitle();
      else drawGame();
    } finally {
      c.restore();
    }
  }

  // ------------------------------------------------------------
  //  Zeiger (Maus / Touch / Stift)
  // ------------------------------------------------------------
  const TAP_TICKS = 18, FLICK_DIST = 3 * CS, FLICK_TICKS = 12, FLICK_V = 0.5, FLICK_SLOPE = 1.2;
  const REL_TICKS = 5, HIST_MAX = 48, STALE_TICKS = 600;
  const inRect = (b, x, y, pad = 0.3) => x >= b.x - pad && x <= b.x + b.w + pad && y >= b.y - pad && y <= b.y + b.h + pad;

  function tapTol() {
    let u = 0;
    try { u = Core.unitPx(); } catch (e) { u = 0; }
    return Number.isFinite(u) && u > 0 ? Math.min(1.2, Math.max(0.45, 12 / u)) : 0.7;
  }

  function stepCount(d) {
    const n = Math.trunc(d / CS);
    return Math.max(-H, Math.min(H, n));
  }

  // Bahn des Fingers merken; Ticks ohne Bewegung zählen als Stillstand
  function track(g, x, y) {
    const h = g.hist, last = h[h.length - 1];
    if (clock - last[0] > 1) h.push([clock - 1, last[1], last[2]]);
    h.push([clock, x, y]);
    while (h.length > 1 && (h[0][0] < clock - FLICK_TICKS || h.length > HIST_MAX)) h.shift();
  }

  // schnelles Wischen nach unten: genug Weg, steil genug (nicht seitwärts) und schnell genug
  function flicked(g, x, y, maxAge, minDy, minV) {
    for (const [t, hx, hy] of g.hist) {
      const dt = clock - t, dy = y - hy;
      if (dt <= maxAge && dy >= minDy && dy >= FLICK_SLOPE * Math.abs(x - hx) && dy >= minV * Math.max(1, dt)) return true;
    }
    return false;
  }

  function dragMove(g, x, y) {
    const ddx = x - g.x, ddy = y - g.y;
    // Richtungsfilter: Seitwärts-Drift beim Runterziehen (und umgekehrt) zählt nicht
    if (Math.abs(ddy) > 2 * Math.abs(ddx)) g.ax += ddx;
    else if (Math.abs(ddx) > 2 * Math.abs(ddy)) g.ay += ddy;
    const nx = stepCount(x - g.ax);
    if (nx) {
      for (let i = 0; i < Math.abs(nx); i++) queue(nx > 0 ? 'R' : 'L');
      g.ax += nx * CS;
      g.acted = true;
    }
    if (y < g.ay) g.ay = y;
    const ny = stepCount(y - g.ay);
    if (ny > 0) {
      for (let i = 0; i < ny; i++) queue('D');
      g.ay += ny * CS;
      g.acted = true;
    }
    track(g, x, y);
    if (flicked(g, x, y, FLICK_TICKS, FLICK_DIST, 0)) {
      queue('HARD');
      g.done = true;
      g.acted = true;
    }
  }

  function playPointerUp(g, x, y) {
    if (g.kind !== 'field' || g.done) return;
    if (!g.acted && g.maxD <= tapTol() && clock - g.t0 <= TAP_TICKS) {
      // Tipp dreht; liegt dabei ein zweiter Finger auf, dreht der Doppeltipp genau einmal zurück
      if (g.multi) return;
      let other = false;
      for (const o of pointers.values()) {
        if (o.kind === 'field' && o.mode === 'play') { other = true; o.multi = true; }
      }
      queue(other ? 'CCW' : 'CW');
      return;
    }
    track(g, x, y);
    if (flicked(g, x, y, REL_TICKS, CS, FLICK_V)) queue('HARD');
  }

  function uiTap(g) {
    const x = g.sx, y = g.sy;
    if (g.maxD > 2) return;
    if (mode === 'title') {
      if (inRect(BTN_TMENU, x, y)) Core.exitToMenu();
      else if (inRect(SEL_DEC, x, y, 0)) changeLevel(-1);
      else if (inRect(SEL_INC, x, y, 0)) changeLevel(1);
      else if (inRect(BTN_MUSIC, x, y, 0)) toggleMusic();
      else startGame();
    } else if (mode === 'paused') {
      if (y < HUD_H || inRect(BTN_PAUSE, x, y) || inRect(BTN_RESUME, x, y)) resume();
      else if (inRect(BTN_MENU, x, y)) Core.exitToMenu();
      else if (inRect(BTN_PMUSIC, x, y)) toggleMusic();
    } else if (mode === 'over') {
      if (modeT >= OVER_MIN) toTitle();
    }
  }

  function onPointer(type, x, y, id) {
    if (!Number.isFinite(x) || !Number.isFinite(y)) {
      if (type === 'up' || type === 'cancel') pointers.delete(id);
      return;
    }
    if (type === 'down') {
      // außerhalb der Spielfläche (Rand / virtuelles Gamepad) beginnt keine Geste
      if (x < 0 || x > 28 || y < 0 || y > 36) return;
      // Finger, deren 'up' verloren ging (lange kein Ereignis), vergessen
      for (const [k, o] of pointers) if (clock - o.last > STALE_TICKS) pointers.delete(k);
      if (pointers.size >= 8) pointers.clear();
      const g = {
        id, mode, kind: 'field', sx: x, sy: y, x, y, ax: x, ay: y, last: clock,
        t0: clock, maxD: 0, acted: false, done: false, multi: false, hist: [[clock, x, y]]
      };
      pointers.set(id, g);
      if (mode === 'play') {
        if (y < HUD_H || inRect(BTN_PAUSE, x, y)) { pause(); return; }
        if (inRect(BOX_HOLD, x, y, 0)) { g.kind = 'button'; queue('HOLD'); }
      }
      return;
    }
    const g = pointers.get(id);
    if (!g) return;   // schwebende Maus ohne 'down'
    if (type === 'cancel') { pointers.delete(id); return; }
    if (g.mode !== mode) {
      if (type === 'up') pointers.delete(id);
      return;
    }
    g.maxD = Math.max(g.maxD, Math.hypot(x - g.sx, y - g.sy));
    g.last = clock;
    if (type === 'move') {
      if (mode === 'play' && g.kind === 'field' && !g.done) dragMove(g, x, y);
      g.x = x; g.y = y;
    } else if (type === 'up') {
      pointers.delete(id);
      if (mode === 'play') playPointerUp(g, x, y);
      else uiTap(g);
    }
  }

  // ------------------------------------------------------------
  //  Lebenszyklus
  // ------------------------------------------------------------
  function enter() {
    loadPrefs();
    mode = 'title'; modeT = 0;
    game = null; popup = null; lvPop = null; fx.length = 0;
    resetInput();
    initBg();
  }

  function exit() {
    stopMusic();
    fadeOut(sfxBus, sfxNodes);
    if (sfxBus) sfxMuted = true;
    saveHi();
    resetInput();
    mode = 'title'; modeT = 0;
    game = null; popup = null; lvPop = null; fx.length = 0;
  }

  function hiScore() {
    return hi;
  }

  loadPrefs();

  return { id: 'tetris', title: 'TETRIS', phase: () => mode, enter, exit, update, draw,
           onKeyDown, onKeyUp, onPointer, onBlur, hiScore };
})();
/*TETRIS_MODULE_END*/

/*RACER_MODULE_START*/
// ============================================================
//  VOLLGAS (Autorennen)
// ============================================================
const Racer = (() => {
  // ----------------------------------------------------------
  //  Grundkonstanten (Welt in Welteinheiten, Bild 28 x 36 Einheiten)
  // ----------------------------------------------------------
  const SW = 28, DT = 1 / 60;
  const SEG = 200;               // Segmentlänge
  const ROAD_W = 2000;           // halbe Straßenbreite
  const LANES = 3, BAND = 3;     // Fahrspuren, Segmente pro Farbstreifen
  const CAM_H = 2880;            // Kamerahöhe über der Straße
  const PZ = 800;                // Abstand Kamera -> eigenes Auto
  const FOCAL = 5;               // Brennweite (Bildschirm-Einheiten)
  const DRAW = 150, SPR_DRAW = 150, SPR_FADE = 16, NEAR = 40;   // Sprites blenden im Dunst ein
  const PX = 27.5;               // Welteinheiten pro Sprite-Pixel
  const MAXV = 11000, KMH = 290; // Höchsttempo (Welteinheiten/s) = 290 km/h
  const ACCEL = 0.42, BRAKE = 0.7, DRAG = 0.22, OFF_DRAG = 0.85, OFF_MAX = 0.36;
  // Kurve 4 bei Vollgas gerade noch haltbar; schärfere Kurven tragen überproportional hinaus
  const STEER = 2.6, CENT = 0.6, CENT_X = 0.1, SLOPE = 0.3;
  const CRASH_V = 0.22, CRASH_T = 96, INVUL_T = 110;
  const CAR_LEN = 320, HIT_LEN = 170, P_HALF = 0.22;   // HIT_LEN: Sprites berühren sich sichtbar
  const SAFE = 1.35;             // Hindernisse beginnen erst außerhalb des Rüttelstreifens
  const SIG_T = 30;              // Blinken vor dem Spurwechsel (Ticks)
  const LAPS = 3, START_BACK = 6 * SEG, MAX_START = 9;
  const CARS = 3;   // Autos pro Spiel: nach dem dritten Unfall ist Schluss
  const FOG_N = 6;
  const LANE_X = [-0.64, 0, 0.64];
  const VIEW_RACE = { top: 4, bottom: 33, hy: 14.6, k: 1 };
  const VIEW_TITLE = { top: 6.9, bottom: 23.8, hy: 11.8, k: 0.62 };
  const COL = {
    white: '#ffffff', red: '#ff2020', yellow: '#ffff00', cyan: '#00ffff', blue: '#2121ff',
    pink: '#ffb8ff', orange: '#ffb852', green: '#20ff40', grey: '#9090b0'
  };

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeIn = (a, b, t) => a + (b - a) * t * t;
  const easeInOut = (a, b, t) => a + (b - a) * (0.5 - Math.cos(t * Math.PI) / 2);
  // Fliehkraft einer Kurve und das Tempo (Anteil von MAXV), bei dem volles Gegenlenken sie hält
  const cent = c => c * CENT * (1 + CENT_X * Math.max(0, Math.abs(c) - 4));
  const uHold = c => (Math.abs(c) < 0.01 ? 1 : Math.min(1, STEER / Math.abs(cent(c))));

  // kleiner deterministischer Zufallsgenerator (mulberry32)
  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const hex2 = v => (v < 16 ? '0' : '') + v.toString(16);
  function mix(c1, c2, t) {
    const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, t));
    return '#' + hex2(ch(16)) + hex2(ch(8)) + hex2(ch(0));
  }

  // ----------------------------------------------------------
  //  Pixel-Sprites: Zeichenraster -> vorberechnete Rechtecke je Farbe
  //  ('.' = durchsichtig). Dazu zwei gröbere Stufen für die Ferne.
  // ----------------------------------------------------------
  function runsOf(rows, pal) {
    const h = rows.length, w = rows[0].length;
    const byCol = new Map();
    let open = new Map();
    for (let y = 0; y < h; y++) {
      const row = rows[y], next = new Map();
      for (let x = 0; x < w;) {
        const ch = row[x];
        if (ch === '.') { x++; continue; }
        let e = x + 1;
        while (e < w && row[e] === ch) e++;
        const key = x + ',' + (e - x) + ',' + ch;
        let r = open.get(key);
        if (r) r[3]++;
        else {
          const c = pal[ch];
          if (!c) throw new Error('VOLLGAS: Farbe fehlt für ' + ch);
          r = [x, y, e - x, 1];
          if (!byCol.has(c)) byCol.set(c, []);
          byCol.get(c).push(r);
        }
        next.set(key, r);
        x = e;
      }
      open = next;
    }
    const groups = [];
    for (const [c, rs] of byCol) {
      const a = new Float32Array(rs.length * 4);
      rs.forEach((r, i) => a.set(r, i * 4));
      groups.push({ c, r: a });
    }
    return { w, h, groups };
  }

  // Verkleinern um Faktor f (Mehrheitsfarbe, ab 25 % Deckung sichtbar)
  function shrink(rows, f) {
    const h = rows.length, w = rows[0].length, out = [];
    for (let y = 0; y < Math.ceil(h / f); y++) {
      let line = '';
      for (let x = 0; x < Math.ceil(w / f); x++) {
        const cnt = {};
        let n = 0, best = '.', bn = 0;
        for (let dy = 0; dy < f; dy++) {
          const r = rows[y * f + dy];
          if (!r) continue;
          for (let dx = 0; dx < f; dx++) {
            const ch = r[x * f + dx];
            if (!ch || ch === '.') continue;
            n++;
            cnt[ch] = (cnt[ch] || 0) + 1;
            if (cnt[ch] > bn) { bn = cnt[ch]; best = ch; }
          }
        }
        line += n * 4 >= f * f ? best : '.';
      }
      out.push(line);
    }
    return out;
  }

  // opt.foot: Bodenkontakt als Pixel-Spalten [[von, bis), ...] – nur dort kracht es
  // opt.lod: > 1 = früher auf die gröberen Stufen wechseln (viele kleine Rechtecke)
  function mkSprite(rows, pal, opt = {}) {
    const w = rows[0].length;
    for (const r of rows) if (r.length !== w) throw new Error('VOLLGAS: Sprite-Zeilen ungleich lang: ' + r);
    const lods = [runsOf(rows, pal)];
    if (rows.length >= 8 && w >= 8) lods.push(runsOf(shrink(rows, 2), pal));
    if (rows.length >= 16 && w >= 16) lods.push(runsOf(shrink(rows, 4), pal));
    const foot = opt.foot || null;
    return {
      w, h: rows.length, s: opt.s || 1, foot, hit: !!foot, lod: opt.lod || 1,
      glow: opt.glow || null, gantry: !!opt.gantry, lods
    };
  }

  // belegte Spalten über alle Zeilen (für massive Hindernisse)
  function span(rows) {
    let a = rows[0].length, b = 0;
    for (const r of rows) for (let x = 0; x < r.length; x++) if (r[x] !== '.') { a = Math.min(a, x); b = Math.max(b, x + 1); }
    return [[a, b]];
  }

  const revStr = r => [...r].reverse().join('');
  const sym = half => half.map(r => r + revStr(r));
  function grid(w, h) {
    const g = [];
    for (let y = 0; y < h; y++) g.push(new Array(w).fill('.'));
    return g;
  }
  const put = (g, x, y, ch) => { if (y >= 0 && y < g.length && x >= 0 && x < g[0].length) g[y][x] = ch; };
  const flat = g => g.map(r => r.join(''));

  // --- Autos (Heckansicht, linke Hälften) ---
  const F1_HALF = [
    '..wwwwwwwwwwwwww',
    '..aaaaaaaaaaaaaa',
    '..AAAAAAAAAAAAAA',
    '.....kk.......hh',
    '.ttt.kk......hhh',
    'TTTTTk......hhHH',
    'ttttt.aaaaaaHHHH',
    'TTTTT.aaaaaaaaaa',
    'ttttt.awwaaaaaaa',
    'TTTTT.Aaaaaaaaaa',
    'ttttt.AAAaaaaaaa',
    'TTTTT..AAAAAAAAA',
    'ttttt..kkkkkkkkl',
    'TTTTT..ssssssskl',
    '.ttt....kkkkkkkk'
  ];
  const SEDAN_HALF = [
    '....aaaaaaaaaa',
    '...aAAAAAAAAAA',
    '...agggggggggg',
    '..agvvgggggggg',
    '..aggvvggggggg',
    '..aaaaaaaaaaaa',
    '.aaaaaaaaaaaaa',
    'allllaaaaaaaaa',
    'aLLLLaAAAAAAAA',
    'aaaaaaAAAAAyyy',
    'AAAAAAAAAAAyyy',
    'ssssssssssssss',
    '.kkkk.........',
    '.kkkk.........'
  ];
  const VAN_HALF = [
    '..aaaaaaaaaaa',
    '.aaaaaaaaaaaa',
    'aaaaaaaaaaaaA',
    'aaggggggggaaA',
    'aagvvgggggaaA',
    'aaggvvggggaaA',
    'aaggggggggaaA',
    'aaaaaaaaaaaaA',
    'aaaaaaaaaakaA',
    'aaaaaaaaaaaaA',
    'aaaaaaaaaaaaA',
    'llaaaaaaaaaaA',
    'LLaaaaaaaaaaA',
    'aaaaaaaaaaaaA',
    'AAAAAAAAAyyyy',
    'sssssssssssss',
    '.kkkk........',
    '.kkkk........'
  ];
  const F1 = sym(F1_HALF);
  const F1_PAL = (c, f) => ({
    w: '#ffffff', a: c[0], A: c[1], F: mix(c[1], '#000000', 0.4), h: c[2], H: mix(c[2], '#000000', 0.35),
    k: '#141414', s: '#a8a8b8', l: '#ff3030', t: f ? '#505058' : '#161616', T: f ? '#161616' : '#505058'
  });
  const BOX_PAL = c => ({
    a: c[0], A: c[1], g: '#1c2a44', v: '#8aa0c8', l: '#ff2828', L: '#a01010', y: '#f0f0d8',
    s: '#8c8c98', k: '#141414'
  });
  const PLAYER_COL = ['#e81818', '#8c0810', '#ffd800'];
  const BURNT_COL = ['#3c3430', '#1c1814', '#4c4440'];

  // Kurvenbild nach rechts (links = gespiegelt), Stufe lvl 1/2: der Aufbau kippt oben zur
  // Kurve (Drehpunkt Hinterachse), links wird die Flanke sichtbar, rechts lugt das Vorderrad
  // hervor; die Hinterräder bleiben stehen
  function turnF1(lvl) {
    const P = 4, W = F1[0].length, g = grid(W + 2 * P, F1.length);
    const tire = ch => ch === 't' || ch === 'T';
    const sh = y => Math.round(Math.max(0, 12 - y) / 12 * 2 * lvl);
    for (let y = 3; y < 6 + lvl; y++) for (let k = 0; k <= lvl; k++) put(g, P + W - 1 + lvl + k, y, (y + k) % 2 ? 'T' : 't');
    for (let y = 4; y < 12; y++) for (let k = 0; k <= sh(y); k++) put(g, P + 5 + k, y, 'F');
    F1.forEach((r, y) => { for (let x = 0; x < W; x++) if (r[x] !== '.' && !tire(r[x])) put(g, x + P + sh(y), y, r[x]); });
    F1.forEach((r, y) => { for (let x = 0; x < W; x++) if (tire(r[x])) put(g, x + P, y, r[x]); });
    return flat(g);
  }
  const TURN = [1, 2].map(turnF1);
  // Spieler: [Lenkung -2..2][Radphase], dazu ausgebranntes Wrack
  const P_CAR = [-2, -1, 0, 1, 2].map(d => [0, 1].map(f => {
    const rows = d ? TURN[Math.abs(d) - 1] : F1;
    return mkSprite(d < 0 ? rows.map(revStr) : rows, F1_PAL(PLAYER_COL, f));
  }));
  const P_MID = 2;
  const P_BURNT = mkSprite(F1, Object.assign(F1_PAL(BURNT_COL, 0), { w: '#606060', l: '#401010', s: '#404040' }));

  // Gegnerfahrzeuge (Typ = Form + Farbe, je zwei Radphasen); sig = Blinker
  // [Abstand von der Mitte, Zeile] in Sprite-Pixeln
  const TYPES = [];
  for (const c of [['#2058ff', '#10288c', '#ffffff'], ['#18c040', '#0a6020', '#ff8020'],
    ['#ffd000', '#a07800', '#2058ff'], ['#f0f0f0', '#9090a0', '#e81818'], ['#c040ff', '#601890', '#20ffd0']]) {
    TYPES.push({ fr: [0, 1].map(f => mkSprite(F1, F1_PAL(c, f))), half: 0.22, sig: [13, 1] });
  }
  for (const c of [['#2080ff', '#1048a0'], ['#ff7a20', '#a04008'], ['#20c0a0', '#0a6a58'], ['#e8e8e8', '#9a9aa8']]) {
    const s = mkSprite(sym(SEDAN_HALF), BOX_PAL(c));
    TYPES.push({ fr: [s, s], half: 0.19, sig: [12, 7] });
  }
  for (const c of [['#f4f4f4', '#a8a8b4'], ['#ffd020', '#b08a00']]) {
    const s = mkSprite(sym(VAN_HALF), BOX_PAL(c));
    TYPES.push({ fr: [s, s], half: 0.18, sig: [12, 11] });
  }

  // --- Landschaft ---
  const PALM_TOP = [
    '.......gg.....gg........',
    '.....ggggg...gggggg.....',
    '...gggGGGgg.ggGGGggggg..',
    '.ggGGG...ggggg....GGGgg.',
    'gGG.....gGGcGGg......GGg',
    'G......gG.cCc.Gg.......G',
    '......gG..CcC..Gg.......',
    '.....gG....bB...Gg......',
    '....gG.....bB....Gg.....',
    '....G......bB.....G.....',
    '...........bB...........'
  ];
  function mkPalm(bow) {
    const g = grid(24, 40);
    PALM_TOP.forEach((r, y) => { for (let x = 0; x < 24; x++) if (r[x] !== '.') g[y][x] = r[x]; });
    for (let y = 11; y < 40; y++) {
      const t = (y - 10) / 29;
      const cx = 11 + Math.round(Math.sin(t * Math.PI) * bow);
      const wd = t > 0.55 ? 3 : 2;
      for (let i = 0; i < wd; i++) put(g, cx + i, y, i === wd - 1 || y % 3 === 0 ? 'B' : 'b');
    }
    for (let x = 9; x < 16; x++) put(g, x, 39, 'B');
    return mkSprite(flat(g), {
      g: '#28d048', G: '#108a2c', b: '#c8884c', B: '#7c4c24', c: '#6c3c10', C: '#a8682c'
    }, { s: 3.4, foot: [[9, 16]] });
  }

  function mkHut() {
    const g = grid(30, 24);
    for (let y = 0; y < 9; y++) {
      const half = 3 + y * 1.5;
      for (let x = 0; x < 30; x++) {
        const d = x + 0.5 - 15;
        if (Math.abs(d) <= half) g[y][x] = y === 8 ? 'R' : (Math.floor(d / 3 + 10) % 2 ? 'r' : 'w');
      }
    }
    for (let y = 9; y < 22; y++) for (let x = 3; x < 27; x++) g[y][x] = y % 3 === 0 ? 'B' : 'b';
    for (let y = 11; y < 15; y++) for (let x = 5; x < 11; x++) g[y][x] = (y === 11 || x === 5 || x === 10) ? 'B' : 'g';
    for (let y = 12; y < 22; y++) for (let x = 17; x < 23; x++) g[y][x] = 'd';
    put(g, 21, 17, 'y');
    for (let y = 22; y < 24; y++) for (const x of [4, 5, 24, 25]) put(g, x, y, 'B');
    return mkSprite(flat(g), {
      r: '#ff3030', w: '#ffffff', R: '#a01818', b: '#e0a060', B: '#986030', g: '#60d0ff', d: '#402010', y: '#ffd800'
    }, { s: 2.6, foot: [[3, 27]] });
  }

  function mkParasol() {
    const g = grid(18, 26);
    for (let y = 0; y < 7; y++) {
      const half = 1.5 + y * 1.25;
      for (let x = 0; x < 18; x++) {
        const d = x + 0.5 - 9;
        if (Math.abs(d) > half) continue;
        if (y === 6 && x % 2) continue;
        g[y][x] = Math.floor((d + 9) / 3) % 2 ? 'r' : 'w';
      }
    }
    for (let y = 7; y < 25; y++) put(g, 9, y, 'k');
    for (let x = 7; x < 12; x++) put(g, x, 25, 'k');
    return mkSprite(flat(g), { r: '#ff40a0', w: '#ffffff', k: '#505050' }, { s: 2.0, foot: [[7, 12]] });
  }

  const CHEV = [
    'kkkkkkkkkkkkkkkk',
    'krrrrrrrrrrrrrrk',
    'krwwrrrrwwrrrrrk',
    'krrwwrrrrwwrrrrk',
    'krrrwwrrrrwwrrrk',
    'krrrwwrrrrwwrrrk',
    'krrwwrrrrwwrrrrk',
    'krwwrrrrwwrrrrrk',
    'krrrrrrrrrrrrrrk',
    'kkkkkkkkkkkkkkkk',
    '...ss......ss...',
    '...ss......ss...',
    '...ss......ss...',
    '...ss......ss...',
    '...ss......ss...'
  ];

  // Mini-Schrift 3x5 für Plakatwände
  const MINI = {
    A: '.#.|#.#|###|#.#|#.#', B: '##.|#.#|##.|#.#|##.', C: '.##|#..|#..|#..|.##', D: '##.|#.#|#.#|#.#|##.',
    E: '###|#..|##.|#..|###', F: '###|#..|##.|#..|#..', G: '.##|#..|#.#|#.#|.##', H: '#.#|#.#|###|#.#|#.#',
    I: '###|.#.|.#.|.#.|###', K: '#.#|#.#|##.|#.#|#.#', L: '#..|#..|#..|#..|###', N: '##.|#.#|#.#|#.#|#.#',
    O: '###|#.#|#.#|#.#|###', P: '##.|#.#|##.|#..|#..', R: '##.|#.#|##.|#.#|#.#', S: '.##|#..|.#.|..#|##.',
    T: '###|.#.|.#.|.#.|.#.', U: '#.#|#.#|#.#|#.#|###', V: '#.#|#.#|#.#|#.#|.#.', Z: '###|..#|.#.|#..|###'
  };
  function mkBoard(text, pal, neon) {
    const w = Math.max(23, text.length * 4 + 7), g = grid(w, 26);
    for (let y = 0; y < 15; y++) for (let x = 0; x < w; x++) {
      const edge = y === 0 || y === 14 || x === 0 || x === w - 1;
      const ring = neon && y >= 2 && y <= 12 && x >= 2 && x <= w - 3 && (y === 2 || y === 12 || x === 2 || x === w - 3);
      g[y][x] = edge ? 'k' : ring ? 'p' : 'b';
    }
    if (!neon) for (let x = 1; x < w - 1; x++) { g[11][x] = 'd'; g[12][x] = 'e'; }
    const x0 = Math.floor((w - (text.length * 4 - 1)) / 2);
    for (const pass of ['s', 't']) {
      [...text].forEach((ch, i) => {
        const m = MINI[ch];
        if (!m) return;
        m.split('|').forEach((r, yy) => {
          for (let xx = 0; xx < 3; xx++) {
            if (r[xx] === '#') put(g, x0 + i * 4 + xx + (pass === 's' ? 1 : 0), 4 + yy + (pass === 's' ? 1 : 0), pass);
          }
        });
      });
    }
    for (let y = 15; y < 26; y++) for (const x of [4, 5, w - 6, w - 5]) put(g, x, y, 'P');
    // nur die beiden Pfosten stehen im Weg, unter der Tafel ist Platz
    return mkSprite(flat(g), pal, { s: 2.6, foot: [[4, 6], [w - 6, w - 4]], lod: 1.5 });
  }

  const CACTUS_TOP = [
    '......gg........',
    '.....gGGg.......',
    '.....ghGg.......',
    '.....ghGg...gg..',
    '.....ghGg..gGGg.',
    '..gg.ghGg..ghGg.',
    '.gGGgghGg..ghGg.',
    '.ghGgghGg.ghGg..',
    '..gGGghGGgGGg...',
    '...gggghGgg.....'
  ];
  function mkCactus(flip) {
    const rows = CACTUS_TOP.slice();
    for (let y = 10; y < 28; y++) rows.push(y % 5 === 2 ? '....yghGgy......' : '.....ghGg.......');
    rows.push('...bbbbbbbbb....', '..bbbbbbbbbbb...');
    return mkSprite(flip ? rows.map(revStr) : rows, {
      g: '#2c9a3c', G: '#16602a', h: '#68d070', y: '#f0f0a0', b: '#d09850'
    }, { s: 3.0, foot: [flip ? [3, 14] : [2, 13]] });   // Stamm samt Sandhügel
  }

  function mkRock(seed, pal) {
    const r = rng(seed), g = grid(24, 14);
    const ph = [r() * 6, r() * 6, r() * 6];
    for (let y = 0; y < 14; y++) for (let x = 0; x < 24; x++) {
      const nx = (x + 0.5 - 12) / 11.5, ny = (y + 0.5 - 14) / 13.5;
      const ang = Math.atan2(ny, nx);
      const rad = 1 - 0.12 * Math.sin(ang * 3 + ph[0]) - 0.08 * Math.sin(ang * 5 + ph[1]);
      const d = Math.sqrt(nx * nx + ny * ny);
      if (d > rad) continue;
      const l = -nx * 0.55 - ny * 0.8 + (r() - 0.5) * 0.25;
      g[y][x] = d > rad - 0.09 ? 'k' : l > 0.75 ? 'h' : l > 0.3 ? 'r' : 'R';
    }
    const rows = flat(g);
    return mkSprite(rows, pal, { s: 2.8, foot: span(rows) });
  }

  function mkLamp() {
    const g = grid(14, 48);
    for (let y = 4; y < 48; y++) { put(g, 1, y, 's'); put(g, 2, y, 'S'); }
    for (let x = 1; x < 11; x++) { put(g, x, 2, 's'); put(g, x, 3, 'S'); }
    for (let x = 8; x < 14; x++) { put(g, x, 3, 'k'); put(g, x, 4, 'k'); }
    for (let x = 9; x < 13; x++) put(g, x, 5, 'y');
    put(g, 10, 6, 'w'); put(g, 11, 6, 'w');
    for (let y = 44; y < 48; y++) for (let x = 0; x < 4; x++) put(g, x, y, 'S');
    return mkSprite(flat(g), { s: '#9090a8', S: '#505068', k: '#282830', y: '#fff0a0', w: '#ffffff' },
      { s: 2.8, foot: [[0, 4]], glow: [11, 6] });
  }

  function mkBuilding(seed) {
    const r = rng(seed), g = grid(36, 60);
    for (let y = 6; y < 60; y++) for (let x = 0; x < 36; x++) g[y][x] = x === 0 || x === 35 || y === 6 ? 'K' : 'b';
    for (let wy = 9; wy < 57; wy += 5) for (let wx = 3; wx < 33; wx += 4) {
      const q = r(), ch = q < 0.42 ? 'y' : q < 0.52 ? 'c' : q < 0.56 ? 'p' : 'd';
      for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 2; dx++) put(g, wx + dx, wy + dy, ch);
    }
    for (let y = 0; y < 6; y++) put(g, 17, y, 's');
    put(g, 17, 0, 'r'); put(g, 18, 0, 'r');
    return mkSprite(flat(g), {
      b: '#101026', K: '#262648', y: '#ffd860', c: '#60e0ff', p: '#ff70d0', d: '#202038', s: '#7070a0', r: '#ff2020'
    }, { s: 4.4, foot: [[0, 36]], lod: 1.5 });
  }

  // Start/Ziel-Brücke mit Startampel; Variante v: 0 aus, 1-3 rot, 4 grün.
  // 84 Pixel à 75 Welteinheiten: die Pfosten stehen neben dem Rüttelstreifen.
  function mkGantry(v) {
    const W = 84, mid = W / 2, g = grid(W, 64);
    for (let y = 0; y < 16; y++) for (let x = 0; x < W; x++) {
      if (y < 2) g[y][x] = 'k';
      else if (y >= 14) g[y][x] = 'S';
      else g[y][x] = (Math.floor(x / 4) + Math.floor((y - 2) / 4)) % 2 ? 'k' : 'w';
    }
    for (let y = 3; y < 13; y++) for (let x = mid - 13; x < mid + 13; x++) g[y][x] = 'k';
    [-11, -5, 1, 7].forEach((dx, i) => {
      const x0 = mid + dx;
      for (let y = 5; y < 10; y++) for (let x = x0; x < x0 + 5; x++) {
        const corner = (y === 5 || y === 9) && (x === x0 || x === x0 + 4);
        if (!corner) g[y][x] = String(i + 1);
      }
    });
    for (let y = 0; y < 64; y++) for (const x of [0, 1, 2, 3, W - 4, W - 3, W - 2, W - 1]) {
      g[y][x] = x === 3 || x === W - 4 ? 'S' : 's';
    }
    const off = '#3c0c0c', red = '#ff2020', grn = '#20ff40';
    const pal = { k: '#101010', w: '#ffffff', S: '#606070', s: '#b0b0c0' };
    for (let i = 1; i <= 4; i++) pal[i] = v === 4 ? grn : i <= v && i < 4 ? red : off;
    return mkSprite(flat(g), pal, { s: 75 / PX, gantry: true, foot: [[0, 4], [W - 4, W]] });
  }

  // Explosion in vier Phasen
  function mkBoom(fi) {
    const r = rng(91 + fi * 7), g = grid(28, 28);
    const R = [6, 10, 12.5, 13.5][fi];
    for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
      const dx = x + 0.5 - 14, dy = y + 0.5 - 14;
      const ang = Math.atan2(dy, dx);
      const q = Math.sqrt(dx * dx + dy * dy) / (R * (1 + 0.22 * Math.sin(ang * 5 + fi * 1.7) + (r() - 0.5) * 0.25));
      if (q >= 1) continue;
      const k = q + (r() - 0.5) * 0.15;
      let ch;
      if (fi === 0) ch = k < 0.5 ? 'w' : k < 0.8 ? 'y' : 'o';
      else if (fi === 1) ch = k < 0.3 ? 'w' : k < 0.6 ? 'y' : k < 0.85 ? 'o' : 'r';
      else if (fi === 2) ch = k < 0.3 ? 'y' : k < 0.55 ? 'o' : k < 0.8 ? 'r' : 'd';
      else ch = r() < 0.35 ? '.' : k < 0.4 ? 'r' : k < 0.75 ? 'd' : 'k';
      g[y][x] = ch;
    }
    return mkSprite(flat(g), {
      w: '#ffffff', y: '#ffe830', o: '#ff9a20', r: '#e82810', d: '#605048', k: '#383030'
    });
  }

  function mkCloud(seed) {
    const r = rng(seed), g = grid(32, 10);
    const puffs = [[8, 6, 4], [15, 4, 5], [23, 6, 4], [12, 7, 3], [27, 7, 3]];
    for (const p of puffs) { p[0] += Math.round((r() - 0.5) * 3); }
    for (let y = 0; y < 10; y++) for (let x = 0; x < 32; x++) {
      for (const [cx, cy, cr] of puffs) {
        const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
        if (dx * dx + dy * dy <= cr * cr) { g[y][x] = y >= 8 ? 'v' : 'w'; break; }
      }
    }
    return mkSprite(flat(g), { w: '#ffffff', v: '#c8dcf0' });
  }

  const SPR = {
    palm: [mkPalm(2), mkPalm(-2), mkPalm(1)],

    parasol: mkParasol(),
    chev: mkSprite(CHEV, { k: '#202020', r: '#ff2020', w: '#ffffff', s: '#a0a0a0' }, { s: 2.3, foot: span(CHEV) }),
    cactus: [mkCactus(false), mkCactus(true)],
    rock: [1, 2, 3].map(s => mkRock(s * 31, { k: '#5c2c14', h: '#e8a070', r: '#b86c3c', R: '#7c3c1c' })),
    lamp: mkLamp(),
    bld: [5, 6, 7].map(mkBuilding),
    gantry: [0, 1, 2, 3, 4].map(mkGantry),
    boom: [0, 1, 2, 3].map(mkBoom),

    board: {

      })),
      desert: ['TURBO', 'OASE', 'VOLLGAS'].map(t => mkBoard(t, {
        k: '#3c1c08', b: '#ffd040', t: '#802000', s: '#d09820', d: '#e04010', e: '#ffffff', P: '#6c4c34'
      })),
      night: ['NEON', 'DISCO', 'HOTEL', 'PIZZA'].map(t => mkBoard(t, {
        k: '#000000', b: '#180a20', p: '#ff40c0', t: '#40f0ff', s: '#106070', P: '#404058'
      }, true))
    }
  };

  // ----------------------------------------------------------
  //  Strecken. Abschnitt: [Einfahrt, Halten, Ausfahrt, Kurve, Höhenänderung]
  //  Kurve: + rechts / - links (2 sanft, 4 mittel, 6 scharf)

  const STAGES = [

        [0, 60, 0, 0, 0], [30, 40, 30, 4, 0], [15, 20, 15, 0, 3200], [15, 20, 15, 0, -3200],

        [20, 40, 20, 0, 1800], [20, 40, 20, -2, -1800], [30, 30, 30, 2, 0], [0, 80, 0, 0, 0]
      ],

    },

        [15, 15, 15, 0, -2600], [15, 15, 15, 0, 2600], [15, 15, 15, 0, -2600], [30, 40, 30, 3, 0],
        [25, 50, 25, -6, 0], [0, 40, 0, 0, 0], [30, 50, 30, 2, 3000], [30, 50, 30, 0, -3000], [0, 70, 0, 0, 0]

        [25, 40, 25, 6, 0], [0, 30, 0, 0, 0], [20, 40, 20, 0, 2800], [20, 40, 20, 0, -2800],
        [20, 25, 20, -5, 0], [20, 25, 20, 5, 0], [0, 50, 0, 0, 0], [30, 60, 30, -3, 0],
