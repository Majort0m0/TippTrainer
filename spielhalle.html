  // Deko auf dem Boden (vor dem Hintergrund, hinter den Figuren)
  function drawDeco(th, tx0, tx1) {
    for (let tx = tx0; tx <= tx1; tx++) {
      for (let ty = 1; ty < MAP_H; ty++) {
        const k = S.map[ty * S.W + tx];
        if (k !== T.GROUND) continue;
        const up = S.map[(ty - 1) * S.W + tx];
        if (up !== T.AIR) continue;
        const hs = hash(tx, ty), x = tx * TS + ox, y = MAP_Y + ty * TS;
        if (th === 0 || th === 2) {
          if (hs < 140) spr(DECO_FLOWER[hs & 1], x + 0.5, y - 7 * PX, false);
          else if (hs > 900 && tileAt(tx + 1, ty - 1) === T.AIR && tileAt(tx + 1, ty) === T.GROUND) {
            dome(x + TS, y + FT, 3.2, 1.3, 4, '#2a9a32');
            dome(x + TS, y + FT, 2.6, 1.0, 3, '#4ad44a');
            rect(x + TS - 0.6, y - 0.8, 0.3, 0.3, '#a8f890');
          }
        } else if (th === 1 && hs < 180) spr(DECO_CRYSTAL[hs & 1], x + 0.4, y - 7 * PX, false);
        break;
      }
      if (th === 1) {
        // Tropfsteine unter der Decke
        for (let ty = 0; ty < 8; ty++) {
          if (S.map[ty * S.W + tx] === T.GROUND && S.map[(ty + 1) * S.W + tx] === T.AIR) {
            const hs = hash(tx, ty + 50);
            if (hs < 450) {
              const x = tx * TS + ox + 0.35 + (hs % 5) * 0.15, y = MAP_Y + (ty + 1) * TS;
              rect(x, y, 0.55, 0.45, '#3a4280');
              rect(x + 0.1, y + 0.45, 0.35, 0.4, '#3a4280');
              rect(x + 0.18, y + 0.85, 0.2, 0.35, '#5a64b0');
            }
            break;
          }
        }
      }
    }
  }

  // ------------------------------------------------------------
  //  Welt zeichnen
  // ------------------------------------------------------------
  function tileArt(k, tx, ty, th) {
    const TH = THEMES[th];
    switch (k) {
      case T.GROUND: {
        if (TH.gTop && ty > 0 && tileAt(tx, ty - 1) !== T.GROUND) return TH.gTop;
        const v = hash(tx, ty);
        return TH.gFill[v < 160 ? 2 : v < 420 ? 1 : 0];
      }
      case T.BRICK: case T.BCOIN: case T.BPOW: case T.BSTAR: return TH.brick;
      case T.QCOIN: case T.QPOW: case T.QSTAR: case T.Q1UP: {
        const f = (S.t >> 3) % 6;
        return TH.q[f < 3 ? 0 : f === 3 ? 1 : f === 4 ? 2 : 1];
      }
      case T.USED: return TH.used;
      case T.HARD: return TH.hard;
      case T.PTL: return TH.pTL;
      case T.PTR: return TH.pTR;
      case T.PL: return TH.pL;
      case T.PR: return TH.pR;
      case T.SEMI: {
        const l = tileAt(tx - 1, ty) === T.SEMI, r = tileAt(tx + 1, ty) === T.SEMI;
        return !l ? LEAF.l : !r ? LEAF.r : LEAF.m;
      }
      case T.TRUNK: return TRUNK[hash(tx, ty) < 200 ? 1 : 0];
      case T.LAVA: return ty > 0 && tileAt(tx, ty - 1) !== T.LAVA ? LAVA_TOP[(S.t >> 3) & 3] : LAVA[(S.t >> 4) & 1];
      case T.BRIDGE: return BRIDGE;
    }
    return null;
  }

  // Sichtbare Kacheln mit wenigen fillRect: Grundfarbe und volle Zeilen über ganze Läufe,
  // volle Spalten über ganze Säulen, nur der Rest je Kachel
  const GRID = new Array(17 * MAP_H).fill(null);
  const BASE_RUNS = new Map();
  // Kachelstücke: ringsum TE Rand, so überlappen Nachbarn um ~1 Bildpunkt (keine Nähte)
  function sprG(gs, x, y) {
    const ctx = Core.ctx, e2 = 2 * TE;
    for (let i = 0; i < gs.length; i++) {
      const gr = gs[i], r = gr.r;
      ctx.fillStyle = gr.c;
      for (let j = 0; j < r.length; j += 4) {
        ctx.fillRect(x + r[j] * PX - TE, y + r[j + 1] * PX - TE, r[j + 2] * PX + e2, r[j + 3] * PX + e2);
      }
    }
  }
  function drawTiles(th, tx0, tx1) {
    const ctx = Core.ctx, nx = tx1 - tx0 + 1, e2 = 2 * TE;
    // Stoß-Versatz der angestoßenen Blöcke
    let bumps = null;
    for (const p of fx) {
      if (p.k !== 'bump') continue;
      (bumps || (bumps = {}))[p.tx + ',' + p.ty] = -Math.sin(p.t / p.life * Math.PI) * 5 * PX;
    }
    const special = [];
    for (let ty = 0; ty < MAP_H; ty++) {
      for (let i = 0; i < nx; i++) {
        const tx = tx0 + i, k = S.map[ty * S.W + tx];
        let a = null;
        // Hebel: eigener Durchgang nach dem Helden (drawLever)
        if (k === T.COIN || (k && k !== T.LEVER && bumps && bumps[tx + ',' + ty] !== undefined)) special.push(tx, ty, k);
        else if (k && k !== T.LEVER) a = tileArt(k, tx, ty, th);
        GRID[ty * nx + i] = a;
      }
    }
    // Grundfarben: waagrechte Läufe, gleiche Läufe in Folgereihen senkrecht vereint
    // (keine Nähte zwischen den Reihen großer Flächen, weniger fillRect)
    const runs = BASE_RUNS;
    runs.clear();
    const flush = o => {
      ctx.fillStyle = o.c;
      ctx.fillRect((tx0 + o.r0) * TS + ox - TE, MAP_Y + o.y0 * TS - TE, (o.r1 - o.r0) * TS + e2, (o.y1 - o.y0) * TS + e2);
    };
    for (let ty = 0; ty <= MAP_H; ty++) {
      let r0 = 0, rc = null;
      for (let i = 0; i <= nx && ty < MAP_H; i++) {
        const a = i < nx ? GRID[ty * nx + i] : null, c = a ? a.base : null;
        if (c === rc) continue;
        if (rc) {
          const key = r0 * 64 + i + rc, o = runs.get(key);
          if (o && o.y1 === ty) o.y1 = ty + 1;
          else { if (o) flush(o); runs.set(key, { r0, r1: i, c: rc, y0: ty, y1: ty + 1 }); }
        }
        r0 = i; rc = c;
      }
      for (const [key, o] of runs) if (o.y1 === ty) { flush(o); runs.delete(key); }
    }
    for (let ty = 0; ty < MAP_H; ty++) {
      const y = MAP_Y + ty * TS, row = ty * nx;
      // volle Zeilen
      let ra = null, r0 = 0;
      for (let i = 0; i <= nx; i++) {
        const a = i < nx ? GRID[row + i] : null;
        if (a === ra || (a && ra && a.hk === ra.hk)) continue;
        if (ra && ra.hs.length) {
          const x = (tx0 + r0) * TS + ox - TE, w = (i - r0) * TS + e2;
          for (const gr of ra.hs) {
            ctx.fillStyle = gr.c;
            for (let j = 0; j < gr.r.length; j += 4) ctx.fillRect(x, y + gr.r[j + 1] * PX - TE, w, gr.r[j + 3] * PX + e2);
          }
        }
        r0 = i; ra = a;
      }
    }
    // volle Spalten
    for (let i = 0; i < nx; i++) {
      const x = (tx0 + i) * TS + ox;
      let r0 = 0, ra = null;
      for (let ty = 0; ty <= MAP_H; ty++) {
        const a = ty < MAP_H ? GRID[ty * nx + i] : null;
        if (a === ra || (a && ra && a.vk === ra.vk)) continue;
        if (ra && ra.vs.length) {
          const y = MAP_Y + r0 * TS - TE, h = (ty - r0) * TS + e2;
          for (const gr of ra.vs) {
            ctx.fillStyle = gr.c;
            for (let j = 0; j < gr.r.length; j += 4) ctx.fillRect(x + gr.r[j] * PX - TE, y, gr.r[j + 2] * PX + e2, h);
          }
        }
        r0 = ty; ra = a;
      }
    }
    // Einzelstücke
    for (let ty = 0; ty < MAP_H; ty++) {
      const y = MAP_Y + ty * TS;
      for (let i = 0; i < nx; i++) {
        const a = GRID[ty * nx + i];
        if (a) sprG(a.sp, (tx0 + i) * TS + ox, y);
      }
    }
    // Taler und angestoßene Blöcke einzeln
    for (let j = 0; j < special.length; j += 3) {
      const tx = special[j], ty = special[j + 1], k = special[j + 2];
      const x = tx * TS + ox, y = MAP_Y + ty * TS;
      if (k === T.COIN) { spr(COIN[coinFrame(tx)], x + 4 * PX, y + PX, coinFlip(tx)); continue; }
      const a = tileArt(k, tx, ty, th), dy = bumps[tx + ',' + ty];
      if (!a) continue;
      if (a.base) rect(x, y + dy, TS + FT, TS + FT, a.base);
      spr(a, x, y + dy, false);
    }
  }
  const coinFrame = n => [0, 1, 2, 1][((S.t >> 3) + n) & 3];
  const coinFlip = n => (((S.t >> 3) + n) & 3) === 3;

  function drawGoal(th) {
    const L = lev();
    if (L.check) {
      const x = L.check.x * TILE + 8, by = (L.check.y + 1) * TILE;
      const sx = x * PX + ox, top = MAP_Y + (by - 40) * PX;
      if (sx > -2 && sx < COLS + 2) {
        rect(sx - 0.1, top, 0.2, 40 * PX, '#d0d0d0');
        rect(sx - 0.18, top - 0.2, 0.36, 0.36, '#ffe14a');
        rect(sx + 0.1, top + 0.15, 1.2, 0.8, S.check ? '#ff4a3a' : '#606070');
        rect(sx + 0.1, top + 0.95, 0.6, 0.25, S.check ? '#ff4a3a' : '#606070');
      }
    }
    if (L.goal) {
      const px = L.goal.x * TILE + 8, base = L.goal.y * TILE, top = base - 9 * TILE;
      const sx = px * PX + ox;
      if (sx > -6 && sx < COLS + 6) {
        rect(sx - 0.11, MAP_Y + top * PX, 0.22, 9 * TS, '#e8f0e0');
        rect(sx - 0.11, MAP_Y + top * PX, 0.08, 9 * TS, '#9ab090');
        Core.circ(sx, MAP_Y + (top - 3) * PX, 0.32, '#3ad84a');
        const fy = S.cl && S.cl.kind === 'flag' ? S.cl.flagY : top + 6;
        spr(FLAG, sx - 16 * PX - 0.1, MAP_Y + fy * PX, false);
      }
    }
    if (L.gate) {
      // Zielhaus
      const gx = L.gate.x * TILE, gb = (L.gate.y + 1) * TILE;
      const x = (gx - 24) * PX + ox, w = 64 * PX, y = MAP_Y + (gb - 56) * PX;
      if (x < COLS + 1 && x + w > -1) {
        const B = THEMES[th].d.brick;
        // Fahnenstange; die Siegesfahne steigt hinter den Zinnen auf, sobald der Held drin ist
        rect(x + 31 * PX, y - 26 * PX, 2 * PX, 26 * PX, '#d0d0d0');
        rect(x + 30.5 * PX, y - 28 * PX, 3 * PX, 3 * PX, '#ffe14a');
        const hf = S.cl && S.cl.kind === 'flag' ? S.cl.hf || 0 : 0;
        if (hf > 0) {
          const fy = y - hf * 25 * PX;
          rect(x + 33 * PX, fy, 11 * PX, 7 * PX, '#ff4a3a');
          rect(x + 37 * PX, fy + 2 * PX, 3 * PX, 3 * PX, '#ffe14a');
        }
        rect(x, y, w, 56 * PX + FT, B.B);
        for (let i = 0; i < 5; i++) rect(x, y + (i * 11 + 10) * PX, w, PX, B.K);
        for (let i = 0; i < 4; i++) rect(x + (i * 16 + 4) * PX, y - 8 * PX, 8 * PX, 8 * PX + FT, B.B);
        rect(x, y - 1 * PX, w, PX, B.h);
        rect(x + 24 * PX, y + 30 * PX, 16 * PX, 26 * PX + FT, '#0a0408');
        rect(x + 26 * PX, y + 27 * PX, 12 * PX, 3 * PX + FT, '#0a0408');
        rect(x + 8 * PX, y + 12 * PX, 6 * PX, 9 * PX, '#0a0408');
        rect(x + 50 * PX, y + 12 * PX, 6 * PX, 9 * PX, '#0a0408');
      }
    }
  }

  function drawEnts(behind) {
    const t = S.t, th = lev().def.theme;
    for (const e of S.ents) {
      if (e.gone) continue;
      // Glutfisch taucht aus der Lava auf (hinter den Lavakacheln), Blasen kündigen ihn an
      const isBehind = e.t === 'plant' || e.t === 'fish' || (e.t === 'item' && e.st === 'rise');
      if (!behind && e.t === 'fish' && e.st === 'wait' && e.tm < 36 && !e.dead) lavaBubbles(e);
      if (isBehind !== behind) continue;
      const cx = e.x + e.w / 2, by = e.y + e.h;
      if (cx < S.camX - 48 || cx > S.camX + VIEW_W + 48) continue;
      const fl = e.dead && e.st === 'flip';
      switch (e.t) {
        case 'knuff': {
          const K = KNUFF[th];
          if (e.st === 'flat') put(K.flat, cx, by, false);
          else drawFlip(K.w[(e.anim | 0) & 1], cx, by, e.face > 0, fl);
          break;
        }
        case 'beetle': {
          const B = BEETLE[e.red ? 1 : 0];
          if (e.st === 'walk' && !e.dead) drawFlip(B.w[(e.anim | 0) & 1], cx, by, e.face > 0, false);
          else {
            const shake = e.st === 'shell' && e.tm > 340 && (t & 4) ? PX : 0;
            ox += shake;
            drawFlip(B.shell, cx, by, e.st === 'spin' && ((t >> 2) & 1), fl);
            ox -= shake;
          }
          break;
        }
        case 'bee': drawFlip(BEE[(e.anim | 0) & 1], cx, by, e.face > 0 || e.vx > 0, fl); break;
        case 'plant': put(PLANT[((e.anim * 0.5) | 0) & 1], cx, e.y + PLANT[0].h, false); break;
        case 'fish': {
          const F = FISH[(t >> 2) & 1];
          put(e.st === 'jump' && e.vy > 0 ? F.down : F.up, cx, by + 1, false);
          break;
        }
        case 'firebar': {
          const s = EMBER[(t >> 2) & 1];
          for (let i = 0; i < e.n; i++) {
            const p = firebarPos(e, i);
            put(s, p[0], p[1] + 4, false);
          }
          break;
        }
        case 'flame': put(FLAME[(t >> 2) & 1], cx, by, e.vx > 0); break;
        case 'boss': {
          const blink = e.hurt > 0 && (t & 4);
          const sp = BOSS[blink ? 1 : 0][(e.anim | 0) & 1];
          if (fl) drawFlip(sp, cx, by, false, true); else put(sp, cx, by + 2, e.face > 0);
          break;
        }
        case 'plat': drawPlat(e, th); break;
        case 'item': {
          let s = null;
          if (e.kind === 'berry') s = BERRY;
          else if (e.kind === 'flower') s = FLOWER[(t >> 3) & 1];
          else if (e.kind === 'star') s = STAR[(t >> 2) % 3];
          else s = CLOVER;
          put(s, cx, by, false);
          break;
        }
      }
    }
  }
  function lavaBubbles(e) {
    const x = (e.x + e.w / 2) * PX + ox, y = MAP_Y + e.surf * PX;
    if (x < -2 || x > COLS + 2) return;
    for (let i = 0; i < 3; i++) {
      const ph = (36 - e.tm + i * 11) % 24;
      const bx = x + (i - 1) * 0.45 + Math.sin(ph * 0.5 + i) * 0.08;
      const s = ph < 12 ? 0.22 : 0.3;
      rect(bx - s / 2, y - ph * 0.04 - s / 2, s, s, ph < 18 ? '#fff080' : '#ff8a1a');
    }
  }
  // Kopfüber für besiegte Gegner
  function drawFlip(s, cx, by, flip, upside) {
    if (!upside) { put(s, cx, by, flip); return; }
    const ctx = Core.ctx;
    const x = (cx - s.w / 2) * PX + ox, y = MAP_Y + (by - s.h) * PX;
    ctx.save();
    ctx.translate(0, 2 * y + s.h * PX);
    ctx.scale(1, -1);
    spr(s, x, y, flip);
    ctx.restore();
  }
  function drawPlat(e, th) {
    const x = Math.round((e.x * PX + ox) * 64) / 64, y = MAP_Y + e.y * PX, w = e.w * PX, h = e.h * PX;
    const c = e.kind === 'f' ? ['#ffb040', '#ff8a1a', '#7a3a00']
      : th === 3 ? ['#c0c0cc', '#7a7a88', '#28282f'] : ['#ffe8a0', '#e0a040', '#6a3a08'];
    rect(x, y, w, h, c[2]);
    rect(x + PX, y + PX, w - 2 * PX, 2 * PX, c[0]);
    rect(x + PX, y + 3 * PX, w - 2 * PX, h - 4 * PX, c[1]);
    for (let i = 1; i < 6; i++) rect(x + i * 8 * PX, y + 3 * PX, PX, h - 4 * PX, c[2]);
  }

  function drawHero() {
    const h = S.hero;
    if (h.hidden) return;
    if (h.inv > 0 && !h.dead && (S.t & 4) && S.freeze <= 0) return;
    let pal = h.power === 2 ? 1 : 0;
    if (h.star > 0) pal = h.star < 120 ? ((S.t >> 3) % 4 === 3 ? pal : 2 + (S.t >> 3) % 3) : 2 + (S.t >> 2) % 3;
    let power = h.power;
    // Wachsen und Schrumpfen flackern
    if (h.grow !== 0) {
      const a = Math.abs(h.grow);
      const alt = (a >> 2) & 1;
      if (h.grow > 0 && h.growFrom === 0 && alt) power = 0;
      if (h.grow < 0 && alt) power = h.growFrom;
      if (h.grow > 0 && h.growFrom === 1 && alt) pal = 0;
    }
    const H = HERO[pal];
    const cx = h.x + h.w / 2, by = h.y + h.h;
    if (h.dead) { put(H.s_die, cx, by, false); return; }
    const big = power > 0;
    let f = 'stand';
    const c = S.mode === 'clear' ? S.cl : null;
    if (c && c.kind === 'flag' && (c.ph === 'slide' || c.ph === 'turn')) f = 'jump';
    else if (!h.onGround) f = 'jump';
    else if (c && c.kind === 'lever' && c.ph === 'bridge' && c.pull < 20) f = c.pull < 10 ? 'jump' : 'skid';   // greifen, ziehen
    else if (h.skid) f = 'skid';
    else if (Math.abs(h.vx) > 0.1) f = ['w1', 'w2', 'stand'][Math.floor(h.anim) % 3];
    let s;
    if (big && h.duck) s = H.b_duck;
    else if (big && h.throwT > 0 && f !== 'skid') s = H.b_throw;
    else s = H[(big ? 'b_' : 's_') + f];
    put(s, cx, by, h.face < 0);
  }

  // Hebel der Burg: groß, mit pulsierendem Schein, solange er noch nicht gezogen ist
  function drawLever() {
    const L = lev();
    if (!L.lever || S.map[L.lever.y * S.W + L.lever.x] !== T.LEVER) return;
    const cx = (L.lever.x + 0.5) * TILE, by = (L.lever.y + 1) * TILE;
    if (cx * PX + ox < -3 || cx * PX + ox > COLS + 3) return;
    const c = S.cl && S.cl.kind === 'lever' ? S.cl : null;
    const pulled = c && (c.ph !== 'bridge' || c.pull >= 10);
    if (!pulled) {
      const kx = (cx - 4) * PX + ox, ky = MAP_Y + (by - 26.5) * PX, pulse = (S.t >> 3) & 1;
      pixDisc(kx, ky, 1.25 + pulse * 0.15, '#3a1410');
      pixDisc(kx, ky, 0.9 + pulse * 0.1, '#6a2414');
    }
    put(LEVER[(S.t >> 4) & 1], cx, by, !!pulled);
  }

  function drawBalls() {
    for (const b of S.balls) put(EMBER[(S.t >> 1) & 1], b.x + b.w / 2, b.y + b.h, false);
  }

  function drawFx(th) {
    for (const p of fx) {
      switch (p.k) {
        case 'deb': {
          const TH = THEMES[th < 0 ? 0 : th];
          put(TH.deb, p.x, p.y + 2, ((p.t >> 2) & 1) === 1);
          break;
        }
        case 'coin': put(COIN[[0, 1, 2, 1][(p.t >> 1) & 3]], p.x, p.y + 7, false); break;
        case 'spark': {
          const r = p.t * 0.7, x = p.x * PX + ox, y = MAP_Y + p.y * PX, s = 0.22;
          const c = p.t & 2 ? '#ffffff' : '#ffe14a';
          rect(x - r * PX - s / 2, y - s / 2, s, s, c); rect(x + r * PX - s / 2, y - s / 2, s, s, c);
          rect(x - s / 2, y - r * PX - s / 2, s, s, c); rect(x - s / 2, y + r * PX - s / 2, s, s, c);
          break;
        }
        case 'dust': {
          const a = p.t < p.life / 2, s = a ? 0.3 : 0.2;
          rect(p.x * PX + ox - s / 2, MAP_Y + p.y * PX - s / 2, s, s, a ? '#f4efe4' : '#a8a098');
          break;
        }
        case 'puff': {
          const r = (2 + p.t * 0.6) * PX, x = p.x * PX + ox, y = MAP_Y + p.y * PX;
          const c = p.t < 6 ? '#ffffff' : '#c8c8c8';
          rect(x - r - 0.15, y - 0.15, 0.3, 0.3, c); rect(x + r - 0.15, y - 0.15, 0.3, 0.3, c);
          rect(x - 0.15, y - r - 0.15, 0.3, 0.3, c);
          break;
        }
        case 'fw': {
          const x = p.x * PX + ox, y = MAP_Y + p.y * PX, r = Math.min(p.t, 20) * 0.08;
          const cs = ['#ff4a3a', '#ffe14a', '#5ae8ff', '#ff6ad5'];
          for (let i = 0; i < 8; i++) {
            const a = i * Math.PI / 4;
            rect(x + Math.cos(a) * r - 0.12, y + Math.sin(a) * r - 0.12, 0.24, 0.24, cs[(i + (p.c | 0)) & 3]);
          }
          break;
        }
      }
    }
    // Punkteanzeigen: nahe am Rand ins Bild geschoben, weit draußen weggelassen
    for (const p of fx) {
      if (p.k !== 'pop') continue;
      const x = p.x * PX + ox, y = MAP_Y + p.y * PX, half = p.text.length * 0.375 + 0.15;
      if (x < -6 || x > COLS + 6) continue;
      txt(p.text, clamp(x, half, COLS - half), Math.max(MAP_Y + 0.1, y - 0.9), p.c, 0.75, 'center');
    }
  }

  function drawWorld() {
    const ctx = Core.ctx, th = lev().def.theme;
    ox = -Math.round(S.camX * PX * 16) / 16;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, MAP_Y, COLS, ROWS - MAP_Y);
    ctx.clip();
    drawBg(th);
    const tx0 = Math.max(0, Math.floor(S.camX / TILE)), tx1 = Math.min(S.W - 1, tx0 + 16);
    drawDeco(th, tx0, tx1);
    drawGoal(th);
    drawEnts(true);
    drawTiles(th, tx0, tx1);
    drawEnts(false);
    drawBalls();
    drawHero();
    drawLever();
    drawFx(th);
    ctx.restore();
  }

  // ------------------------------------------------------------
  //  Anzeige und Bildschirme
  // ------------------------------------------------------------
  function drawHud() {
    const s = 0.75, y0 = 0.3, y1 = 1.25;
    txt('PUNKTE', 0.6, y0, '#ffffff', s);
    txt(pad(S.score, 6), 0.6, y1, '#ffffff', s);
    txt('TALER', 6.6, y0, '#ffffff', s);
    spr(COIN[(S.t >> 4) % 3 === 2 ? 1 : 0], 6.75, y1 + 0.02, false, 0.052);
    txt('×' + pad(S.coins, 2), 7.3, y1, '#ffe14a', s);
    txt('WELT', 12.4, y0, '#ffffff', s);
    txt(worldName(S.lvl), 12.6, y1, '#ffffff', s);
    txt('ZEIT', 17.4, y0, '#ffffff', s);
    const tc = S.time <= 100 && S.mode === 'play' ? ((S.t >> 4) & 1 ? '#ff5050' : '#ffe14a') : '#ffffff';
    const intro = S.mode === 'intro' || (S.mode === 'paused' && S.pausedFrom === 'intro');
    if (!intro) txt(pad(S.time, 3), 17.6, y1, tc, s);
    txt('LEBEN', 22.4, y0, '#ffffff', s);
    spr(HERO[0].icon, 22.4, y1 + 0.04, false, 0.075);
    txt('×' + pad(S.lives, 2), 23.75, y1, '#ffffff', s);
  }

  function drawIntro() {
    const L = lev(), th = THEMES[L.def.theme].d;
    txt('WELT ' + worldName(S.lvl), 14, 10.5, '#ffffff', 1.5, 'center');
    txt(L.def.name, 14, 13, th.text, 1, 'center');

  const ATTRACT_ROW = 11.25;           // Vorführung zeigt die Kartenreihen 11,25 .. 17,75
  function drawTitle() {
    const t = S.t;

    const TH = THEMES[0], br = TH.brick;

      if (i % 4 !== 1) { sprG(br.sp, i * TS, 0); continue; }

  function drawAttract() {
    const ctx = Core.ctx, top = 8.2, hgt = 6.5 * TS;
    const keep = S;
    S = A;
    try {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, top, COLS, hgt);
      ctx.clip();
      ctx.translate(0, top - (MAP_Y + ATTRACT_ROW * TS));
      drawWorld();
      ctx.restore();

    rect(0, top - 0.1, COLS, 0.1, '#2121ff');

  function draw() {
    if (!S || S.mode === 'off') return;
    // Kachelrand: etwa ein halber Bildpunkt je Seite
    const u = Core.unitPx();
    TE = Number.isFinite(u) && u > 4 ? Math.min(0.06, 0.5 / u) : 0.025;
    if (S.mode === 'title') { drawTitle(); return; }
    const st = S.mode === 'paused' ? S.pausedFrom : S.mode;
    if (st === 'intro') {
      drawHud();
      // pausiert: nur die Pausentafel, keine Introtexte darunter
      if (S.mode !== 'paused') drawIntro();
    } else if (st === 'over') {
      drawHud();
      drawOver();

      drawWorld();

  function press(a) {
    switch (S.mode) {
      case 'title':
        if (a === 'l') { S.sel = (S.sel + NUM_LEVELS - 1) % NUM_LEVELS; Snd.sfx('select'); }
        else if (a === 'r') { S.sel = (S.sel + 1) % NUM_LEVELS; Snd.sfx('select'); }
        else if ((a === 'start' || a === 'j') && S.lock <= 0) startGame();
        else if (a === 'esc') Core.exitToMenu();
        break;
      case 'intro':
        if (a === 'pause' || a === 'esc') pause();
        else if ((a === 'start' || a === 'j') && S.modeT > 40) beginPlay();
        break;
      case 'play': case 'dying': case 'clear':
        if (a === 'pause' || a === 'esc' || a === 'start') pause();
        else if (S.mode === 'play') {
          if (a === 'j') S.jumpBuf = JBUF + 1;
          else if (a === 'x') S.fireReq = true;
        }
        break;
      case 'paused':
        if (a === 'pause' || a === 'start') resume();
        else if (a === 'esc') Core.exitToMenu();
        else if (a === 'u' || a === 'd') S.pauseSel = 1 - S.pauseSel;
        else if (a === 'j' || a === 'x') { if (S.pauseSel === 1) Core.exitToMenu(); else resume(); }
        break;
      case 'over':
        if ((a === 'start' || a === 'j') && S.modeT > OVER_LOCK) toTitle(true);
        else if (a === 'esc') Core.exitToMenu();
        break;
    }

  function onKeyDown(e) {
    if (!S || S.mode === 'off') return false;
    const code = e.code;
    const a = KEY_ACT[code], sys = SYS_KEYS[code];
    if (!a && !sys) return false;
    if (e.repeat) {
      // Wiederholung löst nie etwas aus; nach Fokusverlust gilt die Taste aber wieder als gehalten
      if (a && S.mode === 'play') S.held[code] = true;
      return true;
    }
    if (a) {
      const was = held(a);
      S.held[code] = true;
      if (!was) press(a);
    } else press(sys);
    return true;
  }

  function onKeyUp(e) {
    if (!S || S.mode === 'off') return false;
    const code = e.code;
    if (!S.held[code]) return !!(KEY_ACT[code] || SYS_KEYS[code]);
    delete S.held[code];
    return true;
  }

  function onPointer(type, x, y, id) {
    if (!S || S.mode === 'off') return;
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    const p = S.ptrs[id];
    if (type === 'down') {
      if (S.mode === 'play' || S.mode === 'dying' || S.mode === 'clear' || S.mode === 'intro') {
        if (y < HUD_TAP) { pause(); return; }
        if (S.mode !== 'play') return;
        let walking = false;
        for (const k in S.ptrs) if (S.ptrs[k].role === 'l' || S.ptrs[k].role === 'r') walking = true;
        const role = walking ? 'j' : x < COLS / 4 ? 'l' : x > COLS * 3 / 4 ? 'r' : 'j';
        const wasJ = held('j');
        S.ptrs[id] = { role, x, y };
        if (role === 'j' && !wasJ) press('j');
      } else if (S.mode === 'title') {
        // Tippzonen passend zu 'START  < 1-1 >' (Text zentriert bei x = 14: '<' bei 14-15, '>' bei 20-21)
        const row = y >= SEL_Y - 0.8 && y <= SEL_Y + 1.2;
        if (y >= 33.4) Core.exitToMenu();
        else if (row && x >= 12.6 && x <= 15.8) press('l');
        else if (row && x >= 19.2) press('r');
        else if (S.lock <= 0) startGame();
      } else if (S.mode === 'paused') {
        if (x >= 9 && x <= 19 && y >= 21 && y <= 23) Core.exitToMenu();
        else resume();
      } else if (S.mode === 'over') {
        if (S.modeT > OVER_LOCK) toTitle(true);
      }
    } else if (type === 'move') {
      if (!p) return;
      p.x = x; p.y = y;
      if (p.role === 'l' || p.role === 'r') {
        if (x < COLS / 2 - 2) p.role = 'l';
        else if (x > COLS / 2 + 2) p.role = 'r';
      }
    } else if (type === 'up' || type === 'cancel') {
      if (p) delete S.ptrs[id];
    }
  }

  function onBlur() {
    if (!S || S.mode === 'off') return;
    if (['play', 'dying', 'clear', 'intro'].includes(S.mode)) pause();
    releaseAll();
  }

  function enter() {
    hi = Core.storage.get('hopper.hi', 0) || 0;
    const sel = S ? S.sel : 0;
    S = newState();
    S.sel = sel;
    fx.length = 0;
    toTitle();
  }

  function exit() {
    if (S && S.mode !== 'off') saveHi();
    Snd.shutdown();
    if (S) { releaseAll(); S.mode = 'off'; }
    fx.length = 0;
  }

  function hiScore() {
    const st = Core.storage.get('hopper.hi', 0) || 0;
    return Math.max(st, hi);
  }

  hi = Core.storage.get('hopper.hi', 0) || 0;

  return { id: 'hopper', title: 'SUPER HÜPFER',
           phase: () => !S || S.mode === 'title' || S.mode === 'off' ? 'title' : S.mode === 'over' ? 'over' : S.mode === 'paused' ? 'paused' : 'play',
           enter, exit, update, draw,
           onKeyDown, onKeyUp, onPointer, onBlur, hiScore };
})();

    if (showStack) {
      const flash = t >= fallEnd && Math.floor(t / 6) % 2 === 0;
      stack.forEach((row, r) => {
        for (let k = 0; k < row.length; k++) {
          drawBlock(wx + k * s, wy + (rows - 4 + r) * s, s - 0.03, flash ? '#ffffff' : colors[row[k]]);
        }
      });
      // fallender I-Stein (senkrecht in Spalte 6)
      const top = Math.min(rows - 4, Math.floor(t / 12) - 4);
      for (let k = 0; k < 4; k++) {
        const ry = top + k;
        if (ry >= 0) drawBlock(wx + 6 * s, wy + ry * s, s - 0.03, flash ? '#ffffff' : TCOL.I);
      }
    }
    cardScore(c, Tetris.hiScore());
  }

  function drawRacerCard(c) {
    cardTitle(c, 'VOLLGAS', ['#ff2020', '#ffb852', '#ffff00', '#00ff00', '#00ffff', '#2a5cff', '#ffb8ff']);
    const xl = c.x0 + 0.6, xr = c.x1 - 0.6, top = c.y0 + 2.6, bot = c.y0 + 10.9, cx = (c.x0 + c.x1) / 2;
    clipTo(xl, top, xr, bot);
    const hy = top + 2.2;
    ['#ffb050', '#ff7a2a', '#ff4a6a', '#a03a9a', '#5a2a8a'].forEach((col, i) => {
      ctx.fillStyle = col;
      ctx.fillRect(xl, top + i * 0.44, xr - xl, 0.45);
    });
    circ(cx + 2.5, hy - 0.1, 0.9, '#ffe060');
    // Straße in Pseudo-3D: Bänder vom Horizont nach vorne
    const curve = Math.sin(age * 0.012) * 3, phase = age * 0.35, N = 30;
    for (let i = 0; i < N; i++) {
      const t0 = i / N, t1 = (i + 1) / N;
      const y0 = hy + (bot - hy) * t0 * t0, y1 = hy + (bot - hy) * t1 * t1;
      const z = 1 / (0.05 + t0);
      const odd = Math.floor(z * 2.2 + phase) % 2 === 0;
      const cx0 = cx + curve * (1 - t0) * (1 - t0), cx1 = cx + curve * (1 - t1) * (1 - t1);
      const w0 = 0.2 + 5.2 * t0 * t0, w1 = 0.2 + 5.2 * t1 * t1;
      ctx.fillStyle = odd ? '#1f9a2a' : '#178020';
      ctx.fillRect(xl, y0, xr - xl, y1 - y0 + 0.02);
      const band = (k, col) => {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(cx0 - w0 * k, y0); ctx.lineTo(cx0 + w0 * k, y0);
        ctx.lineTo(cx1 + w1 * k, y1); ctx.lineTo(cx1 - w1 * k, y1);
        ctx.closePath(); ctx.fill();
      };
      band(1.15, odd ? '#ff2020' : '#ffffff');
      band(1, odd ? '#5a5a5a' : '#646464');
      if (odd) band(0.05, '#ffffff');
    }
    const s = 0.3, sp = SPRITES.car;
    drawSprite('car', cx - sp.rows[0].length * s / 2 + Math.sin(age * 0.05) * 0.5, bot - sp.rows.length * s - 0.3, s);
    ctx.restore();
    cardScore(c, Racer.hiScore());
  }

  function drawHopperCard(c) {
    cardTitle(c, 'SUPER HÜPFER', ['#ff9a20', '#ffff00', '#00e000', '#00ffff', '#ffb8ff']);
    const xl = c.x0 + 0.6, xr = c.x1 - 0.6, top = c.y0 + 2.6, bot = c.y0 + 10.9, cx = (c.x0 + c.x1) / 2;
    clipTo(xl, top, xr, bot);
    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(xl, top, xr - xl, bot - top);
    const scroll = (age * 0.06) % 1.2;
    // Wolken
    ctx.fillStyle = '#ffffff';
    for (let k = 0; k < 3; k++) {
      const wx = xr + 1 - ((age * 0.02 + k * 4.5) % (xr - xl + 3));
      ctx.fillRect(wx, top + 0.8 + k % 2 * 0.7, 1.6, 0.45);
      ctx.fillRect(wx + 0.35, top + 0.5 + k % 2 * 0.7, 0.9, 0.35);
    }
    // Boden aus Ziegeln
    const gy = bot - 1.2;
    for (let gx = xl - scroll; gx < xr; gx += 1.2) {
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(gx, gy, 1.2, 1.2);
      ctx.fillStyle = '#000000';
      ctx.fillRect(gx, gy + 0.55, 1.2, 0.08);
      ctx.fillRect(gx + 0.55, gy, 0.08, 0.55);
      ctx.fillRect(gx, gy, 0.08, 1.2);
    }
    // ?-Block (wandert mit dem Boden) und Gegner
    const span = xr - xl + 4;
    const qx = xr + 1 - ((age * 0.06) % span), qy = gy - 4.2;
    ctx.fillStyle = Math.floor(age / 12) % 3 === 0 ? '#ffd27a' : '#f8b800';
    ctx.fillRect(qx, qy, 1.2, 1.2);
    drawText('?', qx + 0.15, qy + 0.18, '#a04000', 0.9);
    const ex = xr + 2.5 - ((age * 0.09 + 3) % span), ks = 0.15;
    drawSprite(Math.floor(age / 10) % 2 ? 'knuff1' : 'knuff2', ex, gy - 16 * ks, ks);
    // Frosch-Held läuft und hüpft regelmäßig
    const jt = age % 70, jump = jt < 34 ? Math.sin(jt / 34 * Math.PI) * 3.0 : 0;
    const s = 0.17, hx = cx - 2.4, hy = gy - 16 * s - jump;
    const walk = ['frog', 'frogW1', 'frog', 'frogW2'][Math.floor(age / 6) % 4];
    drawSprite(jump > 0 ? 'frogJump' : walk, hx, hy, s);
    ctx.restore();
    cardScore(c, Hopper.hiScore());
  }

  function draw() {
    const title = 'SPIELHALLE', shift = Math.floor(age / 10);
    for (let i = 0; i < title.length; i++) {
      drawText(title[i], 4 + i * 2, 1.3, RAINBOW[(i + shift) % RAINBOW.length], 2);
    }
    drawText('WÄHLE EIN SPIEL', 14, 4.0, '#ffffff', 1, 'center');
    CARDS.forEach((c, i) => drawFrame(c, i === sel && Math.floor(age / 20) % 4 !== 3 ? '#ffff00' : (i === sel ? '#ffb852' : '#2121ff')));
    drawMampfCard(CARDS[0]);
    drawTetrisCard(CARDS[1]);
    drawRacerCard(CARDS[2]);
    drawHopperCard(CARDS[3]);
    drawText('PFEILE + ENTER ODER ANTIPPEN', 14, 34.1, '#ffffff', 0.75, 'center');
    drawText('M = TON ' + (AudioCore.muted() ? 'AUS' : 'AN'), 14, 35.05, '#00ffff', 0.75, 'center');
  }

  return {
    id: 'menu', title: 'MENÜ', phase: () => 'menu',
    enter, exit, update, draw, onKeyDown, onKeyUp, onPointer, onBlur,
    hiScore: () => 0
  };
})();

// ============================================================
//  CORE – Touch-Gamepad (sendet dieselben Tastencodes wie eine Tastatur)
// ============================================================
// cluster: 'dpad' (4 Richtungen), 'lr' (links/rechts), 'ud' (hoch/runter)
// buttons: Aktionstasten rechts; system: kleine Tasten START/PAUSE/MENÜ/TON
const PAD_LAYOUTS = {
  menu: {
    cluster: 'dpad',
    buttons: [{ code: 'Enter', label: 'START', color: '#ffff00' }],
    system: ['sound']
  },
  mampf: {
    cluster: 'dpad',
    buttons: [{ code: 'Enter', label: 'START', color: '#ffff00' }, { code: 'KeyP', label: 'PAUSE', color: '#ffb852' }],
    system: ['menu', 'sound']
  },
  tetris: {
    cluster: 'dpad',
    buttons: [
      { code: 'ArrowUp', icon: 'cw', color: '#ffb8ff' },
      { code: 'KeyZ', icon: 'ccw', color: '#ffb8ff' },
      { code: 'Space', label: 'DROP', color: '#ffff00' },
      { code: 'KeyC', label: 'HALTEN', color: '#00ffff' }
    ],
    system: ['start', 'pause', 'menu', 'sound']
  },
  racer: {
    cluster: 'lr',
    buttons: [{ code: 'ArrowUp', label: 'GAS', color: '#00e000' }, { code: 'ArrowDown', label: 'BREMSE', color: '#ff3030' }],
    system: ['start', 'pause', 'menu', 'sound']
  },
  hopper: {
    cluster: 'dpad',
    slide: true,                                  // Daumen darf von RENNEN auf SPRUNG rollen
    buttons: [{ code: 'Space', label: 'SPRUNG', color: '#00e000' }, { code: 'KeyX', label: 'RENNEN', color: '#ff3030' }],
    system: ['start', 'pause', 'menu', 'sound']
  }
};
const SYS_BTN = {
  start: { code: 'Enter', label: 'START' },
  pause: { code: 'KeyP', label: 'PAUSE' },
  menu: { code: 'Escape', label: 'MENÜ' },
  sound: { code: null, label: 'TON' }
};
const DIR_CODES = { dpad: ['ArrowUp', 'ArrowLeft', 'ArrowDown', 'ArrowRight'], lr: ['ArrowLeft', 'ArrowRight'], ud: ['ArrowUp', 'ArrowDown'] };

let padCtrls = [];
const padTouches = new Map();   // pointerId -> { ctrl, code }
const padCount = new Map();     // Tastencode -> Anzahl drückender Finger

function buildPad() {
  padCtrls = [];
  if (!padArea) return;
  const lay = PAD_LAYOUTS[current && current.id] || PAD_LAYOUTS.menu;
  let L, Rt;
  const sys = lay.system.map(k => SYS_BTN[k]);
  if (padArea.mode === 'side') {
    const l = padArea.left, r = padArea.right;
    const R = Math.max(12, Math.min(l.w * 0.4, l.h * 0.2, 130));
    L = { x: l.x + l.w / 2, y: l.y + l.h * 0.64, R };
    Rt = { x: r.x + r.w / 2, y: r.y + r.h * 0.64, R };
    // Systemtasten oben: erste Hälfte links, zweite Hälfte rechts
    const half = Math.ceil(sys.length / 2), bh = 44, bw = Math.min(120, l.w * 0.75);
    sys.forEach((b, i) => {
      const panel = i < half ? l : r, k = i < half ? i : i - half;
      padCtrls.push({ kind: 'sys', ...b, x: panel.x + panel.w / 2, y: panel.y + 34 + k * (bh + 12), w: bw, h: bh });
    });
  } else {
    const a = padArea.area;
    // Platz für die mittlere Spalte; nie kleiner als 12 px (sehr kleine Fenster beim Drehen o. Ä.)
    const R = Math.max(12, Math.min(a.w * 0.19, a.h * 0.36, 130, (a.w - 74) / 4.85));
    const off = Math.max(R * 1.25, a.w * 0.2);
    L = { x: a.x + off, y: a.y + a.h * 0.5, R };
    Rt = { x: a.x + a.w - off, y: a.y + a.h * 0.5, R };
    // Systemtasten in der Mitte übereinander
    const colW = (Rt.x - Rt.R * 1.1) - (L.x + L.R * 1.25) - 8;
    const bw = Math.max(54, Math.min(120, colW)), gap = 8;
    const bh = Math.max(30, Math.min(44, (a.h - 16 - gap * (sys.length - 1)) / Math.max(1, sys.length)));
    const y0 = a.y + a.h * 0.5 - (sys.length * bh + (sys.length - 1) * gap) / 2 + bh / 2;
    sys.forEach((b, i) => padCtrls.push({ kind: 'sys', ...b, x: a.x + a.w / 2, y: y0 + i * (bh + gap), w: bw, h: bh }));
  }
  padCtrls.push({ kind: lay.cluster, x: L.x, y: L.y, R: L.R });
  const n = lay.buttons.length, R = Rt.R;
  const spots = n === 1 ? [[0, 0, 0.62]]
    : n === 2 ? [[0.38, -0.4, 0.5], [-0.42, 0.45, 0.42]]
    : n === 3 ? [[0, -0.6, 0.38], [-0.55, 0.38, 0.38], [0.55, 0.38, 0.38]]
    : [[0, -0.66, 0.36], [-0.66, 0, 0.36], [0, 0.66, 0.36], [0.66, 0, 0.36]];
  lay.buttons.forEach((b, i) => {
    const [dx, dy, rr] = spots[i];
    padCtrls.push({ kind: 'btn', ...b, x: Rt.x + dx * R, y: Rt.y + dy * R, r: rr * R });
  });
}

function padHit(x, y) {
  for (const c of padCtrls) {
    if (c.kind === 'sys') {
      if (Math.abs(x - c.x) <= c.w / 2 + 6 && Math.abs(y - c.y) <= c.h / 2 + 6) return c;
    } else if (c.kind === 'btn') {
      if (Math.hypot(x - c.x, y - c.y) <= c.r * 1.15) return c;
    }
  }
  for (const c of padCtrls) {
    if (c.kind === 'dpad' && Math.hypot(x - c.x, y - c.y) <= c.R * 1.3) return c;
    if (c.kind === 'lr' && Math.abs(x - c.x) <= c.R * 1.3 && Math.abs(y - c.y) <= c.R) return c;
    if (c.kind === 'ud' && Math.abs(y - c.y) <= c.R * 1.3 && Math.abs(x - c.x) <= c.R) return c;
  }
  return null;
}

// Richtung unter dem Finger (der Finger darf über den Rand hinausrutschen)
function clusterCode(c, x, y) {
  const dx = x - c.x, dy = y - c.y;
  if (c.kind === 'dpad') {
    if (Math.hypot(dx, dy) < c.R * 0.18) return null;
    return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'ArrowLeft' : 'ArrowRight') : (dy < 0 ? 'ArrowUp' : 'ArrowDown');
  }
  if (c.kind === 'lr') return Math.abs(dx) < c.R * 0.06 ? null : (dx < 0 ? 'ArrowLeft' : 'ArrowRight');
  return Math.abs(dy) < c.R * 0.06 ? null : (dy < 0 ? 'ArrowUp' : 'ArrowDown');
}

function sendKey(down, code) {
  const ev = {
    code, key: code, repeat: false, synthetic: true,
    shiftKey: false, ctrlKey: false, altKey: false, metaKey: false,
    defaultPrevented: false, preventDefault() { this.defaultPrevented = true; }
  };
  safely(() => (down ? current.onKeyDown(ev) : current.onKeyUp(ev)));
}
function padPress(code) {
  const n = (padCount.get(code) || 0) + 1;
  padCount.set(code, n);
  if (n === 1) sendKey(true, code);
}
function padRelease(code) {
  const n = (padCount.get(code) || 0) - 1;
  if (n > 0) { padCount.set(code, n); return; }
  if (padCount.delete(code)) sendKey(false, code);
}
function padDown(id, x, y) {
  const c = padHit(x, y);
  if (!c) return false;
  let code = null;
  if (c.kind === 'sys' && c.label === 'TON') Core.toggleMute();
  else code = c.code || clusterCode(c, x, y);
  padTouches.set(id, { ctrl: c, code });
  if (code) padPress(code);
  return true;
}
function padMove(id, x, y) {
  const t = padTouches.get(id);
  if (t && t.ctrl && t.ctrl.kind === 'btn') {
    // Aktionstasten: optional auf eine weitere Taste rollen (beide bleiben gedrückt)
    const lay = PAD_LAYOUTS[current && current.id];
    const c = lay && lay.slide ? padHit(x, y) : null;
    if (c && c.kind === 'btn' && c.code !== t.code && !(t.extra && t.extra.includes(c.code))) {
      (t.extra = t.extra || []).push(c.code);
      padPress(c.code);
    }
    return;
  }
  if (!t || !t.ctrl || !DIR_CODES[t.ctrl.kind]) return;
  const code = clusterCode(t.ctrl, x, y);
  if (code === t.code) return;
  if (t.code) padRelease(t.code);
  t.code = code;
  if (code) padPress(code);
}
function padUp(id) {
  const t = padTouches.get(id);
  padTouches.delete(id);
  if (t && t.ctrl && t.code) padRelease(t.code);
  if (t && t.ctrl && t.extra) t.extra.forEach(padRelease);
}
// Beim Spielwechsel: gedrückte Finger zählen nicht mehr (kein Keyup an das neue Modul)
function padReset() {
  padCount.clear();
  for (const t of padTouches.values()) { t.ctrl = null; t.code = null; t.extra = null; }
}

function drawPad() {
  if (!padArea) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineJoin = 'round';
  const pressed = code => padCount.has(code);
  const label = (txt, x, y, w, color, max = 13) => {
    const size = Math.max(6, Math.min(max, (w - 8) / txt.length));
    drawText(txt, x, y - size * 0.44, color, size, 'center');
  };
  const tri = (x, y, s, dir, color) => {
    const [ux, uy] = [[0, -1], [-1, 0], [0, 1], [1, 0]][dir];
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + ux * s, y + uy * s);
    ctx.lineTo(x - ux * s * 0.6 + uy * s * 0.8, y - uy * s * 0.6 - ux * s * 0.8);
    ctx.lineTo(x - ux * s * 0.6 - uy * s * 0.8, y - uy * s * 0.6 + ux * s * 0.8);
    ctx.closePath();
    ctx.fill();
  };
  const outline = (lw, color) => { ctx.lineWidth = lw; ctx.strokeStyle = color; ctx.stroke(); };
  for (const c of padCtrls) {
    if (c.kind === 'sys') {
      const on = c.code && pressed(c.code);
      roundRectPath(ctx, c.x - c.w / 2, c.y - c.h / 2, c.w, c.h, c.h / 2);
      ctx.fillStyle = on ? 'rgba(33,33,255,0.6)' : '#000';
      ctx.fill();
      outline(2.5, '#2121ff');
      const txt = c.label === 'TON' ? (AudioCore.muted() ? 'TON AUS' : 'TON AN') : c.label;
      label(txt, c.x, c.y, c.w, '#ffffff', 12);
    } else if (c.kind === 'btn') {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fillStyle = pressed(c.code) ? c.color : '#000';
      ctx.globalAlpha = pressed(c.code) ? 0.45 : 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      outline(3, c.color);
      if (c.r > 10) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r - 6, 0, Math.PI * 2);
        outline(1.5, c.color);
      }
      if (c.icon) {
        // Drehpfeil im oder gegen den Uhrzeigersinn
        const cw = c.icon === 'cw', rr = c.r * 0.42;
        ctx.beginPath();
        const end = cw ? Math.PI * 0.4 : Math.PI * 0.6;
        ctx.arc(c.x, c.y, rr, cw ? -Math.PI * 0.9 : -Math.PI * 0.1, end, !cw);
        outline(Math.max(3, c.r * 0.1), '#ffffff');
        const ex = c.x + Math.cos(end) * rr, ey = c.y + Math.sin(end) * rr;
        tri(ex, ey, c.r * 0.2, cw ? 1 : 3, '#ffffff');
      } else {
        label(c.label, c.x, c.y, c.r * 1.7, '#ffffff', 14);
      }
    } else if (c.kind === 'dpad') {
      const R = c.R, a = R * 0.33;
      const pts = [[-a, -R], [a, -R], [a, -a], [R, -a], [R, a], [a, a], [a, R], [-a, R], [-a, a], [-R, a], [-R, -a], [-a, -a]];
      ctx.beginPath();
      pts.forEach(([px, py], i) => (i ? ctx.lineTo(c.x + px, c.y + py) : ctx.moveTo(c.x + px, c.y + py)));
      ctx.closePath();
      ctx.fillStyle = '#000';
      ctx.fill();
      outline(3, '#2121ff');
      const arms = [[0, -R * 0.62], [-R * 0.62, 0], [0, R * 0.62], [R * 0.62, 0]];
      DIR_CODES.dpad.forEach((code, d) => {
        const [ax, ay] = arms[d];
        if (pressed(code)) {
          ctx.fillStyle = 'rgba(33,33,255,0.6)';
          ctx.fillRect(c.x + ax - a + 3, c.y + ay - a + 3, 2 * a - 6, 2 * a - 6);
        }
        tri(c.x + ax, c.y + ay, R * 0.2, d, '#ffff00');
      });
    } else {
      // Zweier-Tasten (links/rechts oder hoch/runter)
      const horiz = c.kind === 'lr', R = c.R;
      DIR_CODES[c.kind].forEach((code, i) => {
        const sgn = i === 0 ? -1 : 1;
        const cx = c.x + (horiz ? sgn * R * 0.56 : 0), cy = c.y + (horiz ? 0 : sgn * R * 0.56);
        const w = horiz ? R * 0.98 : R * 1.3, h = horiz ? R * 1.3 : R * 0.98;
        roundRectPath(ctx, cx - w / 2, cy - h / 2, w, h, R * 0.22);
        ctx.fillStyle = pressed(code) ? 'rgba(33,33,255,0.6)' : '#000';
        ctx.fill();
        outline(3, '#2121ff');
        tri(cx, cy, R * 0.24, horiz ? (i === 0 ? 1 : 3) : (i === 0 ? 0 : 2), '#ffff00');
      });
    }
  }
}

// ============================================================
//  CORE – Modulwechsel, Eingabe-Verteilung, Hauptschleife
// ============================================================
let switching = false;
function switchTo(mod) {
  if (mod === current || switching) return;
  switching = true;
  try {
    padReset();
    if (current) current.exit();
    current = mod;
    current.enter();
    buildPad();
  } finally {
    switching = false;
  }
}

function drawToast() {
  const w = toastMsg.text.length * 0.8 + 1.2;
  ctx.fillStyle = '#000';
  ctx.fillRect(14 - w / 2, 1.7, w, 1.2);
  drawText(toastMsg.text, 14, 1.95, '#ffff00', 0.8, 'center');
}

// Fehler eines Moduls sollen die Hauptschleife nicht anhalten
let errorShown = false;
function safely(fn) {
  try { fn(); } catch (err) {
    if (!errorShown) { errorShown = true; console.error(err); }
  }
}

const NAV_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space']);
window.addEventListener('keydown', e => {
  AudioCore.init();
  if (e.metaKey || e.altKey) return;            // Browser-Kürzel nicht abfangen
  if (e.code === 'KeyM') {
    if (!e.repeat) Core.toggleMute();
    e.preventDefault();
    return;
  }
  let handled = false;
  safely(() => { handled = current.onKeyDown(e); });
  if (handled || NAV_KEYS.has(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  safely(() => current.onKeyUp(e));
});

// Zeiger: Gamepad-Bereich (CSS-Pixel) oder Spielfläche (Einheiten)
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const k = canvas.width / (r.width || 1);
  return { cx, cy, ux: (cx * k - VIEW.x) / SCALE, uy: (cy * k - VIEW.y) / SCALE };
}
const POINTER_TYPES = { pointerdown: 'down', pointermove: 'move', pointerup: 'up', pointercancel: 'cancel' };
for (const ev of Object.keys(POINTER_TYPES)) {
  window.addEventListener(ev, e => {
    const type = POINTER_TYPES[ev];
    if (type === 'down' || type === 'up') AudioCore.init();
    if (type === 'down' && e.button > 0) return;   // nur Haupttaste / Finger
    if (type === 'down' && (e.pointerType === 'touch' || e.pointerType === 'pen') && !touchUI && touchForced !== '0') {
      touchUI = true;                               // Touchscreen entdeckt: Gamepad einblenden
      resize();
    }
    const p = pointerPos(e);
    if (type === 'down') {
      if (padArea && padDown(e.pointerId, p.cx, p.cy)) return;
      // Finger im Gamepad-Bereich, aber neben einer Taste: nicht an das Spiel weitergeben
      if (padArea && (p.ux < 0 || p.ux > COLS || p.uy < 0 || p.uy > ROWS)) {
        padTouches.set(e.pointerId, { ctrl: null, code: null });
        return;
      }
    } else if (padTouches.has(e.pointerId)) {
      if (type === 'move') padMove(e.pointerId, p.cx, p.cy);
      else padUp(e.pointerId);
      return;
    }
    safely(() => current.onPointer(type, p.ux, p.uy, e.pointerId));
  });
}
// Kein Scrollen, Zoomen oder Kontextmenü auf Mobilgeräten
const block = e => { if (e.cancelable) e.preventDefault(); };
document.addEventListener('touchstart', block, { passive: false });
document.addEventListener('touchmove', block, { passive: false });
document.addEventListener('touchend', e => { AudioCore.init(); block(e); }, { passive: false });
document.addEventListener('gesturestart', block, { passive: false });
document.addEventListener('contextmenu', block);

window.addEventListener('blur', () => { safely(() => current.onBlur()); padReset(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { safely(() => current.onBlur()); padReset(); }
});
window.addEventListener('resize', resize);
resizeHooks.push(buildPad);

// Feste 60 Updates pro Sekunde, gezeichnet wird einmal pro Bildschirm-Frame
switchTo(Launcher);
resize();

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(now - last, 250);
  last = now;
  while (acc >= STEP) {
    acc -= STEP;
    tick++;
    if (toastMsg && --toastMsg.t <= 0) toastMsg = null;
    safely(() => current.update());
    safely(Host.step);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(SCALE, 0, 0, SCALE, VIEW.x, VIEW.y);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, COLS, ROWS);
  ctx.clip();
  safely(() => current.draw());
  ctx.restore();
  ctx.setTransform(SCALE, 0, 0, SCALE, VIEW.x, VIEW.y);
  ctx.globalAlpha = 1;
  if (toastMsg) drawToast();
  safely(drawPad);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
Host.ready();
})();
</script>
</body>
