  // ------------------------------------------------------------
  //  Noten einlesen: je Spur ein Ereignis pro Sechzehntel
  // ------------------------------------------------------------
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function parseTrack(str) {
    const toks = str.replace(/\|/g, ' ').trim().split(/\s+/);
    const at = new Array(toks.length).fill(null);
    const bad = [];
    let last = null;
    toks.forEach((tk, i) => {
      if (tk === '-') { if (last) last.len++; return; }
      last = null;
      if (tk === '.') return;
      if (tk === 'k' || tk === 's' || tk === 'h') { at[i] = { d: tk, len: 1 }; return; }
      const m = /^([A-G])([#b]?)(\d)$/.exec(tk);
      if (!m) { bad.push(tk); return; }
      last = { m: 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0), len: 1 };
      at[i] = last;
    });
    return { at, len: toks.length, bad };
  }
  const SONG = {};
  for (const k in SONGS) {
    const d = SONGS[k];
    const tracks = d.tracks.map(t => Object.assign({ w: t.w, v: t.v }, parseTrack(t.n)));
    SONG[k] = { bpm: d.bpm, loop: d.loop, tracks, len: tracks[0].len };
  }

  // ------------------------------------------------------------
  //  Sound: Sequenzer mit Vorausplanung, Jingles, Effekte
  // ------------------------------------------------------------
  let quiet = false;                 // Vorführung auf dem Titel bleibt stumm
  // Klangzustand: Musikbus, Effektbus, gewünschtes Stück
  const snd = { bus: null, fxBus: null, want: null };
  const Snd = (() => {
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const LOOKAHEAD = 0.25, MUSIC_VOL = 0.6;

    let ac = null, noise = null;
    let song = null, step = 0, nextT = 0, hurry = false, paused = false;
    const dying = [];

    function ctxOk() {
      const c = Core.audio.ctx;
      if (!c || !Core.audio.master) return null;
      if (c !== ac) { ac = c; snd.bus = null; snd.fxBus = null; noise = null; dying.length = 0; }
      return c;
    }
    function noiseBuf() {
      if (!noise) {
        const n = Math.floor(ac.sampleRate * 0.5);
        noise = ac.createBuffer(1, n, ac.sampleRate);
        const d = noise.getChannelData(0);
        let r = 12345;
        for (let i = 0; i < n; i++) { r = (r * 1103515245 + 12345) & 0x7fffffff; d[i] = r / 0x3fffffff - 1; }
      }
      return noise;
    }
    function dropBus(fade) {
      if (!snd.bus) return;
      const t = ac.currentTime;
      snd.bus.gain.cancelScheduledValues(t);
      if (fade) {
        snd.bus.gain.setValueAtTime(snd.bus.gain.value, t);
        snd.bus.gain.linearRampToValueAtTime(0, t + 0.05);
        dying.push({ g: snd.bus, t: t + 0.4 });
      } else {
        snd.bus.gain.setValueAtTime(0, t);
        snd.bus.disconnect();
      }
      snd.bus = null;
    }
    // eigener Effektkanal, damit beim Verlassen alles sofort verstummt
    function sfxOut() {
      if (!snd.fxBus) {
        snd.fxBus = ac.createGain();
        snd.fxBus.gain.setValueAtTime(1, ac.currentTime);
        snd.fxBus.connect(Core.audio.master);
      }
      return snd.fxBus;
    }
    function tone(type, f0, f1, dur, vol, delay) {
      const t = ac.currentTime + Math.max(0, delay || 0);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.006);
      g.gain.setValueAtTime(vol, t + dur * 0.75);
      g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(sfxOut());
      o.start(t); o.stop(t + dur + 0.05);
    }
    function openBus() {
      snd.bus = ac.createGain();
      snd.bus.gain.setValueAtTime(MUSIC_VOL, ac.currentTime);
      snd.bus.connect(Core.audio.master);
      nextT = ac.currentTime + 0.05;
    }

    // Instrumente
    function voice(type, f, t, dur, vol, dest) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      const d = Math.max(0.04, dur);
      const a = t + 0.004, dec = t + Math.min(0.08, d * 0.5), rel = t + Math.max(d * 0.5, d - 0.03);
      const sus = type === 'square' ? vol * 0.6 : vol * 0.85;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, a);
      g.gain.linearRampToValueAtTime(sus, dec);
      g.gain.setValueAtTime(sus, rel);
      g.gain.linearRampToValueAtTime(0, t + d);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + d + 0.02);
    }
    function noiseHit(t, dur, vol, hp, dest) {
      const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
      s.buffer = noiseBuf();
      f.type = 'highpass';
      f.frequency.setValueAtTime(hp, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.linearRampToValueAtTime(0, t + dur);
      s.connect(f); f.connect(g); g.connect(dest);
      s.start(t); s.stop(t + dur + 0.02);
    }
    function kick(t, vol, dest) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.09);
      g.gain.setValueAtTime(vol * 1.4, t);
      g.gain.linearRampToValueAtTime(0, t + 0.11);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + 0.13);
    }

    function playStep(i, t, sd) {
      for (const tr of song.tracks) {
        const e = tr.at[i];
        if (!e) continue;
        if (tr.w === 'drum') {
          if (e.d === 'k') kick(t, tr.v, snd.bus);
          else if (e.d === 's') noiseHit(t, 0.09, tr.v * 0.7, 1200, snd.bus);
          else noiseHit(t, 0.035, tr.v * 0.4, 7000, snd.bus);
        } else voice(tr.w, mtof(e.m), t, e.len * sd * 0.92, tr.v, snd.bus);
      }
    }

    function schedule() {
      const now = ac.currentTime;
      if (nextT < now - 0.2) nextT = now + 0.02;      // nach Hängern nicht nachholen
      while (snd.want && nextT < now + LOOKAHEAD) {
        const sd = 15 / song.bpm / (hurry && song.loop ? 1.25 : 1);
        playStep(step, nextT, sd);
        nextT += sd;
        if (++step >= song.len) {
          step = 0;
          if (!song.loop) { snd.want = null; break; }
        }
      }
    }

    function begin(key) {
      snd.want = key; song = SONG[key]; step = 0;
      if (!ctxOk() || paused) return;
      dropBus(true);
      openBus();
      schedule();
    }

    // Effekte: [Welle, f0, f1, Dauer, Lautstärke, Verzögerung]
    const T1 = (a, b, c, d, e, f) => tone(a, b, c, d, e, f || 0);
    const SFX = {
      jump() { T1('square', 280, 620, 0.14, 0.05); },
      jumpBig() { T1('square', 200, 470, 0.17, 0.055); },
      stomp() { T1('triangle', 520, 140, 0.1, 0.32); noiseHit(ac.currentTime, 0.05, 0.12, 2500, sfxOut()); },
      coin() { T1('square', 1047, 1047, 0.05, 0.045); T1('square', 1568, 1568, 0.22, 0.045, 0.05); },
      bump() { T1('triangle', 170, 90, 0.08, 0.32); },
      break() {
        T1('triangle', 260, 60, 0.15, 0.3);
        noiseHit(ac.currentTime, 0.22, 0.22, 800, sfxOut());
      },
      item() { for (let i = 0; i < 4; i++) T1('triangle', 330 + i * 140, 420 + i * 160, 0.06, 0.26, i * 0.06); },
      grow() { [0, 4, 7, 12, 16, 19, 24].forEach((n, i) => T1('square', mtof(60 + n), mtof(60 + n), 0.06, 0.05, i * 0.055)); },
      shrink() { [24, 19, 15, 12, 7, 3, 0].forEach((n, i) => T1('square', mtof(60 + n), mtof(60 + n), 0.06, 0.045, i * 0.06)); },
      fire() { T1('square', 900, 260, 0.08, 0.04); },
      kick() { T1('square', 420, 980, 0.06, 0.05); },
      oneup() { [0, 7, 12, 16, 19, 24].forEach((n, i) => T1('square', mtof(72 + n), mtof(72 + n), 0.07, 0.045, i * 0.08)); },
      flag() { T1('triangle', 1400, 220, 1.0, 0.25); T1('square', 700, 110, 1.0, 0.025); },
      tick() { T1('square', 1500, 1500, 0.025, 0.03); },
      hurry() {
        for (let i = 0; i < 3; i++) {
          T1('square', 1320, 1320, 0.07, 0.05, i * 0.16);
          T1('square', 1760, 1760, 0.05, 0.04, i * 0.16 + 0.07);
        }
      },
      thud() { T1('triangle', 220, 80, 0.06, 0.25); },
      bossHit() { T1('square', 240, 70, 0.25, 0.06); T1('triangle', 120, 50, 0.3, 0.3); },
      bossDown() { for (let i = 0; i < 6; i++) T1('square', 400 - i * 50, 100, 0.12, 0.05, i * 0.1); },
      roar() { T1('sawtooth', 130, 70, 0.35, 0.05); noiseHit(ac.currentTime, 0.3, 0.1, 400, sfxOut()); },
      lever() { T1('triangle', 300, 900, 0.2, 0.3); },
      crumble() { noiseHit(ac.currentTime, 0.08, 0.12, 600, sfxOut()); },
      check() { T1('triangle', 880, 880, 0.08, 0.28); T1('triangle', 1320, 1320, 0.16, 0.28, 0.08); },
      boom() { noiseHit(ac.currentTime, 0.35, 0.25, 200, sfxOut()); T1('triangle', 140, 40, 0.3, 0.3); },
      select() { T1('square', 660, 660, 0.04, 0.04); },
      pause() { T1('square', 880, 440, 0.08, 0.04); }
    };

    return {
      music(key) { if (!quiet && (snd.want !== key || !snd.bus)) begin(key); },
      jingle(key) { if (!quiet) begin(key); },
      stop() { if (quiet) return; snd.want = null; hurry = false; if (ctxOk()) dropBus(true); },
      setHurry(on) { if (!quiet) hurry = !!on; },
      pause() { paused = true; if (ctxOk()) dropBus(true); },
      resume() {
        paused = false;
        if (snd.want && ctxOk()) { dropBus(true); openBus(); schedule(); }
      },
      sfx(name) {
        if (quiet || paused || !ctxOk() || !SFX[name]) return;
        SFX[name]();
      },
      tick() {
        const c = ctxOk();
        if (!c) return;
        for (let i = dying.length - 1; i >= 0; i--) {
          if (c.currentTime >= dying[i].t) { dying[i].g.disconnect(); dying.splice(i, 1); }
        }
        if (!snd.want || paused) return;
        if (!snd.bus) openBus();
        schedule();
      },
      shutdown() {
        snd.want = null; paused = false; hurry = false;
        if (ctxOk()) {
          dropBus(false);
          for (const d of dying) {
            d.g.gain.cancelScheduledValues(ac.currentTime);
            d.g.gain.setValueAtTime(0, ac.currentTime);
            d.g.disconnect();
          }
          if (snd.fxBus) {
            snd.fxBus.gain.cancelScheduledValues(ac.currentTime);
            snd.fxBus.gain.setValueAtTime(0, ac.currentTime);
            snd.fxBus.disconnect();
            snd.fxBus = null;
          }
        }
        dying.length = 0;
      }
    };
  })();

  // ------------------------------------------------------------
  //  Spielzustand (reines Datenobjekt, klonbar)
  // ------------------------------------------------------------
  let S = null;
  let A = null;          // Zustand der Vorführung auf dem Titel
  let hi = 0;
  const fx = [];         // Partikel und Punkteanzeigen (nur Optik)

  function newState() {
    return {
      mode: 'title', modeT: 0, t: 0, pausedFrom: null, pauseSel: 0, lock: 0,
      sel: 0, lvl: 0, li: 0, loop: 0, diff: 1,
      score: 0, coins: 0, lives: 3, hiOld: 0, newHi: false, keepPower: 0, check: false,
      held: {}, ptrs: {}, jumpBuf: 0, fireReq: false, auto: null, autoJ: 0,
      W: 0, map: null, ents: [], balls: [], spawnIdx: 0, hero: null,
      camX: 0, time: 0, timeT: 0, hurry: false, lt: 0, freeze: 0, combo: 0,
      multi: {}, cl: null, dieKind: '', bossDown: false, startTime: 0
    };
  }

  function newHero(x, y, power) {
    return {
      x, y, w: HERO_W, h: power ? BIG_H : SMALL_H, vx: 0, vy: 0, face: 1, onGround: false,
      coyote: 0, jumping: false, power, duck: false, inv: 0, star: 0, starCombo: 0, skid: false, anim: 0,
      plat: -1, throwT: 0, dead: false, hidden: false, grow: 0, growFrom: 0
    };
  }

  // ------------------------------------------------------------
  //  Kartenzugriff und Kollision
  // ------------------------------------------------------------
  function tileAt(tx, ty) {
    if (ty < 0 || ty >= MAP_H) return T.AIR;
    if (tx < 0 || tx >= S.W) return T.HARD;
    return S.map[ty * S.W + tx];
  }
  function setTile(tx, ty, k) {
    if (tx >= 0 && tx < S.W && ty >= 0 && ty < MAP_H) S.map[ty * S.W + tx] = k;
  }
  const solidAt = (tx, ty) => SOLID[tileAt(tx, ty)] === 1;
  function solidOrSemi(tx, ty) { const k = tileAt(tx, ty); return SOLID[k] === 1 || k === T.SEMI; }
  function boxFree(x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 0.01) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 0.01) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) return false;
    return true;
  }

  // Bewegung mit Kachelkollision (achsengetrennt, Schritte < 1 Kachel)
  function moveX(b, dx) {
    if (dx === 0) return false;
    b.x += dx;
    const y0 = Math.floor(b.y / TILE), y1 = Math.floor((b.y + b.h - 0.01) / TILE);
    if (dx > 0) {
      const tx = Math.floor((b.x + b.w - 0.01) / TILE);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = tx * TILE - b.w; return true; }
    } else {
      const tx = Math.floor(b.x / TILE);
      for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = (tx + 1) * TILE; return true; }
    }
    return false;
  }
  // 1 = gelandet, -1 = Decke, 0 = frei
  function moveY(b, dy) {
    if (dy === 0) return 0;
    const pb = b.y + b.h;
    b.y += dy;
    const x0 = Math.floor(b.x / TILE), x1 = Math.floor((b.x + b.w - 0.01) / TILE);
    if (dy > 0) {
      const ty = Math.floor((b.y + b.h - 0.01) / TILE), top = ty * TILE;
      for (let tx = x0; tx <= x1; tx++) {
        const k = tileAt(tx, ty);
        if (SOLID[k] || (k === T.SEMI && pb <= top + 0.01)) { b.y = top - b.h; return 1; }
      }
    } else {
      const ty = Math.floor(b.y / TILE);
      for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { b.y = (ty + 1) * TILE; return -1; }
    }
    return 0;
  }
  // Held: wie moveX, aber knapp gestreifte Kanten werden überstiegen (kein Hängenbleiben)
  function heroMoveX(h, dx) {
    if (dx === 0) return false;
    const ox = h.x;
    if (!moveX(h, dx)) return false;
    if (h.vy >= 0) {
      const y1 = Math.floor((h.y + h.h - 0.01) / TILE);
      const pen = h.y + h.h - y1 * TILE;
      if (pen > 0 && pen <= 4 && boxFree(ox + dx, h.y - pen, h.w, h.h)) {
        h.x = ox + dx;
        h.y -= pen;
        return false;
      }
    }
    return true;
  }

  // ------------------------------------------------------------
  //  Punkte, Leben, Effekte
  // ------------------------------------------------------------
  function popup(text, x, y, color) {
    // nicht übereinander: frische Anzeige an fast derselben Stelle -> eine Zeile höher
    for (let i = 0; i < fx.length; i++) {
      const p = fx[i];
      if (p.k === 'pop' && p.t < 30 && Math.abs(p.x - x) < 16 && Math.abs(p.y - y) < 8) { y = p.y - 9; i = -1; }
    }
    fx.push({ k: 'pop', text: String(text), x, y, t: 0, life: 50, c: color || '#ffffff' });
  }
  function addScore(n, x, y) {
    S.score += n;
    if (x !== undefined) popup(n, x, y);
  }
  function oneUp(x, y) {
    S.lives = Math.min(99, S.lives + 1);
    Snd.sfx('oneup');
    if (x !== undefined) popup('1UP', x, y, '#7cff6b');
  }
  function comboScore(i, x, y) {
    if (i < COMBO.length) addScore(COMBO[i], x, y); else oneUp(x, y);
  }
  function addCoin(x, y) {
    S.coins++;
    S.score += 200;
    Snd.sfx('coin');
    if (S.coins >= 100) { S.coins -= 100; oneUp(x, y); }
  }
  function particle(kind, x, y, vx, vy, life, c) { fx.push({ k: kind, x, y, vx, vy, t: 0, life, c }); }

  // ------------------------------------------------------------
  //  Level laden
  // ------------------------------------------------------------
  function levelTime(li, loop) {
    if (li < 0) return 999;
    const d = LEVELS[li].def;
    return Math.max(d.minTime || 150, d.time - loop * 40);
  }

  function loadLevel(li, atCheck) {
    const L = li < 0 ? ATTRACT : LEVELS[li];
    S.li = li;
    S.loop = Math.floor(S.lvl / NUM_LEVELS);
    S.diff = Math.min(2, 1 + S.loop * 0.25);
    S.W = L.W;
    S.map = L.map.slice();
    S.ents = []; S.balls = []; S.multi = {};
    S.freeze = 0; S.combo = 0; S.cl = null; S.lt = 0; S.hurry = false; S.bossDown = false;
    S.time = levelTime(li, S.loop); S.timeT = 0; S.startTime = S.time;
    S.jumpBuf = 0; S.fireReq = false; S.auto = null;
    const st = atCheck && L.check ? L.check : L.start;
    const p = S.keepPower;
    S.hero = newHero(st.x * TILE + 2, (st.y + 1) * TILE - (p ? BIG_H : SMALL_H), p);
    S.camX = clamp(S.hero.x + S.hero.w / 2 - CAM_LEAD, 0, S.W * TILE - VIEW_W);
    S.spawnIdx = 0;
    // Figuren links vom Bild entfallen (Neustart an der Zwischenfahne)
    while (S.spawnIdx < L.spawns.length && (L.spawns[S.spawnIdx].x + 1) * TILE <= S.camX) S.spawnIdx++;
    fx.length = 0;
  }

  // ------------------------------------------------------------
  //  Figuren erzeugen
  // ------------------------------------------------------------
  function spawnActors() {
    const L = lev();
    while (S.spawnIdx < L.spawns.length && L.spawns[S.spawnIdx].x * TILE < S.camX + VIEW_W + 2 * TILE) {
      makeActor(L.spawns[S.spawnIdx]);
      S.spawnIdx++;
    }
  }

  function makeActor(sp) {
    const x = sp.x * TILE, y = sp.y * TILE, d = S.diff;
    const base = { vx: 0, vy: 0, st: 'walk', tm: 0, onGround: false, dead: false, gone: false, anim: 0, face: -1 };
    let e = null;
    switch (sp.t) {
      case 'knuff':
        e = { t: 'knuff', x: x + 1, y: y + 2, w: 14, h: 14, vx: -0.5 * d, enemy: true, stomp: true };
        break;
      case 'beetle': case 'beetleR':
        e = { t: 'beetle', x: x + 1, y: y + 2, w: 14, h: 14, vx: -0.5 * d, enemy: true, stomp: true,
          ledge: sp.t === 'beetleR', red: sp.t === 'beetleR' };
        break;
      case 'bee':
        e = { t: 'bee', x: x + 1, y: y + 2, w: 14, h: 12, vx: -0.55 * Math.min(1.5, d), by: y + 2,
          ph: sp.x * 0.7, enemy: true, stomp: true };
        break;
      case 'hopbee':
        e = { t: 'bee', hop: true, x: x + 1, y: y + 2, w: 14, h: 12, vx: -0.6 * Math.min(1.5, d),
          enemy: true, stomp: true };
        break;
      case 'plant':
        e = { t: 'plant', x: x + TILE - 6, y: y + TILE, w: 12, h: 0, base: y + TILE, st: 'hide',
          tm: 40, enemy: true };
        break;
      case 'fish':
        e = { t: 'fish', x: x + 2, y: y + 20, w: 12, h: 12, base: y + 20, surf: y + 4, st: 'wait',
          tm: 40 + (sp.x * 37) % 80, enemy: true };
        break;
      case 'firebar':
        e = { t: 'firebar', cx: x + 8, cy: y + 8, n: 6, ang: sp.x * 0.9,
          spd: (sp.x % 2 ? 1 : -1) * 0.03 * Math.min(1.6, d), x: x - 40, y: y - 40, w: 96, h: 96, enemy: true };
        break;
      case 'boss':
        e = { t: 'boss', x: x - 5, y: y - 12, w: 26, h: 28, vx: -0.45, hp: 3 + Math.min(2, S.loop),
          minX: x - 5 * TILE, maxX: x + TILE, fireT: 90, jumpT: 150, hurt: 0, hits: 0, enemy: true,
          stomp: true, awake: false };
        break;
      case 'platH': case 'platV': case 'platF': {
        const kind = sp.t[4].toLowerCase();
        e = { t: 'plat', kind, x, y, w: 3 * TILE, h: 8, x0: x, y0: y, ph: kind === 'h' && sp.x % 2 ? Math.PI : 0,
          dx: 0, dy: 0, plat: true, id: sp.x * 64 + sp.y };
        if (kind === 'h' && sp.x % 2) e.x = x + 80;
        break;
      }
    }
    if (e) S.ents.push(Object.assign(base, e));
    return e;
  }

  function spawnItem(kind, tx, ty) {
    const e = {
      t: 'item', kind, x: tx * TILE + 2, y: ty * TILE, w: 12, h: 12, vx: 0, vy: 0, st: 'rise',
      tm: 0, base: ty * TILE - 13, dir: 1, onGround: false, dead: false, gone: false, anim: 0
    };
    S.ents.push(e);
    Snd.sfx('item');
    return e;
  }

  // ------------------------------------------------------------
  //  Blöcke
  // ------------------------------------------------------------
  function bumpFx(tx, ty) { fx.push({ k: 'bump', tx, ty, t: 0, life: 10, li: S.li }); }

  function hitBlock(tx, ty) {
    const k = tileAt(tx, ty);
    const h = S.hero, big = h.power > 0;
    const cx = (tx + 0.5) * TILE, cy = ty * TILE;
    if (!SOLID[k] && k !== T.HIDDEN) return;
    let bumped = true;
    switch (k) {
      case T.BRICK:
        if (big) {
          setTile(tx, ty, T.AIR);
          for (let i = 0; i < 4; i++) {
            particle('deb', tx * TILE + (i % 2) * 8 + 4, ty * TILE + (i >> 1) * 8 + 4,
              (i % 2 ? 1 : -1) * (1 + (i >> 1) * 0.3), -5 + (i >> 1) * 1.6, 90, S.li);
          }
          addScore(50);
          Snd.sfx('break');
          bumped = false;
        } else Snd.sfx('bump');
        break;
      case T.QCOIN:
        setTile(tx, ty, T.USED);
        coinPop(tx, ty);
        break;
      case T.BCOIN: {
        const key = tx + ',' + ty;
        let m = S.multi[key];
        if (!m) m = S.multi[key] = { n: 0, t0: S.lt };
        m.n++;
        coinPop(tx, ty);
        if (m.n >= 10 || S.lt - m.t0 > 300) setTile(tx, ty, T.USED);
        break;
      }
      case T.QPOW: case T.BPOW:
        setTile(tx, ty, T.USED);
        spawnItem(big ? 'flower' : 'berry', tx, ty);
        break;
      case T.QSTAR: case T.BSTAR:
        setTile(tx, ty, T.USED);
        spawnItem('star', tx, ty);
        break;
      case T.Q1UP: case T.HIDDEN:
        setTile(tx, ty, T.USED);
        spawnItem('clover', tx, ty);
        break;
      default:
        Snd.sfx('bump');
        bumped = false;
    }
    if (bumped || (k === T.BRICK && tileAt(tx, ty) === T.BRICK)) bumpFx(tx, ty);
    // Was oben auf dem Block steht, bekommt einen Stoß
    const zone = { x: tx * TILE, y: cy - 4, w: TILE, h: 4 };
    for (const e of S.ents) {
      if (e.gone || e.dead) continue;
      if (!overlap(zone, e)) continue;
      if (e.enemy && (e.t === 'knuff' || e.t === 'beetle' || e.t === 'bee')) {
        defeat(e, 'flip');
        addScore(100, e.x + e.w / 2, e.y);
        Snd.sfx('kick');
      } else if (e.t === 'item' && e.st !== 'rise') {
        e.vy = -3.5;
        e.dir = e.x + e.w / 2 < cx ? -1 : 1;
      }
    }
    if (tileAt(tx, ty - 1) === T.COIN) {
      setTile(tx, ty - 1, T.AIR);
      coinPop(tx, ty - 1);
    }
  }

  function coinPop(tx, ty) {
    addCoin((tx + 0.5) * TILE, ty * TILE);
    fx.push({ k: 'coin', x: (tx + 0.5) * TILE, y: ty * TILE - 8, vy: -4.5, t: 0, life: 34 });
  }

  // ------------------------------------------------------------
  //  Eingabe
  // ------------------------------------------------------------
  const ACT_KEYS = {
    l: ['ArrowLeft', 'KeyA'], r: ['ArrowRight', 'KeyD'], d: ['ArrowDown', 'KeyS'], u: ['ArrowUp', 'KeyW'],
    j: ['Space', 'KeyK', 'KeyZ', 'KeyY'], x: ['KeyX', 'KeyJ', 'ShiftLeft', 'ShiftRight']
  };
  const KEY_ACT = {};
  for (const a in ACT_KEYS) for (const c of ACT_KEYS[a]) KEY_ACT[c] = a;
  const SYS_KEYS = { Enter: 'start', NumpadEnter: 'start', KeyP: 'pause', Escape: 'esc' };

  function held(a) {
    const codes = ACT_KEYS[a];
    for (let i = 0; i < codes.length; i++) if (S.held[codes[i]]) return true;
    for (const id in S.ptrs) {
      const p = S.ptrs[id];
      if (p.role === a) return true;
    }
    return false;
  }
  function readInput() {
    if (S.auto) return S.auto;
    return { l: held('l'), r: held('r'), d: held('d'), u: held('u'), j: held('j'), x: held('x') };
  }

  // ------------------------------------------------------------
  //  Held
  // ------------------------------------------------------------
  function canStand(h) {
    return boxFree(h.x, h.y + h.h - BIG_H, h.w, BIG_H);
  }
  function setDuck(h, on) {
    if (on === h.duck) return;
    const bottom = h.y + h.h;
    h.duck = on;
    h.h = on ? SMALL_H : BIG_H;
    h.y = bottom - h.h;
  }
  function setPower(p) {
    const h = S.hero, bottom = h.y + h.h;
    const wasBig = h.power > 0;
    h.growFrom = h.power;
    h.power = p;
    if (p > 0 && !wasBig) {
      h.duck = false;
      h.h = BIG_H;
      h.y = bottom - BIG_H;
      if (!canStand(h)) { h.duck = true; h.h = SMALL_H; h.y = bottom - SMALL_H; }
    } else if (p === 0) {
      h.duck = false;
      h.h = SMALL_H;
      h.y = bottom - SMALL_H;
    }
  }

  function hurtHero() {
    const h = S.hero;
    if (h.inv > 0 || h.star > 0 || h.dead || S.mode !== 'play') return;
    if (h.power > 0) {
      setPower(h.power - 1);
      h.inv = INV_T;
      h.grow = -GROW_T;
      S.freeze = GROW_T;
      Snd.sfx('shrink');
    } else killHero('hit');
  }

  function killHero(kind) {
    if (S.mode !== 'play') return;
    const h = S.hero;
    S.mode = 'dying'; S.modeT = 0; S.dieKind = kind;
    h.dead = true; h.vx = 0; h.vy = 0; h.star = 0; h.inv = 0; h.duck = false;
    if (h.power > 0) { h.power = 0; h.y += h.h - SMALL_H; h.h = SMALL_H; }
    S.keepPower = 0;
    Snd.stop();
    Snd.jingle('death');
  }

  // Bewegung des Helden nach oben mit Deckenstößen und Eckenkorrektur
  function heroMoveY(h, dy) {
    if (dy === 0) return 0;
    if (dy > 0) return moveY(h, dy);
    const pt = h.y;
    h.y += dy;
    const ty = Math.floor(h.y / TILE);
    const x0 = Math.floor(h.x / TILE), x1 = Math.floor((h.x + h.w - 0.01) / TILE);
    const blocks = tx => {
      const k = tileAt(tx, ty);
      return SOLID[k] === 1 || (k === T.HIDDEN && pt >= (ty + 1) * TILE - 0.01);
    };
    const b0 = blocks(x0), b1 = x1 !== x0 && blocks(x1);
    if (!b0 && !b1) return 0;
    // Eckenkorrektur: nur knapp gestreift -> seitlich vorbeischieben
    if (x0 !== x1 && b0 !== b1) {
      if (b0) {
        const ov = (x0 + 1) * TILE - h.x;
        if (ov <= 5 && boxFree((x0 + 1) * TILE, h.y, h.w, h.h)) { h.x = (x0 + 1) * TILE; return 0; }
      } else {
        const ov = h.x + h.w - x1 * TILE;
        if (ov <= 5 && x1 * TILE - h.w >= S.camX && boxFree(x1 * TILE - h.w, h.y, h.w, h.h)) { h.x = x1 * TILE - h.w; return 0; }
      }
    }
    h.y = (ty + 1) * TILE;
    const cx = Math.floor((h.x + h.w / 2) / TILE);
    let tx = cx;
    if (!(cx === x0 ? b0 : b1)) tx = b0 ? x0 : x1;
    hitBlock(tx, ty);
    return -1;
  }

  function platById(id) {
    if (id < 0) return null;
    for (const e of S.ents) if (e.plat && e.id === id && !e.gone) return e;
    return null;
  }

  function updHero(inp) {
    const h = S.hero;
    if (h.inv > 0) h.inv--;
    if (h.star > 0 && --h.star === 0) {
      h.starCombo = 0;
      if (S.mode === 'play') Snd.music(themeKey());
    }
    if (h.throwT > 0) h.throwT--;
    // Ducken (nur groß)
    if (h.power > 0 && h.onGround && inp.d && !h.duck) setDuck(h, true);
    else if (h.duck && !inp.d && canStand(h)) setDuck(h, false);
    let dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
    if (h.duck && h.onGround && inp.d) dir = 0;
    // geduckt unter niedriger Decke nur langsam kriechen
    const maxV = h.duck && h.onGround ? CRAWL : inp.x ? RUN : WALK;
    h.skid = false;
    if (dir !== 0) {
      if (h.vx * dir < 0) {
        h.vx += dir * (h.onGround ? SKID : ACC_AIR);
        if (h.onGround && Math.abs(h.vx) > 0.4) h.skid = true;
      } else {
        const sp = Math.abs(h.vx);
        if (sp < maxV) h.vx = dir * Math.min(maxV, sp + (h.onGround ? (inp.x ? ACC_R : ACC_W) : ACC_AIR));
        else if (h.onGround) h.vx = dir * Math.max(maxV, sp - FRIC);
      }
      if (h.onGround || h.vx * dir >= 0) h.face = dir;
    } else if (h.onGround) {
      h.vx = approach(h.vx, 0, FRIC);
    }
    // Springen mit Kojotenzeit und Sprungpuffer
    if (h.onGround) h.coyote = COYOTE;
    else if (h.coyote > 0) h.coyote--;
    if (S.jumpBuf > 0 && h.coyote > 0) {
      S.jumpBuf = 0;
      h.coyote = 0;
      h.vy = -(JUMP_V + Math.abs(h.vx) * JUMP_VX);
      h.jumping = true;
      h.onGround = false;
      h.plat = -1;
      Snd.sfx(h.power ? 'jumpBig' : 'jump');
    }
    const g = (h.vy < 0 && h.jumping && inp.j) ? G_HOLD : G_FALL;
    h.vy = Math.min(VMAX, h.vy + g);
    // Plattform trägt den Helden mit
    const feet0 = h.y + h.h;
    const pl = platById(h.plat);
    h.plat = -1;
    if (pl) {
      if (pl.dx) heroMoveX(h, pl.dx);
      if (pl.dy) moveY(h, pl.dy);
    }
    // waagrecht
    if (heroMoveX(h, h.vx)) h.vx = 0;
    // linker Bildrand schiebt mit, aber nie in eine Wand hinein
    if (h.x < S.camX) {
      if (boxFree(S.camX, h.y, h.w, h.h)) h.x = S.camX; else moveX(h, S.camX - h.x);
      if (h.vx < 0) h.vx = 0;
    }
    const maxX = S.W * TILE - h.w;
    if (h.x > maxX) { h.x = maxX; h.vx = 0; }
    // senkrecht
    h.onGround = false;
    const r = heroMoveY(h, h.vy);
    if (r === 1) {
      // Staubwölkchen bei harter Landung
      if (h.vy >= 3.6) {
        for (let i = -1; i <= 1; i += 2) particle('dust', h.x + h.w / 2 + i * 5, h.y + h.h - 2, i * 0.6, -0.25, 14);
      }
      land(h);
    } else if (r === -1) { h.vy = 0; h.jumping = false; }
    if (h.vy >= 0 && !h.onGround) {
      for (const e of S.ents) {
        if (!e.plat || e.gone) continue;
        if (h.x + h.w > e.x && h.x < e.x + e.w && feet0 <= e.y - e.dy + 0.5 && h.y + h.h >= e.y) {
          h.y = e.y - h.h;
          land(h);
          h.plat = e.id;
          if (e.kind === 'f' && e.st !== 'fall') { e.st = 'fall'; e.tm = 0; }
          break;
        }
      }
    }
    if (h.y < -2 * TILE) { h.y = -2 * TILE; if (h.vy < 0) h.vy = 0; }
    // Laufanimation (in der Luft auf Anfang)
    if (h.onGround) {
      h.anim += Math.abs(h.vx) * 0.09 + (Math.abs(h.vx) > 0.05 ? 0.02 : 0);
    } else {
      h.anim = 0.5;
    }
    // Staub beim Rutschen
    if (h.skid && h.onGround && (S.lt & 3) === 0) {
      particle('dust', h.x + h.w / 2 + h.face * 4, h.y + h.h - 2, h.face * 0.3, -0.3, 16);
    }
    // Kacheln berühren: Taler, Lava
    const x0 = Math.floor(h.x / TILE), x1 = Math.floor((h.x + h.w - 0.01) / TILE);
    const y0 = Math.floor(h.y / TILE), y1 = Math.floor((h.y + h.h - 0.01) / TILE);
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const k = tileAt(tx, ty);
        if (k === T.COIN) {
          setTile(tx, ty, T.AIR);
          addCoin();
          fx.push({ k: 'spark', x: (tx + 0.5) * TILE, y: (ty + 0.5) * TILE, t: 0, life: 16 });
        } else if (k === T.LAVA && h.y + h.h > ty * TILE + 6) {
          if (S.mode === 'play') killHero('lava');
          return;
        }
      }
    }
    if (h.y > MAP_H * TILE + 8 && S.mode === 'play') killHero('pit');
  }

  function land(h) {
    h.onGround = true;
    h.vy = 0;
    h.jumping = false;
    S.combo = 0;
  }

  function throwFire() {
    const h = S.hero;
    if (h.power !== 2 || h.duck || S.balls.length >= 2) return false;
    S.balls.push({
      x: h.face > 0 ? h.x + h.w - 2 : h.x - 6, y: h.y + 6, w: 8, h: 8, vx: 4.2 * h.face, vy: 1.5,
      life: 150, dead: false
    });
    h.throwT = 10;
    Snd.sfx('fire');
    return true;
  }

  function updBalls() {
    for (const b of S.balls) {
      if (b.dead) continue;
      b.life--;
      b.vy = Math.min(5, b.vy + 0.35);
      if (moveX(b, b.vx)) { explodeBall(b); continue; }
      const r = moveY(b, b.vy);
      if (r === 1) b.vy = -3.3;
      else if (r === -1) b.vy = 1;
      if (b.life <= 0 || b.x < S.camX - TILE || b.x > S.camX + VIEW_W + TILE || b.y > MAP_H * TILE) {
        b.dead = true;
        continue;
      }
      const ty = Math.floor((b.y + b.h - 1) / TILE);
      if (tileAt(Math.floor((b.x + 4) / TILE), ty) === T.LAVA) { explodeBall(b); continue; }
      for (const e of S.ents) {
        if (e.gone || e.dead || !e.enemy || e.t === 'firebar' || !overlap(b, hitBox(e))) continue;
        if (e.t === 'fish' || e.t === 'flame') { explodeBall(b); break; }
        if (e.t === 'boss') {
          if (e.hurt <= 0 && ++e.hits >= 4) { e.hits = 0; hurtBoss(e); }
          explodeBall(b);
          break;
        }
        defeat(e, 'flip');
        addScore(200, e.x + e.w / 2, e.y);
        Snd.sfx('kick');
        explodeBall(b);
        break;
      }
    }
    S.balls = S.balls.filter(b => !b.dead);
  }
  function explodeBall(b) {
    b.dead = true;
    fx.push({ k: 'puff', x: b.x + 4, y: b.y + 4, t: 0, life: 12 });
    Snd.sfx('thud');
  }

  // ------------------------------------------------------------
  //  Gegner und Gegenstände
  // ------------------------------------------------------------
  function hitBox(e) {
    if (e.t === 'plant') return { x: e.x, y: e.y + 2, w: e.w, h: Math.max(0, e.base - e.y - 2) };
    return e;
  }

  function defeat(e, how) {
    e.dead = true;
    if (how === 'stomp' && e.t === 'knuff') { e.st = 'flat'; e.tm = 0; e.vx = 0; }
    else {
      e.st = 'flip';
      e.vy = -3.5;
      e.vx = (e.vx >= 0 ? 0.6 : -0.6);
    }
  }

  function hurtBoss(e) {
    e.hp--;
    e.hurt = 70;
    Snd.sfx('bossHit');
    if (e.hp <= 0) {
      defeat(e, 'flip');
      S.bossDown = true;
      addScore(5000, e.x + e.w / 2, e.y);
      Snd.sfx('bossDown');
    }
  }

  function walker(e) {
    e.vy = Math.min(VMAX, e.vy + 0.3);
    if (moveX(e, e.vx)) e.vx = -e.vx;
    const r = moveY(e, e.vy);
    e.onGround = r === 1;
    if (r) e.vy = 0;
    if (e.ledge && e.onGround && e.vx) {
      // violetter Käfer: macht an der Kante einen kleinen Hüpfer und kehrt um
      const ax = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
      if (!solidOrSemi(Math.floor(ax / TILE), Math.floor((e.y + e.h + 1) / TILE))) { e.vx = -e.vx; e.vy = -2.4; }
    }
    if (e.vx) e.face = e.vx > 0 ? 1 : -1;
    e.anim += Math.abs(e.vx) * 0.12;
  }

  function updEnt(e) {
    const h = S.hero, d = S.diff;
    // besiegte Gegner fallen aus dem Bild
    if (e.dead) {
      if (e.st === 'flat') { if (++e.tm > 30) e.gone = true; return; }
      e.vy = Math.min(6, e.vy + 0.3);
      e.x += e.vx; e.y += e.vy;
      if (e.y > MAP_H * TILE + 32) e.gone = true;
      return;
    }
    switch (e.t) {
      case 'knuff':
        walker(e);
        break;
      case 'beetle':
        if (e.st === 'walk') walker(e);
        else if (e.st === 'shell') {
          e.vx = 0;
          walker(e);
          if (++e.tm > 420) { e.st = 'walk'; e.vx = (h.x < e.x ? -0.5 : 0.5) * d; e.tm = 0; }
        } else if (e.st === 'spin') {
          e.vy = Math.min(VMAX, e.vy + 0.3);
          if (moveX(e, e.vx)) {
            e.vx = -e.vx;
            if (e.x > S.camX - 16 && e.x < S.camX + VIEW_W) Snd.sfx('thud');
          }
          const r = moveY(e, e.vy);
          e.onGround = r === 1;
          if (r) e.vy = 0;
          if (e.grace > 0) e.grace--;
          e.anim += 0.5;
        }
        break;
      case 'bee':
        if (e.hop) {
          e.vy = Math.min(VMAX, e.vy + 0.18);
          if (moveX(e, e.vx)) e.vx = -e.vx;
          const r = moveY(e, e.vy);
          if (r === 1) e.vy = -4.2;
          else if (r === -1) e.vy = 0;
          e.face = e.vx > 0 ? 1 : -1;
        } else {
          e.ph += 0.045;
          e.x += e.vx;
          e.y = e.by + Math.sin(e.ph) * 22;
        }
        e.anim += 0.3;
        break;
      case 'plant': {
        const near = Math.abs(h.x + h.w / 2 - (e.x + e.w / 2)) < 30;
        if (e.st === 'hide') {
          e.y = e.base;
          if (--e.tm <= 0) { if (near) e.tm = 20; else e.st = 'up'; }
        } else if (e.st === 'up') {
          e.y -= 0.7;
          if (e.y <= e.base - 24) { e.y = e.base - 24; e.st = 'out'; e.tm = 70; }
        } else if (e.st === 'out') {
          if (--e.tm <= 0) e.st = 'down';
        } else {
          e.y += 0.7;
          if (e.y >= e.base) { e.y = e.base; e.st = 'hide'; e.tm = Math.round(80 / d); }
        }
        e.h = e.base - e.y;
        e.anim += 0.15;
        break;
      }
      case 'fish':
        if (e.st === 'wait') {
          e.y = e.base;
          if (--e.tm <= 0) { e.st = 'jump'; e.vy = -5.6; }
        } else {
          e.y += e.vy;
          e.vy += 0.18;
          if (e.vy > 0 && e.y >= e.base) { e.y = e.base; e.st = 'wait'; e.tm = Math.round(110 / d); }
        }
        e.anim += 0.2;
        break;
      case 'firebar':
        e.ang += e.spd;
        break;
      case 'flame':
        e.x += e.vx;
        e.anim += 0.3;
        if (e.x < S.camX - 48 || e.x > S.camX + VIEW_W + 48) e.gone = true;
        break;
      case 'boss':
        updBoss(e);
        break;
      case 'item':
        updItem(e);
        break;
    }
    // Aufräumen
    if (e.t !== 'boss' && e.t !== 'firebar') {
      if (e.x + e.w < S.camX - 3 * TILE || e.x > S.camX + VIEW_W + 6 * TILE) e.gone = true;
    } else if (e.t === 'firebar' && e.cx < S.camX - 4 * TILE) e.gone = true;
    if (e.y > MAP_H * TILE + 16) e.gone = true;
    else if (e.t !== 'fish' && e.t !== 'flame' && e.t !== 'firebar' && e.t !== 'bee' && !e.dead) {
      // Lava verschlingt alles
      const tx = Math.floor((e.x + e.w / 2) / TILE), ty = Math.floor((e.y + e.h - 2) / TILE);
      if (tileAt(tx, ty) === T.LAVA) {
        if (e.t === 'boss') {
          defeat(e, 'flip');
          S.bossDown = true;
          addScore(5000, e.x + e.w / 2, e.y);
          Snd.sfx('bossDown');
        } else e.gone = true;
      }
    }
  }

  function updBoss(e) {
    const h = S.hero, d = S.diff;
    if (e.hurt > 0) e.hurt--;
    if (S.mode !== 'play') {
      // Hebel gezogen: der Wächter erstarrt, zappelt und fällt mit der Brücke
      e.vx = 0;
      e.vy = Math.min(VMAX, e.vy + 0.22);
      if (moveY(e, e.vy)) e.vy = 0;
      e.face = (S.t >> 3) & 1 ? 1 : -1;
      e.anim += 0.3;
      return;
    }
    if (!e.awake) {
      if (e.x - h.x < 11 * TILE) e.awake = true; else return;
    }
    e.face = h.x + h.w / 2 < e.x + e.w / 2 ? -1 : 1;
    const sp = (e.hurt > 0 ? 0.9 : 0.45) * d;
    if (e.x <= e.minX) e.vx = sp; else if (e.x >= e.maxX) e.vx = -sp;
    else e.vx = Math.sign(e.vx || -1) * sp;
    moveX(e, e.vx);
    e.vy = Math.min(VMAX, e.vy + 0.22);
    const r = moveY(e, e.vy);
    e.onGround = r === 1;
    if (r) e.vy = 0;
    if (e.onGround && --e.jumpT <= 0) { e.vy = -4.4; e.jumpT = 140 + (S.lt * 7) % 90; }
    if (--e.fireT <= 0) {
      e.fireT = Math.round((150 + (S.lt * 13) % 70) / d);
      const high = (S.lt >> 3) % 3 === 1;
      const gy = e.y + e.h;
      S.ents.push({ t: 'flame', x: e.face < 0 ? e.x - 16 : e.x + e.w, y: high ? gy - 34 : gy - 15, w: 18, h: 8,
        vx: 1.5 * e.face * Math.min(1.4, d), vy: 0, st: 'fly', tm: 0, enemy: true, dead: false, gone: false,
        anim: 0, face: e.face });
      Snd.sfx('roar');
    }
    e.anim += 0.1;
  }

  function updPlat(e) {
    const ox = e.x, oy = e.y;
    if (e.kind === 'h') {
      e.ph += Math.PI * 2 / 240;
      e.x = e.x0 + (1 - Math.cos(e.ph)) * 40;
    } else if (e.kind === 'v') {
      e.ph += Math.PI * 2 / 300;
      e.y = e.y0 + (1 - Math.cos(e.ph)) * 48;
    } else if (e.st === 'fall') {
      if (++e.tm > 20) { e.vy = Math.min(3, e.vy + 0.08); e.y += e.vy; }
    }
    e.dx = e.x - ox;
    e.dy = e.y - oy;
  }

  function updItem(e) {
    e.anim++;
    if (e.st === 'rise') {
      e.y -= 0.5;
      if (e.y <= e.base) {
        e.y = e.base;
        e.st = 'move';
        if (e.kind === 'flower') e.vx = 0;
        else e.vx = (e.kind === 'star' ? 1.2 : 1.0);
        if (e.kind === 'star') e.vy = -3;
      }
      return;
    }
    if (e.kind === 'flower') return;
    e.vy = Math.min(VMAX, e.vy + (e.kind === 'star' ? 0.2 : 0.3));
    if (moveX(e, e.vx * e.dir)) e.dir = -e.dir;
    const r = moveY(e, e.vy);
    if (r === 1) e.vy = e.kind === 'star' ? -4 : 0;
    else if (r === -1) e.vy = 0;
  }

  function collectItem(e) {
    const h = S.hero;
    e.gone = true;
    const cx = e.x + e.w / 2, cy = e.y;
    switch (e.kind) {
      case 'berry':
        addScore(1000, cx, cy);
        if (h.power === 0) { setPower(1); h.grow = GROW_T; S.freeze = GROW_T; }
        Snd.sfx('grow');
        break;
      case 'flower':
        addScore(1000, cx, cy);
        if (h.power < 2) { setPower(2); h.grow = GROW_T; S.freeze = GROW_T; }
        Snd.sfx('grow');
        break;
      case 'star':
        addScore(1000, cx, cy);
        h.star = STAR_T;
        h.starCombo = 0;
        Snd.music('star');
        break;
      case 'clover':
        oneUp(cx, cy);
        break;
    }
  }

  // Berührungen Held <-> Figuren
  function interact() {
    const h = S.hero;
    // Fallgeschwindigkeit vor dem ersten Stampfer: zwei Gegner auf einmal zählen beide
    const vy0 = h.vy;
    for (const e of S.ents) {
      if (e.gone || S.mode !== 'play') continue;
      if (e.t === 'item') { if (e.st !== 'rise' || e.y < e.base + 6) { if (overlap(h, e)) collectItem(e); } continue; }
      if (e.dead || !e.enemy) continue;
      if (e.t === 'firebar') { if (firebarHits(e, h)) hurtHero(); continue; }
      const hb = hitBox(e);
      if (hb.h <= 0 || !overlap(h, hb)) continue;
      if (h.star > 0 && e.t !== 'boss') {
        if (e.t === 'fish' || e.t === 'flame') continue;
        defeat(e, 'flip');
        // eigene Kette für Sternsiege (auch am Boden): 100, 200, 400 …
        comboScore(Math.min(h.starCombo++, COMBO.length - 1), e.x + e.w / 2, e.y);
        Snd.sfx('kick');
        continue;
      }
      const fromAbove = vy0 > 0 && h.y + h.h - hb.y < Math.max(9, vy0 + 7);
      if (e.t === 'beetle' && e.st === 'shell') {
        // ruhenden Panzer wegkicken
        const dir = h.x + h.w / 2 < e.x + e.w / 2 ? 1 : -1;
        e.st = 'spin'; e.vx = dir * SHELL_V; e.grace = 12; e.chain = 0; e.tm = 0;
        addScore(400, e.x + e.w / 2, e.y);
        Snd.sfx('kick');
        if (fromAbove) bounce(h);
        else e.x = dir > 0 ? Math.max(e.x, h.x + h.w) : Math.min(e.x, h.x - e.w);
        continue;
      }
      if (fromAbove && e.stomp) {
        stomp(e);
        continue;
      }
      if (e.t === 'beetle' && e.st === 'spin' && e.grace > 0) continue;
      if (e.t === 'boss' && e.hurt > 40) continue;
      hurtHero();
    }
    // Panzer räumt ab, Läufer drehen voreinander um
    for (const e of S.ents) {
      if (e.gone || e.dead || !e.enemy) continue;
      const spin = e.t === 'beetle' && e.st === 'spin';
      const walks = e.t === 'knuff' || (e.t === 'beetle' && e.st === 'walk');
      if (!spin && !walks) continue;
      for (const o of S.ents) {
        if (o === e || o.gone || o.dead || !o.enemy || o.t === 'firebar' || o.t === 'flame' || o.t === 'boss') continue;
        const ob = hitBox(o);
        if (ob.h <= 0 || !overlap(e, ob)) continue;
        if (spin) {
          if (o.t === 'fish') continue;
          defeat(o, 'flip');
          const i = e.chain++;
          if (i < CHAIN.length) addScore(CHAIN[i], o.x + o.w / 2, o.y); else oneUp(o.x + o.w / 2, o.y);
          Snd.sfx('kick');
          if (o.t === 'beetle' && o.st === 'spin') { defeat(e, 'flip'); break; }
        } else if ((o.t === 'knuff' || o.t === 'beetle') && o.st !== 'spin') {
          if ((e.vx > 0 && o.x > e.x) || (e.vx < 0 && o.x < e.x)) e.vx = -e.vx;
        }
      }
    }
  }

  function bounce(h) {
    h.vy = held('j') || (S.auto && S.auto.j) ? -5.2 : -3.6;
    h.jumping = true;
    h.onGround = false;
    h.coyote = 0;
  }

  function stomp(e) {
    const h = S.hero;
    const cx = e.x + e.w / 2;
    if (e.t === 'boss') {
      bounce(h);
      h.vy = -5.6;
      h.y = Math.min(h.y, e.y - h.h);
      if (e.hurt <= 0) hurtBoss(e);
      return;
    }
    if (e.t === 'beetle') { e.st = 'shell'; e.vx = 0; e.tm = 0; }
    else defeat(e, 'stomp');
    comboScore(S.combo++, cx, e.y);
    bounce(h);
    Snd.sfx('stomp');
    fx.push({ k: 'puff', x: cx, y: e.y + e.h, t: 0, life: 10 });
  }

  function firebarPos(e, i) {
    const r = i * 8;
    return [e.cx + Math.cos(e.ang) * r, e.cy + Math.sin(e.ang) * r];
  }
  function firebarHits(e, h) {
    for (let i = 1; i < e.n; i++) {
      const p = firebarPos(e, i);
      const nx = clamp(p[0], h.x, h.x + h.w), ny = clamp(p[1], h.y, h.y + h.h);
      if ((p[0] - nx) * (p[0] - nx) + (p[1] - ny) * (p[1] - ny) < 12) return true;
    }
    return false;
  }

  function updPlats() {
    for (const e of S.ents) if (e.t === 'plat' && !e.gone) updPlat(e);
  }
  function updOthers() {
    const n = S.ents.length;
    for (let i = 0; i < n; i++) {
      const e = S.ents[i];
      if (e.gone) continue;
      if (e.t !== 'plat') updEnt(e);
      else if (e.x + e.w < S.camX - 6 * TILE || e.y > MAP_H * TILE + 16) e.gone = true;
    }
    S.ents = S.ents.filter(e => !e.gone);
  }

  // ------------------------------------------------------------
  //  Ziel: Fahnenmast, Hebel der Burg
  // ------------------------------------------------------------
  function goalX() { const L = lev(); return L.goal ? L.goal.x * TILE + 8 : Infinity; }

  function startFlag() {
    const L = lev(), h = S.hero;
    const base = L.goal.y * TILE;               // Oberkante des Fußblocks
    const poleTop = base - 9 * TILE;
    const height = (base - (h.y + h.h)) / TILE;
    const pts = height >= 8 ? 5000 : height >= 6 ? 2000 : height >= 4 ? 800 : height >= 2 ? 400 : 100;
    addScore(pts, goalX() + 14, Math.max(poleTop, h.y));
    S.mode = 'clear';
    S.cl = { kind: 'flag', ph: 'slide', t: 0, flagY: poleTop + 6, base, pts, fw: height >= 8 ? 3 : height >= 6 ? 1 : 0 };
    h.x = goalX() - h.w; h.vx = 0; h.vy = 0; h.face = 1; h.star = 0;
    if (h.duck) setDuck(h, false);
    if (h.y < poleTop) h.y = poleTop;
    S.balls = [];
    Snd.stop();
    Snd.sfx('flag');
  }

  function startLever() {
    const L = lev(), h = S.hero;
    S.mode = 'clear';
    const tiles = [];
    for (let x = L.lever.x - 1; x >= 0; x--) {
      let any = false;
      for (let y = 0; y < MAP_H; y++) if (tileAt(x, y) === T.BRIDGE) { tiles.push([x, y]); any = true; }
      if (!any && tiles.length) break;
    }
    // Kamera fährt zurück, damit Brücke und Wächter beim Einsturz im Bild sind
    const camTo = clamp((L.lever.x - 14.5) * TILE, 0, S.W * TILE - VIEW_W);
    S.cl = { kind: 'lever', ph: 'bridge', t: 0, tiles, i: 0, fw: 0, pull: 0, boom: 0, camTo, gy: (L.lever.y + 1) * TILE };
    // Held stellt sich links neben den Hebel (aus einem Sprung fällt er erst herunter)
    if (h.duck && canStand(h)) setDuck(h, false);
    const nx = L.lever.x * TILE + 1 - h.w;
    if (boxFree(nx, h.y, h.w, h.h)) h.x = nx;
    h.vx = 0; h.face = 1; h.star = 0; h.starCombo = 0; h.inv = 0; h.throwT = 0; h.jumping = false;
    if (h.vy < 0) h.vy = 0;
    h.onGround = h.y + h.h >= S.cl.gy - 0.01;
    if (h.onGround) h.y = S.cl.gy - h.h;
    for (const e of S.ents) if (e.t === 'flame') e.gone = true;
    S.balls = [];
    Snd.stop();
  }

  // Burg: Held landet, zieht den Hebel, hüpft später vor Freude
  function leverHero(c, h) {
    if (!h.onGround) {
      h.vy = Math.min(VMAX, h.vy + 0.3);
      h.y += h.vy;
      if (h.y + h.h >= c.gy) { h.y = c.gy - h.h; h.vy = 0; h.onGround = true; }
    } else if (c.ph === 'bridge' && c.pull < 30) {
      if (++c.pull === 10) Snd.sfx('lever');
    }
  }
  // ein paar Feuerwerkskörper unter der Burgdecke
  function leverFw(c) {
    if (c.boom >= 3 || c.t % 28 !== 10) return;
    c.boom++;
    fx.push({ k: 'fw', x: S.camX + (3 + c.boom * 3.5) * TILE, y: (6 + (c.boom * 5) % 3) * TILE, t: 0, life: 40, c: c.boom * 3 });
    Snd.sfx('boom');
  }

  function updCamera() {
    const h = S.hero;
    const want = h.x + h.w / 2 - CAM_LEAD;
    if (want > S.camX) S.camX = Math.min(want, S.W * TILE - VIEW_W);
  }

  function updClear() {
    const c = S.cl, h = S.hero;
    c.t++;
    if (c.kind === 'flag') {
      if (h.hidden) c.hf = Math.min(1, (c.hf || 0) + 0.03);
      if (c.ph === 'slide') {
        let done = true;
        if (h.y + h.h < c.base) { h.y = Math.min(c.base - h.h, h.y + 2.2); done = false; }
        if (c.flagY < c.base - 22) { c.flagY = Math.min(c.base - 22, c.flagY + 2.2); done = false; }
        h.anim += 0.15;
        if (done && c.t > 30) { c.ph = 'turn'; c.t = 0; h.x = goalX() + 1; h.face = -1; Snd.jingle('clear'); }
      } else if (c.ph === 'turn') {
        if (c.t > 24) { c.ph = 'walk'; c.t = 0; h.face = 1; }
      } else if (c.ph === 'walk') {
        const L = lev();
        S.auto = { l: false, r: true, d: false, u: false, j: false, x: false };
        updHero(S.auto);
        updCamera();
        const gx = L.gate ? L.gate.x * TILE + 2 : S.W * TILE;
        if (h.x >= gx || c.t > 400) { h.hidden = true; c.ph = 'wait'; c.t = 0; }
      } else if (c.ph === 'wait') {
        if (c.t > 50) { c.ph = 'count'; c.t = 0; }
      } else if (c.ph === 'count') countTime(c);
      else if (c.ph === 'fw') {
        if (c.t % 40 === 1 && c.fw > 0) {
          c.fw--;
          addScore(500);
          fx.push({ k: 'fw', x: S.camX + (5 + (c.t * 7) % 9) * TILE, y: (3 + (c.t * 3) % 4) * TILE, t: 0, life: 40, c: c.t });
          Snd.sfx('boom');
        }
        if (c.fw <= 0 && c.t > 60) { c.ph = 'done'; c.t = 0; }
      } else if (c.t > 80) nextLevel();
    } else {
      // Burg: Hebel ziehen, Brücke stürzt ein, der Wächter fällt (wird in allen Phasen weiterbewegt)
      for (const e of S.ents) if (!e.gone && (e.t === 'boss' || e.dead)) updEnt(e);
      S.ents = S.ents.filter(e => !e.gone);
      leverHero(c, h);
      // Kamera gleitet zurück auf Brücke und Wächter
      const dc = c.camTo - S.camX;
      S.camX = Math.abs(dc) <= 1 ? c.camTo : S.camX + Math.sign(dc) * Math.max(1, Math.abs(dc) * 0.12);
      if (c.ph === 'bridge') {
        if (c.pull >= 20 && c.t % 4 === 0 && c.i < c.tiles.length) {
          const [x, y] = c.tiles[c.i++];
          setTile(x, y, T.AIR);
          particle('deb', x * TILE + 8, y * TILE + 8, 0, 0.5, 60, S.li);
          Snd.sfx('crumble');
        }
        const falling = S.ents.some(e => e.t === 'boss' && !e.dead);
        if (c.i >= c.tiles.length && c.pull >= 20 && c.t > 100 && (!falling || c.t > 450)) {
          c.ph = 'wait'; c.t = 0;
          Snd.jingle('clear');
        }
      } else if (c.ph === 'wait') {
        if (c.t === 14 || c.t === 46) { h.vy = -3.4; h.onGround = false; }
        if (c.t > 90) { c.ph = 'count'; c.t = 0; }
      } else if (c.ph === 'count') { leverFw(c); countTime(c); }
      else if (c.ph === 'fw') { c.ph = 'done'; c.t = 0; }
      else { leverFw(c); if (c.t > 100) nextLevel(); }
    }
  }

  function countTime(c) {
    if (S.time > 0) {
      const n = Math.min(S.time, 2);
      S.time -= n;
      S.score += 50 * n;
      if (c.t % 3 === 0) Snd.sfx('tick');
    } else if (c.t > 2) { c.ph = c.fw > 0 ? 'fw' : 'done'; c.t = 0; }
  }

  // ------------------------------------------------------------
  //  Ablauf
  // ------------------------------------------------------------
  function themeKey() { return ['wiese', 'hoehle', 'wipfel', 'burg'][lev().def.theme]; }
  function worldName(lvl) { return (Math.floor(lvl / NUM_LEVELS) + 1) + '-' + (lvl % NUM_LEVELS + 1); }

  function toTitle(fromOver) {
    S.mode = 'title'; S.modeT = 0;
    S.lock = fromOver ? TITLE_LOCK : 0;
    S.held = {}; S.ptrs = {};
    S.jumpBuf = 0; S.fireReq = false;
    Snd.stop();
  }

  function startGame() {
    S.lvl = S.sel;
    S.score = 0; S.coins = 0; S.lives = 3; S.keepPower = 0; S.check = false;
    S.hiOld = hi; S.newHi = false;
    startIntro();
  }

  function startIntro() {
    S.mode = 'intro'; S.modeT = 0;
    loadLevel(S.lvl % NUM_LEVELS, S.check);
    Snd.stop();
    Snd.jingle('start');
  }

  function beginPlay() {
    S.mode = 'play'; S.modeT = 0;
    Snd.music(themeKey());
    if (S.hurry) Snd.setHurry(true);
  }

  function nextLevel() {
    S.keepPower = S.hero.power;
    S.lvl++;
    S.check = false;
    startIntro();
  }

  function afterDeath() {
    S.lives--;
    if (S.lives <= 0) gameOver();
    else startIntro();
  }

  function gameOver() {
    S.mode = 'over'; S.modeT = 0;
    S.newHi = S.score > S.hiOld && S.score > 0;
    saveHi();
    Snd.stop();
    Snd.jingle('over');
  }

  function saveHi() {
    if (S && S.score > hi) {
      hi = S.score;
      Core.storage.set('hopper.hi', hi);
    }
  }

  function pause() {
    if (!['play', 'dying', 'clear', 'intro'].includes(S.mode)) return;
    S.pausedFrom = S.mode;
    S.mode = 'paused';
    S.pauseSel = 0;
    // gehaltene Tasten und Finger bleiben gültig (das Gamepad wiederholt nicht); nur Puffer leeren
    S.jumpBuf = 0; S.fireReq = false;
    Snd.sfx('pause');
    Snd.pause();
  }
  function resume() {
    if (S.mode !== 'paused') return;
    S.mode = S.pausedFrom || 'play';
    S.pausedFrom = null;
    Snd.resume();
    Snd.sfx('select');
  }
  function releaseAll() { S.held = {}; S.ptrs = {}; S.jumpBuf = 0; S.fireReq = false; }

  function updPlay() {
    S.lt++;
    const h = S.hero;
    if (h.grow > 0) h.grow--; else if (h.grow < 0) h.grow++;
    if (S.freeze > 0) { S.freeze--; return; }
    if (++S.timeT >= TIME_TICKS) {
      S.timeT = 0;
      S.time--;
      if (S.time === 100) { S.hurry = true; Snd.setHurry(true); Snd.sfx('hurry'); }
      if (S.time <= 0) { S.time = 0; killHero('time'); return; }
    }
    spawnActors();
    updPlats();
    if (S.fireReq) { S.fireReq = false; throwFire(); }
    updHero(readInput());
    if (S.mode !== 'play') return;
    updOthers();
    updBalls();
    interact();
    if (S.mode !== 'play') return;
    updCamera();
    // Zwischenfahne und Ziel
    const L = lev();
    if (L.check && !S.check && h.x >= L.check.x * TILE) {
      S.check = true;
      Snd.sfx('check');
      popup('PRIMA!', L.check.x * TILE + 8, L.check.y * TILE - 20, '#ffe14a');
    }
    if (L.goal && h.x + h.w >= goalX() - 1) startFlag();
    // Hebel: die ganze Spalte zählt, auch im Sprung darüber hinweg
    else if (L.lever && h.x + h.w >= L.lever.x * TILE + 2) startLever();
    if (S.jumpBuf > 0) S.jumpBuf--;
  }

  function updDying() {
    const h = S.hero;
    S.modeT++;
    if (S.dieKind !== 'pit') {
      if (S.modeT === 36) h.vy = -6;
      if (S.modeT > 36) { h.vy = Math.min(6, h.vy + 0.25); h.y += h.vy; }
    }
    if (S.modeT >= 200) afterDeath();
  }

  function updFx() {
    for (const p of fx) {
      p.t++;
      if (p.k === 'deb') { p.vy += 0.3; p.x += p.vx; p.y += p.vy; }
      else if (p.k === 'coin') { p.vy += 0.3; p.y += p.vy; }
      else if (p.k === 'pop') p.y -= 0.6;
      else if (p.k === 'dust') { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; }
    }
    for (let i = fx.length - 1; i >= 0; i--) {
      const p = fx[i];
      if (p.t >= p.life) {
        if (p.k === 'coin') popup(200, p.x, p.y + 8, '#ffe14a');
        fx.splice(i, 1);
      }
    }
    if (fx.length > 160) fx.splice(0, fx.length - 160);
  }

  // ------------------------------------------------------------
  //  Vorführung (Titel): echte Physik auf einer Mini-Strecke, einfacher Autopilot
  // ------------------------------------------------------------
  function newAttract() {
    const keep = S;
    const a = newState();
    S = a;
    try {
      a.lvl = 0;
      loadLevel(-1, false);
      a.mode = 'play';
    } finally { S = keep; }
    return a;
  }

  function attractInput() {
    const h = S.hero;
    const inp = { l: false, r: true, d: false, u: false, j: false, x: false };
    if (h.onGround) {
      const fy = Math.floor((h.y + h.h - 1) / TILE);
      const ax = h.x + h.w + 10;
      // Lücken nur vom Boden aus überspringen; von Blöcken und Röhren einfach heruntergehen (bleibt im Bildstreifen)
      const low = h.y + h.h >= 17 * TILE - 0.5;
      let want = solidAt(Math.floor(ax / TILE), fy) || (low && !solidOrSemi(Math.floor((ax + 4) / TILE), fy + 1));
      // nächster Gegner voraus auf gleicher Höhe
      let foe = Infinity;
      for (const e of S.ents) {
        if (!e.enemy || e.dead || e.x + e.w < h.x || Math.abs(e.y + e.h - h.y - h.h) >= 24) continue;
        foe = Math.min(foe, e.x - (h.x + h.w));
      }
      if (foe < 46) want = true;
      else if (foe > 100) {
        const qx = Math.floor((h.x + h.w / 2 + 6) / TILE);
        for (let ty = fy - 4; ty < fy - 1; ty++) if (QBLOCK[tileAt(qx, ty)]) want = true;
      }
      if (want && !(S.auto && S.auto.j)) { S.jumpBuf = JBUF; S.autoJ = 16; }
    }
    if (S.autoJ > 0) { S.autoJ--; inp.j = true; }
    return inp;
  }

  function updAttract() {
    if (!A || A.mode !== 'play' || A.hero.x > (A.W - 17) * TILE || A.lt > 3000) A = newAttract();
    const keep = S;
    S = A; quiet = true;
    try {
      S.auto = attractInput();
      updPlay();
    } finally { S = keep; quiet = false; }
  }

  // ------------------------------------------------------------
  //  Hauptschleife
  // ------------------------------------------------------------
  function update() {
    if (!S || S.mode === 'off') return;
    S.t++;
    Snd.tick();
    switch (S.mode) {
      case 'title':
        S.modeT++;
        if (S.lock > 0) S.lock--;
        updAttract();
        break;
      case 'intro': if (++S.modeT >= 150) beginPlay(); break;
      case 'play': updPlay(); break;
      case 'dying': updDying(); break;
      case 'clear': updClear(); break;
      case 'over': if (++S.modeT >= 480) toTitle(true); break;
      case 'paused': return;
    }
    updFx();
  }

  // ------------------------------------------------------------
  //  Pixelgrafik: Bitmaps -> vorberechnete Rechtecke (zeilenweise Läufe,
  //  senkrecht zusammengefasst, nach Farbe gruppiert, gespiegelt vorrätig)
  // ------------------------------------------------------------
  function compile(rows, pal, base) {
    const h = rows.length, w = rows[0].length;
    const open = new Map(), done = [];
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < w;) {
        const ch = row[x];
        if (ch === '.' || ch === base || !pal[ch]) { x++; continue; }
        let e = x + 1;
        while (e < w && row[e] === ch) e++;
        const key = x * 64 + (e - x) + ch;
        const r = open.get(key);
        if (r && r.y + r.h === y) r.h++;
        else { const n = { x, y, w: e - x, h: 1, ch }; open.set(key, n); done.push(n); }
        x = e;
      }
    }
    const groups = new Map();
    for (const r of done) {
      const c = pal[r.ch];
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(r.x, r.y, r.w, r.h);
    }
    const g = [], gf = [];
    for (const [c, a] of groups) {
      g.push({ c, r: a });
      const m = [];
      for (let i = 0; i < a.length; i += 4) m.push(w - a[i] - a[i + 2], a[i + 1], a[i + 2], a[i + 3]);
      gf.push({ c, r: m });
    }
    return { w, h, g, gf, base: base ? pal[base] : null, n: done.length };
  }
  const vflip = rows => rows.slice().reverse();
  const hflip = rows => rows.map(r => r.split('').reverse().join(''));
  // Kacheln zusätzlich zerlegt: volle Zeilen (hs) werden über ganze Kachelläufe gezogen,
  // volle Spalten (vs) über ganze Säulen, nur der Rest (sp) kommt je Kachel
  function tileC(rows, pal, base) {
    const s = compile(rows, pal, base);
    const n = rows.length, w = rows[0].length;
    const mask = rows.map(r => r.split(''));
    const hs = new Map(), vs = new Map();
    const add = (m, c, r) => { if (!m.has(c)) m.set(c, []); m.get(c).push(...r); };
    for (const ch of new Set(rows.join(''))) {
      if (ch === '.' || ch === base || !pal[ch]) continue;
      const full = ch.repeat(w);
      for (let y = 0; y < n;) {
        if (rows[y] !== full) { y++; continue; }
        let e = y + 1;
        while (e < n && rows[e] === full) e++;
        add(hs, pal[ch], [0, y, w, e - y]);
        for (let yy = y; yy < e; yy++) mask[yy].fill('.');
        y = e;
      }
      const colFull = x => rows.every(r => r[x] === ch);
      for (let x = 0; x < w;) {
        if (!colFull(x)) { x++; continue; }
        let e = x + 1;
        while (e < w && colFull(e)) e++;
        add(vs, pal[ch], [x, 0, e - x, n]);
        for (const m of mask) m.fill('.', x, e);
        x = e;
      }
    }
    s.hs = [...hs].map(([c, r]) => ({ c, r }));
    s.vs = [...vs].map(([c, r]) => ({ c, r }));
    s.hk = JSON.stringify(s.hs);
    s.vk = JSON.stringify(s.vs);
    s.sp = compile(mask.map(m => m.join('')), pal, base).g;
    return s;
  }

  // ------------------------------------------------------------
  //  Zeichnen: Grundfunktionen

  let ox = 0;                          // Kameraversatz in Einheiten (auf 1/16 gerundet)
  const FT = 0.012;                    // kleine Überlappung der Figurenpixel
  let TE = 0.025;                      // Kacheln/Flächen: Rand je Seite (≈ 0,5 Bildpunkt, je Bild aus Core.unitPx())
  function spr(s, x, y, flip, sc) {
    const ctx = Core.ctx, k = sc || PX, gs = flip ? s.gf : s.g;
    for (let i = 0; i < gs.length; i++) {
      const gr = gs[i], r = gr.r;
      ctx.fillStyle = gr.c;
      for (let j = 0; j < r.length; j += 4) {
        ctx.fillRect(x + r[j] * k, y + r[j + 1] * k, r[j + 2] * k + FT, r[j + 3] * k + FT);
      }
    }
  }
  // Figur an Weltposition: Mitte x, Unterkante y (Pixel)
  function put(s, cx, by, flip) {
    spr(s, Math.round(((cx - s.w / 2) * PX + ox) * 64) / 64, Math.round((MAP_Y + (by - s.h) * PX) * 64) / 64, flip);
  }
  function rect(x, y, w, h, c) {
    const ctx = Core.ctx;
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, h);
  }
  function txt(s, x, y, c, size, align) { Core.drawText(s, x, y, c, size || 1, align || 'left'); }
  function rrect(x, y, w, h, r) {
    const ctx = Core.ctx;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  const hash = (a, b) => {
    let n = (a * 374761393 + b * 668265263) | 0;
    n = (n ^ (n >>> 13)) * 1274126177 | 0;
    return ((n ^ (n >>> 16)) >>> 0) % 1000;
  };
  const pad = (n, l) => String(Math.max(0, Math.floor(n))).padStart(l, '0');

  // ------------------------------------------------------------
  //  Hintergründe (Parallaxe)
  // ------------------------------------------------------------
  function layer(period, f, fn) {
    const off = S.camX * PX * f;
    const k0 = Math.floor(off / period) - 1;
    const k1 = Math.floor((off + COLS) / period) + 1;
    for (let k = k0; k <= k1; k++) fn(k * period - off, k);
  }
  // Pixelscheibe aus waagrechten Streifen (Raster 1/4 Einheit, Streifen überlappen um ~1 Bildpunkt)
  function pixDisc(cx, cy, r, c) {
    const ctx = Core.ctx, st = 0.25, n = Math.ceil(r / st);
    ctx.fillStyle = c;
    for (let i = -n; i < n; i++) {
      const yy = (i + 0.5) * st, hw = Math.round(Math.sqrt(Math.max(0, r * r - yy * yy)) / st) * st;
      if (hw > 0) ctx.fillRect(cx - hw, cy + i * st, 2 * hw, st + 2 * TE);
    }
  }
  // Stufenkuppel (Hügel, Wolken, Büsche): jede Stufe reicht bis zum Fuß, keine Linien dazwischen
  function dome(cx, by, w, h, steps, c) {
    if (cx + w / 2 < 0 || cx - w / 2 > COLS) return;
    const ctx = Core.ctx;
    ctx.fillStyle = c;
    const sh = h / steps;
    for (let i = 0; i < steps; i++) {
      const f = Math.sqrt(1 - Math.pow(i / steps, 2));
      const ww = Math.round(w * f * 8) / 8;
      ctx.fillRect(cx - ww / 2, by - (i + 1) * sh, ww, (i + 1) * sh);
    }
  }
  function cloud(x, y, s, c1, c2) {
    if (x + 3 * s < 0 || x - 3 * s > COLS) return;
    dome(x, y, 4 * s, 1.6 * s, 4, c1);
    dome(x - 1.6 * s, y, 2.6 * s, 1.0 * s, 3, c1);
    dome(x + 1.7 * s, y, 2.8 * s, 1.15 * s, 3, c1);
    rect(x - 2.9 * s, y - 0.25 * s, 5.9 * s, 0.25 * s, c2);
  }
